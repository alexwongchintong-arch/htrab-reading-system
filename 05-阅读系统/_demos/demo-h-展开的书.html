<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo H · 展开的书（笔记页 × 回顾页）</title>
<style>
  :root{
    --ink:#3a2f22; --ink2:#6f6250; --ink3:#9a8c72;
    --line:#e3d9c2; --line2:#cfc2a4;
    --page-hi:#fdf9ef; --page-lo:#f3ebd7;
    --js:#2f7d6d; --zd:#b4632c; --fx:#2f4b7d; --gilt:#d8b872;
    --accent:#b4632c; --accent-weak:rgba(180,99,44,.14);
    --radius:12px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:
      radial-gradient(1300px 520px at 50% -260px, rgba(255,248,230,.55), transparent 70%),
      repeating-linear-gradient(0deg, rgba(110,90,60,.045) 0 1px, transparent 1px 4px),
      linear-gradient(165deg,#cdc0a1,#b3a37e);
    color:var(--ink);
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:15px;line-height:1.75;
    min-height:100vh;padding:0 0 46px;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}

  /* ---------- 层次色（按页签作用域覆盖 --accent） ---------- */
  .lv-js{--accent:#2f7d6d;--accent-weak:rgba(47,125,109,.14)}
  .lv-zd{--accent:#b4632c;--accent-weak:rgba(180,99,44,.14)}
  .lv-fx{--accent:#2f4b7d;--accent-weak:rgba(47,75,125,.14)}

  /* ---------- 顶栏 ---------- */
  .strip{
    display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;
    margin:0 34px;padding:12px 6px;
    border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);
    font-size:13px;color:#544735;letter-spacing:1px;
  }
  .strip .lv{display:flex;gap:18px;white-space:nowrap}
  .strip .lv b{font-weight:700;color:var(--ink);position:relative;padding-left:13px}
  .strip .lv b::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:1px}
  .strip .lv .j::before{background:var(--js)} .strip .lv .z::before{background:var(--zd)} .strip .lv .f::before{background:var(--fx)}
  .mast{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:22px 40px 6px}
  .mast h1{font-size:clamp(26px,2.4vw,40px);font-weight:900;letter-spacing:.12em;line-height:1.2}
  .mast .sub{margin-top:6px;font-size:12.5px;color:var(--ink2);letter-spacing:2px}
  .mast .sub b{color:var(--ink)}
  .ops{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .obtn{
    font-size:12.5px;letter-spacing:2px;padding:7px 16px;color:#5c4a32;text-decoration:none;
    background:linear-gradient(180deg,#e8d9ae,#c9ae74);border:1px solid #9a7c46;border-radius:3px;
    box-shadow:inset 0 1px 0 rgba(255,245,215,.7), 0 1px 2px rgba(60,40,15,.35);
  }
  .obtn:hover{filter:brightness(1.05)}
  .obtn.on{background:linear-gradient(180deg,#5c4a32,#463622);color:#ecd9a4;border-color:#3a2c18;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}

  /* ---------- 书本 ---------- */
  .desk{display:flex;justify-content:center;padding:22px 46px 8px}
  .book{
    position:relative;display:flex;width:100%;
    min-height:calc(100vh - 190px);
    filter:drop-shadow(0 30px 42px rgba(56,40,16,.38));
  }
  /* 中缝 */
  .book::before{
    content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;z-index:4;pointer-events:none;
    background:linear-gradient(180deg,rgba(66,48,22,.32),rgba(66,48,22,.14) 30%,rgba(66,48,22,.14) 70%,rgba(66,48,22,.32));
  }
  /* 书口（左右页摞）：横纹、止于页脚圆角之上 */
  .edge{
    position:absolute;top:6px;bottom:12px;width:9px;z-index:3;
    background:repeating-linear-gradient(0deg,#f2ead4 0 1.4px,#d9ccab 1.4px 2.6px);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.5);
  }
  .edge-l{left:-8px;border-radius:5px 0 0 0}
  .edge-r{right:-8px;border-radius:0 5px 0 0}
  /* 下方页摞：通宽垫在侧条之下，遮住转角接缝 */
  .book::after{
    content:"";position:absolute;left:-8px;right:-8px;bottom:-8px;height:12px;z-index:-1;
    background:repeating-linear-gradient(0deg,#f2ead4 0 1.4px,#d9ccab 1.4px 2.6px);
    border-radius:0 0 8px 8px;box-shadow:inset 0 -2px 2px rgba(90,70,40,.25);
  }

  /* ---------- 书页 ---------- */
  .page{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .page-l{
    border-radius:10px 3px 3px 10px;
    background:
      linear-gradient(270deg, rgba(70,50,24,.20), rgba(70,50,24,.07) 52px, rgba(70,50,24,0) 110px),
      radial-gradient(120% 100% at 0% 0%, rgba(255,255,255,.5), transparent 60%),
      repeating-linear-gradient(0deg, rgba(120,95,60,.02) 0 2px, transparent 2px 5px),
      linear-gradient(180deg, var(--page-hi), var(--page-lo));
  }
  .page-r{
    border-radius:3px 10px 10px 3px;
    background:
      linear-gradient(90deg, rgba(70,50,24,.20), rgba(70,50,24,.07) 52px, rgba(70,50,24,0) 110px),
      radial-gradient(120% 100% at 100% 0%, rgba(255,255,255,.5), transparent 60%),
      repeating-linear-gradient(0deg, rgba(120,95,60,.02) 0 2px, transparent 2px 5px),
      linear-gradient(180deg, var(--page-hi), var(--page-lo));
  }
  /* 丝带书签：标记当前层次 */
  .ribbon{
    position:absolute;top:0;right:14px;width:22px;height:88px;z-index:6;pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(0,0,0,.18)), var(--accent);
    clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);
    box-shadow:2px 3px 6px rgba(50,35,15,.35);
  }

  /* ---------- 页眉 / 页脚 ---------- */
  .phead{flex:none;padding:20px 46px 12px;border-bottom:1px solid var(--line);position:relative}
  .page-l .phead{padding-right:58px}
  .page-r .phead{padding-left:58px}
  .phead-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .runhead{font-size:13px;letter-spacing:3px;color:var(--ink2);font-weight:700}
  .phead-sub{font-size:11px;color:var(--ink3);letter-spacing:1px}

  .pfoot{flex:none;display:flex;justify-content:space-between;align-items:center;padding:9px 46px 12px;
    font-family:Georgia,serif;font-size:12px;color:var(--ink3);border-top:1px solid var(--line)}
  .page-l .pfoot{padding-right:58px}
  .page-r .pfoot{padding-left:58px}
  .pfoot .orn{font-family:"Songti SC","STSong",serif;letter-spacing:2px;font-size:11px}

  /* ---------- 右缘索引签（回顾层次） ---------- */
  .edgetabs{position:absolute;right:-34px;top:64px;display:flex;flex-direction:column;gap:10px;z-index:8}
  .etab{
    writing-mode:vertical-rl;letter-spacing:4px;font-size:12.5px;font-weight:600;color:#f6efdc;
    padding:16px 8px;border-radius:0 7px 7px 0;opacity:.8;
    box-shadow:2px 2px 6px rgba(50,35,15,.35);transition:.15s;
  }
  .etab:hover{transform:translateX(3px);opacity:.95}
  .etab.on{transform:translateX(5px);opacity:1}
  .etab.lv-js{background:linear-gradient(180deg,#37917d,#2f7d6d)}
  .etab.lv-zd{background:linear-gradient(180deg,#c97537,#b4632c)}
  .etab.lv-fx{background:linear-gradient(180deg,#3a5b93,#2f4b7d)}

  /* ---------- 左缘步骤签（当前层次的步骤） ---------- */
  .edgetabs-l{position:absolute;left:-34px;top:64px;display:flex;flex-direction:column;gap:10px;z-index:8}
  .etab-l{
    writing-mode:vertical-rl;letter-spacing:3px;font-size:12.5px;font-weight:600;color:#f6efdc;
    padding:16px 8px;border-radius:7px 0 0 7px;opacity:.8;display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(0,0,0,.12)), var(--accent);
    box-shadow:-2px 2px 6px rgba(50,35,15,.35);transition:.15s;
  }
  .etab-l:hover{transform:translateX(-3px);opacity:.95}
  .etab-l.on{transform:translateX(-5px);opacity:1}
  .etab-l .fdot{width:7px;height:7px;border-radius:50%;background:rgba(246,239,220,.45)}
  .etab-l.has .fdot{background:var(--gilt)}

  /* ---------- 页内内容区（书页随内容自然长高，不再限高滚动） ---------- */
  .sheet{flex:1 0 auto;padding:18px 46px 30px}
  .page-l .sheet{padding-right:58px}
  .page-r .sheet{padding-left:58px}

  /* 翻页微动画 */
  @keyframes flipL{0%{opacity:.15;transform:perspective(1500px) rotateY(6deg)}100%{opacity:1;transform:none}}
  @keyframes flipR{0%{opacity:.15;transform:perspective(1500px) rotateY(-6deg)}100%{opacity:1;transform:none}}
  .flip-l{animation:flipL .5s cubic-bezier(.22,.8,.3,1);transform-origin:100% 50%}
  .flip-r{animation:flipR .5s cubic-bezier(.22,.8,.3,1);transform-origin:0 50%}

  /* ---------- 表单组件（移植自阅读系统，换成书面纸色） ---------- */
  .kicker{color:var(--accent);font-size:12px;letter-spacing:2px;margin-bottom:6px}
  .kicker .deliv{background:var(--accent-weak);border-radius:6px;padding:2px 8px;margin-left:8px;letter-spacing:0}
  h2{margin:0 0 10px;font-size:21px;letter-spacing:.5px;line-height:1.4}
  h3.rv-h{margin:0 0 10px;font-size:17px;letter-spacing:.5px;line-height:1.45}
  .goal{color:var(--ink2);margin:0 0 16px;font-size:14px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px;font-weight:700}
  .fhint{color:var(--ink3);font-size:12px;margin:6px 0 0}
  input[type=text],textarea{
    width:100%;background:#fffdf6;border:1px solid var(--line2);border-radius:8px;
    padding:8px 11px;color:var(--ink);font:inherit;line-height:1.7;outline:none;resize:none;
  }
  input[type=text]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  textarea{min-height:60px}

  .fbox{border:1px solid var(--line2);border-radius:10px;background:rgba(255,253,246,.5);padding:13px 15px 2px;margin-bottom:14px}
  .fbox-t{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:1.5px;margin-bottom:10px}
  .half-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  .list-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .list-row{display:flex;gap:8px;align-items:flex-start;background:#fffdf6;border:1px solid var(--line);border-radius:9px;padding:6px 10px}
  .list-row .idx{flex:0 0 auto;color:var(--ink3);font-size:12.5px;padding-top:7px;min-width:18px;text-align:right}
  .list-row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .list-row textarea,.list-row input[type=text]{
    border:none;border-bottom:1px dashed var(--line2);border-radius:0;min-height:0;padding:4px 2px;background:transparent;box-shadow:none;overflow-y:hidden;
  }
  .list-row textarea:focus,.list-row input[type=text]:focus{border-bottom-color:var(--accent);box-shadow:none}
  .row-remove{flex:0 0 26px;color:var(--ink3);font-size:15px;padding:4px 0;line-height:1.4}
  .row-remove:hover{color:#b0473b}
  .list-add{border:1px dashed var(--line2);border-radius:8px;color:var(--ink3);padding:5px 14px;font-size:13px}
  .list-add:hover{color:var(--accent);border-color:var(--accent)}
  .list-empty{color:var(--ink3);font-size:13px;padding:6px 2px}

  .choice{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#fffdf6;border:1px solid var(--line2);border-radius:999px;padding:4px 14px;font-size:13px;color:var(--ink2)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .row-chips{display:flex;flex-wrap:wrap;gap:6px}
  .row-chip{background:#fffdf6;border:1px solid var(--line2);border-radius:999px;padding:2px 11px;font-size:12px;color:var(--ink3)}
  .row-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .cards{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
  .gcard{border:1px solid var(--line2);border-radius:10px;background:#fffdf6;overflow:hidden}
  .gcard-head{display:flex;gap:8px;align-items:center;background:var(--accent-weak);padding:7px 12px;border-bottom:1px solid var(--line)}
  .gcard-head .gi{flex:0 0 auto;color:var(--accent);font-weight:700;font-size:12.5px}
  .gcard-head input[type=text]{border:none;background:transparent;font-weight:700;padding:2px 4px;box-shadow:none;border-bottom:1px dashed transparent;border-radius:0}
  .gcard-head input[type=text]:focus{border-bottom-color:var(--accent);box-shadow:none}
  .gcard-head .row-remove{margin-left:auto}
  .gcard-body{padding:12px 14px 2px}
  .gcard-body .field{margin-bottom:12px}
  .gcard-body .field label{font-size:12.5px}

  .rows{width:100%;border-collapse:collapse;table-layout:fixed}
  .rows th{font-size:12px;color:var(--ink3);text-align:left;font-weight:700;padding:0 8px 6px 0}
  .rows td{padding:0 8px 8px 0;vertical-align:top}
  .rows input[type=text]{width:100%;min-width:0}
  .rows .rowdel{color:var(--ink3);font-size:14px;padding:6px 4px}
  .rows .rowdel:hover{color:#b0473b}
  .addrow{border:1px dashed var(--line2);border-radius:8px;color:var(--ink3);padding:5px 14px;font-size:13px}
  .addrow:hover{color:var(--accent);border-color:var(--accent)}

  .as-block{border:1px solid var(--line);border-radius:10px;background:#fffdf6;padding:11px 13px;margin-bottom:10px}
  .as-item{display:flex;gap:8px;align-items:baseline;font-weight:700;font-size:14px;margin-bottom:8px}
  .as-item .idx{color:var(--accent);flex:0 0 auto;font-size:12.5px}
  .as-item .qtext{flex:1;min-width:0;font-weight:700}
  .jd-reason{margin-top:6px}
  .ansprev{background:#f5eeda;border-radius:8px;padding:7px 11px;font-size:13px;color:var(--ink2);margin-top:6px;line-height:1.65}
  .ansprev b{color:var(--ink)}

  details.quote{margin:16px 0 4px;background:#f5eeda;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:9px 13px}
  details.quote summary{cursor:pointer;color:var(--ink2);font-size:12.5px;letter-spacing:2px}
  details.quote p{margin:8px 0 2px;color:#4a4132;font-size:14px}
  details.quote .from{display:block;margin-top:4px;font-size:11.5px;color:var(--ink3)}

  .nav{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;align-items:center}
  .nav.split{justify-content:space-between}
  .nav.split > .btn:not(.ghost){margin-left:auto}
  .btn{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:9px;padding:8px 22px;font-size:14px;letter-spacing:1px}
  .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line2)}
  .btn.ghost:hover{color:var(--accent);border-color:var(--accent);filter:none}
  .mini{background:#fffdf6;border:1px solid var(--line2);border-radius:7px;padding:3px 12px;font-size:12px;color:var(--ink2)}
  .mini:hover{color:var(--accent);border-color:var(--accent)}

  /* 纲要树 / 作者的问题 */
  .tree-grid{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start}
  .tree-trunk,.tree-branch{border:1px solid var(--line2);border-radius:10px;background:#fffdf6;padding:13px 15px}
  .tree-t{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:1px;border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:10px}
  .tree-trunk textarea{border:none;box-shadow:none;background:transparent;padding:2px;min-height:0}
  .tree-row{display:flex;gap:8px;align-items:flex-start;background:#f8f3e4;border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin-bottom:8px}
  .tree-row .tree-arrow{color:var(--accent);font-weight:700;padding-top:7px;flex:0 0 auto}
  .tree-row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .tree-row input[type=text]{border:none;border-bottom:1px dashed var(--line2);border-radius:0;padding:4px 2px;background:transparent;box-shadow:none}
  .tree-row input[type=text]:focus{border-bottom-color:var(--accent);box-shadow:none}
  .qsplit{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .qbox{border:1px solid var(--line2);border-radius:10px;background:#fffdf6;padding:12px 14px 10px}
  .qbox.qa-ask{border-top:3px solid var(--fx)}
  .qbox.qa-solve{border-top:3px solid var(--zd)}
  .qbox-t{font-size:13px;font-weight:700;letter-spacing:1px;margin-bottom:10px}
  .refchip{display:inline-block;background:#fffdf6;border:1px solid var(--line2);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--ink2);margin:2px 2px 0 0}
  .refchip:hover{border-color:var(--accent);color:var(--accent)}

  /* 轮次 / 疑问 */
  .rblock{border:1px solid var(--line2);border-radius:10px;background:#fffdf6;padding:13px 15px;margin-bottom:12px}
  .rhead{display:flex;gap:10px;align-items:baseline;margin-bottom:10px;flex-wrap:wrap}
  .rhead .gi{color:var(--accent);font-weight:700;font-size:14px}
  .rhead .rpct{color:var(--ink3);font-size:12.5px}
  .pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .rv-row{font-size:13px;color:var(--ink2);margin:6px 0;line-height:1.65}
  .rv-row b{color:var(--ink)}
  .qrow{display:flex;gap:8px;align-items:flex-start;background:#f8f3e4;border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin-top:8px}
  .qrow .idx{flex:0 0 auto;color:var(--ink3);font-size:12px;padding-top:2px;min-width:26px;text-align:right}
  .qrow .grow{flex:1;min-width:0}
  .qrow .qtext{font-size:13.5px;line-height:1.6}
  .qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px}
  .qchip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;background:#fffdf6;border:1px solid var(--line2);color:var(--ink3)}
  .qchip.ok{background:#eaf3ef;border-color:#bcd8cd;color:#2f7d6d}
  .qa-sum{color:var(--ink3);font-size:12.5px;margin:-4px 0 12px}
  details.qadone{margin-top:12px}
  details.qadone summary{cursor:pointer;color:var(--ink2);font-size:13px;font-weight:700;padding:6px 0}

  /* 回顾栏头 / 步骤胶囊 */
  .rv-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .rv-head .rv-t{font-weight:700;font-size:14.5px;color:var(--accent);letter-spacing:1px}
  .rvtabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .rvtab{background:#fffdf6;border:1px solid var(--line2);border-radius:999px;padding:3px 13px;font-size:12px;color:var(--ink2)}
  .rvtab.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* 右页锁定只读 */
  .page-r.locked .rv-body input,.page-r.locked .rv-body textarea,.page-r.locked .rv-body button,
  .page-r.locked .rv-body .chip,.page-r.locked .rv-body .row-chip,.page-r.locked .rv-body .refchip{pointer-events:none}
  .page-r.locked .rv-body input,.page-r.locked .rv-body textarea{background:#f2ecdc;color:var(--ink2);box-shadow:none!important}

  .hint{margin:16px 26px 0;text-align:center;font-size:11.5px;color:#6f6250;letter-spacing:2px}

  @media (max-width:1150px){
    .desk{padding:22px 14px 8px}
    .book{flex-direction:column;min-height:0}
    .page{flex:0 0 auto}
    .book::before,.edge{display:none}
    .page-l{border-radius:10px 10px 3px 3px}
    .page-r{border-radius:3px 3px 10px 10px}
    .edgetabs,.edgetabs-l{position:static;flex-direction:row;flex-wrap:wrap;padding:12px 20px 0}
    .etab{writing-mode:horizontal-tb;padding:7px 16px;border-radius:7px 7px 0 0;letter-spacing:2px}
    .etab:hover{transform:none}
    .etab.on{transform:translateY(3px)}
    .etab-l{writing-mode:horizontal-tb;padding:7px 14px;border-radius:7px 7px 0 0;letter-spacing:2px}
    .etab-l:hover{transform:none}
    .etab-l.on{transform:translateY(3px)}

  /* ================= 步骤完成度（步骤轨点亮） ================= */
  function zdFilled(n){
    var z=D.zd;
    if(n===1) return String(z.theme||'').trim()!=='';
    if(n===2) return (z.issues||[]).some(function(x){ return String((x&&x.t)||'').trim(); });
    if(n===3){
      if(String(z.verdict||'').trim() || String(z.vreason||'').trim()) return true;
      var j=z.judge||{};
      for(var k in j){ if(j[k] && j[k].c) return true; }
      return false;
    }
    return String(z.meaning||'').trim()!=='' || (z.actions||[]).some(function(x){ return x && (String(x.t||'').trim() || x.c); });
  }
  function fxFilled(n){
    var f=D.fx;
    if(n===1) return toArr(f.cls).length>0;
    if(n===2) return String(f.unity||'').trim()!=='';
    if(n===3) return String(f.trunk||'').trim()!=='' || (f.outline||[]).some(function(c){ return c && (String(c.__name||'').trim() || (c.items||[]).some(function(y){ return String((y&&y.t)||'').trim(); })); });
    if(n===4) return (f.qsAsk||[]).concat(f.qsSolve||[]).some(function(x){ return String((x&&x.t)||'').trim(); });
    return (f.terms||[]).some(function(c){ return c && (String(c.__name||'').trim() || String(c.def||'').trim() || String(c.mine||'').trim()); });
  }

    });
    document.getElementById('edgeTabs').innerHTML=eh;
    document.getElementById('rvTitle').textContent='回顾 · '+C.reviewName;
    document.getElementById('rvEditBtn').textContent=S.rvEdit?'完成':'编辑';
    var th='';
    C.tabs.forEach(function(name, i){
      th+='<button type="button" class="rvtab'+((i+1)===tab?' on':'')+'" data-t="'+(i+1)+'">'+esc(name)+'</button>';
    });
    document.getElementById('rvTabs').innerHTML=th;
    var body='';
    if(lv==='js') body=jsStepHtml(tab);
    else if(lv==='zd') body=zdStepHtml(tab,true);
    else body=fxStepHtml(tab,true);
    sheetR.innerHTML='<div class="rv-body">'+body+'</div>';
    var ln=(S.level==='zd'?S.zstep:S.fxstep);
    document.getElementById('pnoR').textContent='· '+(LV[S.level].base+(ln-1)*2+1)+' ·';
  }

  function renderAll(flipL, flipR){
    var sl=sheetL.scrollTop, sr=sheetR.scrollTop;
    renderLeft(); renderRight(); growAll();
    sheetL.scrollTop=sl; sheetR.scrollTop=sr;
    if(flipL) flip(sheetL,'l');
    if(flipR) flip(sheetR,'r');
    document.getElementById('lvName').textContent=LV[S.level].name;
    var ob=document.querySelectorAll('.obtn[data-level]');
    for(var i=0;i<ob.length;i++) ob[i].classList.toggle('on', ob[i].getAttribute('data-level')===S.level);
  }

  /* ================= 事件：输入（不重渲染，只写数据） ================= */
  document.addEventListener('input', function(e){
    var t=e.target;
    if(t.matches('textarea')) grow(t);
    var p=t.getAttribute('data-p');
    if(p){ setP(D,p,t.value); return; }
    var li=t.getAttribute('data-li');
    if(li){ var arr=getList(li); var i=parseInt(t.getAttribute('data-i'),10);
      while(arr.length<=i) arr.push({}); arr[i]=arr[i]||{}; arr[i].t=t.value; setP(D,li,arr); return; }
    var cell=t.getAttribute('data-cell');
    if(cell){ var rows=getRows(cell); var r=parseInt(t.getAttribute('data-r'),10), c=parseInt(t.getAttribute('data-c'),10);
      while(rows.length<=r) rows.push([]); while(rows[r].length<=c) rows[r].push('');
      rows[r][c]=t.value; setP(D,cell,rows); return; }
    var cn=t.getAttribute('data-cname');
    if(cn){ var cs=getList(cn); var ci=parseInt(t.getAttribute('data-i'),10);
      while(cs.length<=ci) cs.push({}); cs[ci]=cs[ci]||{}; cs[ci].__name=t.value; setP(D,cn,cs); return; }
    var cb=t.getAttribute('data-csub');
    if(cb){ var cs2=getList(cb); var ci2=parseInt(t.getAttribute('data-i'),10), ck=t.getAttribute('data-k');
      while(cs2.length<=ci2) cs2.push({}); cs2[ci2]=cs2[ci2]||{}; cs2[ci2][ck]=t.value; setP(D,cb,cs2); return; }
    var fn=t.getAttribute('data-fxcname');
    if(fn!=null){ var ol=D.fx.outline; var fi=parseInt(fn,10);
      while(ol.length<=fi) ol.push({__name:'',items:[]}); ol[fi].__name=t.value; return; }
    var fx=t.getAttribute('data-fxitem');
    if(fx!=null){ var fi2=parseInt(fx,10), ri2=parseInt(t.getAttribute('data-ri'),10);
      var its=D.fx.outline[fi2].items=D.fx.outline[fi2].items||[];
      while(its.length<=ri2) its.push({}); its[ri2]=its[ri2]||{}; its[ri2].t=t.value; return; }
    var jw=t.getAttribute('data-jw');
    if(jw!=null){ var key='i'+jw; D.zd.judge[key]=D.zd.judge[key]||{}; D.zd.judge[key].w=t.value; return; }
    var clk=t.getAttribute('data-clk');
    if(clk){ var ri3=parseInt(t.getAttribute('data-ri'),10);
      while(D.zd.actions.length<=ri3) D.zd.actions.push({});
      D.zd.actions[ri3]=D.zd.actions[ri3]||{}; D.zd.actions[ri3][clk]=t.value; return; }
  });

  /* ================= 事件：点击 ================= */
  document.addEventListener('click', function(e){
    var el;
    if(el=e.target.closest('[data-level]')){
      var lv=el.getAttribute('data-level');
      if(lv!==S.level){ S.level=lv; S.rvLevel=(lv==='fx')?'zd':'js'; renderAll(true,true); }
      return;
    }
    if(el=e.target.closest('.etab-l')){
      var n=parseInt(el.getAttribute('data-s'),10);
      if(S.level==='zd'){ if(n!==S.zstep){ S.zstep=n; renderAll(true,false); } }
      else { if(n!==S.fxstep){ S.fxstep=n; renderAll(true,false); } }
      return;
    }
    if(el=e.target.closest('[data-nav]')){
      var d=el.getAttribute('data-nav');
      if(S.level==='zd'){ S.zstep=Math.min(4,Math.max(1,S.zstep+(d==='next'?1:-1))); }
      else { S.fxstep=Math.min(5,Math.max(1,S.fxstep+(d==='next'?1:-1))); }
      renderAll(true,false); return;
    }
    if(el=e.target.closest('.etab')){
      S.rvLevel=el.getAttribute('data-lv'); renderAll(false,true); return;
    }
    if(el=e.target.closest('.rvtab')){
      var t2=parseInt(el.getAttribute('data-t'),10);
      if(S.rvLevel==='js') S.rvTabJs=t2; else if(S.rvLevel==='zd') S.rvTabZd=t2; else S.rvTabFx=t2;
      renderAll(false,true); return;
    }
    if(e.target.closest('#rvEditBtn')){ S.rvEdit=!S.rvEdit; renderAll(false,false); return; }
    /* chips：单选 / 多选 */
    if(el=e.target.closest('[data-chip]')){
      var p2=el.getAttribute('data-chip'), v=el.getAttribute('data-v');
      if(el.hasAttribute('data-multi')){
        var a=toArr(getP(D,p2)).slice();
        var ix=a.indexOf(v);
        if(ix>-1) a.splice(ix,1); else a.push(v);
        setP(D,p2,a);
      } else {
        setP(D,p2, getP(D,p2)===v?'':v);
      }
      renderAll(false,false); return;
    }
    if(el=e.target.closest('[data-jchip]')){
      var k2='i'+el.getAttribute('data-jchip'), v2=el.getAttribute('data-v');
      D.zd.judge[k2]=D.zd.judge[k2]||{};
      D.zd.judge[k2].c=(D.zd.judge[k2].c===v2)?'':v2;
      renderAll(false,false); return;
    }
    if(el=e.target.closest('[data-clchip]')){
      var ri4=parseInt(el.getAttribute('data-clchip'),10), v3=el.getAttribute('data-v');
      while(D.zd.actions.length<=ri4) D.zd.actions.push({});
      D.zd.actions[ri4]=D.zd.actions[ri4]||{};
      D.zd.actions[ri4].c=(D.zd.actions[ri4].c===v3)?'':v3;
      renderAll(false,false); return;
    }
    if(el=e.target.closest('[data-fxterm]')){
      var term=el.getAttribute('data-fxterm');
      for(var q2=0;q2<D.fx.terms.length;q2++){ if(D.fx.terms[q2].__name===term){ renderAll(false,false); return; } }
      D.fx.terms.push({__name:term,pos:'',def:'',mine:''});
      renderAll(false,false); return;
    }
    /* 增删：清单 / 表格行 / 卡片 / 纲要 / 行动 */
    if(el=e.target.closest('[data-add]')){ getList(el.getAttribute('data-add')).push({}); renderAll(false,false); return; }
    if(el=e.target.closest('[data-rm]')){
      var arr2=getList(el.getAttribute('data-rm'));
      arr2.splice(parseInt(el.getAttribute('data-i'),10),1); renderAll(false,false); return; }
    if(el=e.target.closest('[data-addrow]')){ getRows(el.getAttribute('data-addrow')).push([]); renderAll(false,false); return; }
    if(el=e.target.closest('[data-rdel]')){
      var rows2=getRows(el.getAttribute('data-rdel'));
      rows2.splice(parseInt(el.getAttribute('data-r'),10),1); renderAll(false,false); return; }
    if(el=e.target.closest('[data-addcard]')){ getList(el.getAttribute('data-addcard')).push({}); renderAll(false,false); return; }
    if(el=e.target.closest('[data-rmcard]')){
      var cs3=getList(el.getAttribute('data-rmcard'));
      cs3.splice(parseInt(el.getAttribute('data-i'),10),1); renderAll(false,false); return; }
    if(el=e.target.closest('[data-fxadditem]')){ D.fx.outline.push({__name:'',items:[]}); renderAll(false,false); return; }
    if(el=e.target.closest('[data-fxrmitem]')){ D.fx.outline.splice(parseInt(el.getAttribute('data-fxrmitem'),10),1); renderAll(false,false); return; }
    if(el=e.target.closest('[data-fxaddpt]')){
      var oi=parseInt(el.getAttribute('data-fxaddpt'),10);
      D.fx.outline[oi].items=D.fx.outline[oi].items||[];
      D.fx.outline[oi].items.push({t:''}); renderAll(false,false); return; }
    if(el=e.target.closest('[data-fxrmpt]')){
      var oi2=parseInt(el.getAttribute('data-fxrmpt'),10), ri5=parseInt(el.getAttribute('data-ri'),10);
      D.fx.outline[oi2].items.splice(ri5,1); renderAll(false,false); return; }
    if(el=e.target.closest('[data-cladd]')){ D.zd.actions.push({}); renderAll(false,false); return; }
    if(el=e.target.closest('[data-clrm]')){ D.zd.actions.splice(parseInt(el.getAttribute('data-clrm'),10),1); renderAll(false,false); return; }
  });

  renderAll(false,false);
})();
</script>
</body>
</html>

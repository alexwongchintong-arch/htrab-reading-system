  /* ================= 状态推导 ================= */
  function autoPct(b){
    var rs = b.rounds || [];
    if(!rs.length) return null;
    return Number(rs[rs.length-1].pct) || 0;
  }
  function openRound(b){
    var rs = b.rounds || [];
    for(var i=rs.length-1;i>=0;i--) if(rs[i].state==='open') return rs[i];
    return null;
  }
  function stepFields(i){ return P.steps[i-1].fields; }
  function pathOf(f,i){ return f.top ? f.k : ((f.sk || P.steps[i-1].sk || ('s'+i)) + '.' + f.k); }
  function filledDef(b,f,i){
    var path = pathOf(f,i), v, j, x;
    if(f.type==='rows'){
      var rs = getRows(b,path);
      for(j=0;j<rs.length;j++) for(x=0;x<rs[j].length;x++) if(String(rs[j][x]||'').trim()) return true;
      return false;
    }
    if(f.type==='list') return getList(b,path).some(function(y){ return String((y&&y.t)||'').trim(); });
    if(f.type==='cards'){
      var cs = getList(b,path);
      for(j=0;j<cs.length;j++){
        var c = cs[j]||{};
        if(String(c.__name||'').trim()) return true;
        for(x=0;x<(f.cardFields||[]).length;x++){
          var cv = c[f.cardFields[x].k];
          if(String(cv==null?'':cv).trim()) return true;
        }
      }
      return false;
    }
    v = getP(b,path);
    return String(v==null?'':v).trim() !== '';
  }
  function stepHasContent(b,i){
    var fs = stepFields(i);
    /* top 字段（书名/作者）属于书籍身份，由「新增图书」时填写，不算步骤内容 */
    for(var j=0;j<fs.length;j++){ if(fs[j].top) continue; if(filledDef(b,fs[j],i)) return true; }
    return false;
  }
  function anyRoundDone(b){
    var rs = b.rounds || [];
    for(var i=0;i<rs.length;i++) if(rs[i].state === 'done' || Number(rs[i].pct) >= 100) return true;
    return false;
  }
  function zdUnlocked(b){ return b.mode === 'deep' || anyRoundDone(b); }
  function zdStarted(b){
    var z = b.zd; if(!z) return false;
    if(String(z.theme||'').trim() || String(z.verdict||'').trim() || String(z.vreason||'').trim() || String(z.meaning||'').trim()) return true;
    if((z.issues||[]).some(function(x){ return String((x&&x.t)||'').trim(); })) return true;
    if((z.actions||[]).some(function(x){ return x && (String(x.t||'').trim() || x.c); })) return true;
    var j = z.judge || {};
    for(var k in j){ if(j[k] && j[k].c) return true; }
    return false;
  }
  function zdComplete(b){
    var z = b.zd; if(!z) return false;
    if(!String(z.theme||'').trim()) return false;
    if(!String(z.meaning||'').trim()) return false;
    if(!String(z.verdict||'').trim()) return false;
    var named = [];
    (z.issues||[]).forEach(function(s, i){ if(String((s&&s.t)||'').trim()) named.push(i); });
    if(!named.length) return false;
    var j = z.judge || {};
    for(var x=0;x<named.length;x++){ var jj = j['i'+named[x]]; if(!jj || !jj.c) return false; }
    return true;
  }
  function fxStarted(b){
    var f = b.fx; if(!f) return false;
    if(toArr(f.cls).length || String(f.unity||'').trim() || String(f.subject||'').trim() || String(f.thesis||'').trim()) return true;
    if((f.outline||[]).some(function(c){ return c && (String(c.__name||'').trim() || (c.items||[]).some(function(y){ return String((y&&y.t)||'').trim(); })); })) return true;
    if((f.args||[]).some(function(c){ return c && (String(c.__name||'').trim() || (c.evid||[]).some(function(y){ return String((y&&y.t)||'').trim(); }) || String(c.logic||'').trim()); })) return true;
    if((f.sents||[]).some(function(c){ return c && (String(c.__name||'').trim() || String(c.sent||'').trim()); })) return true;
    var eq0 = f.etiquette || {};
    if(eq0.r9 || (eq0.r10||[]).length || (eq0.r11||[]).length) return true;
    var cq0 = f.critique || {};
    for(var kc0 in cq0){ if(cq0[kc0] && (cq0[kc0].c || (cq0[kc0].items||[]).some(function(x){ return String((x&&x.t)||'').trim(); }))) return true; }
    if(String(f.overall||'').trim() || String(f.gain||'').trim()) return true;
    var rs = f.resolved || {};
    for(var k in rs){ if(rs[k] && (rs[k].c || String(rs[k].w||'').trim())) return true; }
    return (f.qsAsk||[]).concat(f.qsSolve||[]).some(function(x){ return String((x&&x.t)||'').trim(); })
      || (f.terms||[]).some(function(c){ return c && (String(c.__name||'').trim() || String(c.def||'').trim() || String(c.mine||'').trim()); });
  }
  function statusOf(b){
    if(fxStarted(b)) return { k:'run', lv:'fx', label:'分析阅读 · 进行中' };
    if(zdComplete(b)) return { k:'done', lv:'zd', label:'主动阅读 · 完成' };
    if(zdStarted(b)) return { k:'run', lv:'zd', label:'主动阅读 · 进行中' };
    if(b.mode === 'deep') return { k:'wait', lv:'zd', label:'待主动阅读' };
    var rs = b.rounds || [];
    if(rs.length){
      var last = rs[rs.length-1];
      if(last.state === 'done') return { k:'done', lv:'js', label:'检视二 · 第'+rs.length+'轮', pct:100 };   // 通读完成、未进主动阅读：显示为检视二 100%
      return { k:'run', lv:'js', label:'检视二 · 第'+rs.length+'轮', pct:Number(last.pct)||0 };
    }
    if(b.s1Done) return { k:'wait', lv:'js', label:'待通读' };
    for(var n=1;n<=STEP_N;n++) if(stepHasContent(b,n)) return { k:'s1', lv:'js', label:'检视一 · 进行中' };
    return { k:'fresh', label:'未开始' };
  }
  function allQs(b){

  }

  function defaultAnsR(b){

  }
  function stateLabel(r,lb){

  /* ================= 渲染：通用 ================= */
  var ART_PALETTES = [
    ['#2f7d6d','#1e5a4c'], ['#2f4b7d','#20355b'], ['#b4632c','#8a4a1f'], ['#7a3b5e','#5a2b45'],
    ['#8a6d3b','#6a5128'], ['#4a6670','#35494f'], ['#6b5b95','#4d4170'], ['#a3452f','#7b3222']

  function artCover(b, cls){
    var t = String(b.book||'').trim() || '？';
    var h = 0;
    for(var i=0;i<t.length;i++){ h = (h * 31 + t.charCodeAt(i)) >>> 0; }
    var p = ART_PALETTES[h % ART_PALETTES.length];
    var ang = 115 + (h % 55);
    var fs = cls === 'cov'
      ? (t.length <= 2 ? 46 : t.length <= 5 ? 33 : t.length <= 9 ? 25 : 20)
      : 11;
    var inner = '<span class="art-t" style="font-size:'+fs+'px">'+esc(trunc(t, cls === 'cov' ? 14 : 4))+'</span>';
    if(b.author && cls === 'cov') inner += '<span class="art-a">'+esc(trunc(b.author, 12))+'</span>';
    return '<div class="'+cls+' art" style="background:linear-gradient('+ang+'deg,'+p[0]+','+p[1]+')"><span class="art-frame"></span>'+inner+'</div>';
  }
  function coverHtml(b, cls){
    if(b.cover) return '<div class="'+cls+'"><img src="'+b.cover+'" alt=""></div>';
    return artCover(b, cls);

  /* 书页最短高度：以左缘步骤签的默认总长为锚——量出最后一枚便签的底边，反推书页至少要多高，
     免得两侧内容都短时书页缩得比便签列还矮、便签伸出页底（书页与页摞装饰都跟着这个高度走） */
  function fitBookToTabs(){
    var books = document.querySelectorAll('#app .layout.dual, #app .layout.roll');
    for(var i=0;i<books.length;i++){
      var bk = books[i];
      var els = bk.querySelectorAll('.edgetabs-l .etab-l, .edgetabs .etab');
      if(!els.length){ bk.style.minHeight = ''; continue; }
      var top = bk.getBoundingClientRect().top;
      var span = 0;
      for(var j=0;j<els.length;j++){
        var b = els[j].getBoundingClientRect().bottom - top;   /* 左右两侧便签列的底（取最深） */
        if(b > span) span = b;
      }
      /* 视觉上的"书页"是纸张 .sheet——页脚（.pfoot）等尾部留白不盖便签，撑高时要加回 */
      var tail = 0, pg = bk.querySelector('.page');
      if(pg){
        var pgb = pg.getBoundingClientRect().bottom;
        var shs = pg.querySelectorAll('.sheet');
        for(var k=0;k<shs.length;k++){
          var t2 = pgb - shs[k].getBoundingClientRect().bottom;
          if(t2 > tail) tail = t2;
        }
      }
      var need = Math.ceil(span) + Math.ceil(tail) + 16;   /* 便签底 + 页脚 + 下留白 */
      /* 直接下发、不做"need > clientHeight"条件比较——撑高后 clientHeight 会变大，
         再次调用（初始化时 render 可能跑多次）会把刚设的 minHeight 误清掉；无条件下发即幂等 */
      bk.style.minHeight = need + 'px';

  function renderFields(b, fields, stepNo){

      }

      if(f.half){ buf.push(fh); if(buf.length===2) flush(); }
      else { flush(); h += fh; }

  /* ================= 渲染：书单页 ================= */
  function openQCount(b){
    var n = 0;
    allQs(b).forEach(function(x){ if(isOpenQ(x)) n++; });
    return n;
  }
  /* ---- 藏书架：布局对账（新书入第一层、已删书清出）与持久化 ---- */
  function bkNormalize(raw){
    if (!raw) return null;
    if (Array.isArray(raw) && raw.length && !Array.isArray(raw[0]) && raw[0].ids) return { shelves: raw, cart: [] };
    if (Array.isArray(raw)) return { shelves: raw.map(function(s){ return { n: '', ids: s }; }), cart: [] };
    if (raw && Array.isArray(raw.shelves)) return { shelves: raw.shelves, cart: Array.isArray(raw.cart) ? raw.cart : [] };
    return null;
  }
  function shFlat(sh){ var out = []; (sh && Array.isArray(sh.rows) ? sh.rows : []).forEach(function(r){ out = out.concat(r); }); return out; }
  /* 贪心分行（底行满、上层余）：把扁平序列切成行（存储序：底→上） */
  function bkBuildRows(flat, S0, rowW0){
    var rows = [], cur = [], acc = 0;
    flat.forEach(function(id){
      var b = bkById(id);
      var w = b ? Math.min(112, Math.max(44, 34 + Math.min(bkLen(b.book || '未命名'), 12) * 3.4)) * S0 : 60;
      if (acc + w > rowW0 && cur.length){ rows.push(cur); cur = []; acc = 0; }
      cur.push(id); acc += w + 10;
    });
    rows.push(cur);
    return rows;
  }
  function ensureShelves(){
    var ids = books.filter(function(b){ return !isArc(b); })
                  .sort(function(a,b){ return (b.o||b.created) - (a.o||a.created); })
                  .map(function(b){ return b.id; });
    if (!Array.isArray(shelvesData)) shelvesData = [];
    var S0 = bkScale(), rowW0 = Math.max(420, window.innerWidth - 196), changed = false;
    /* 迁移旧形状 {n, ids} → {n, rows}：一次性按当前窗口贪心分行（底行满）；此后行结构是唯一事实 */
    shelvesData.forEach(function(s){
      if (!Array.isArray(s.rows)){
        var flat = Array.isArray(s.ids) ? s.ids.slice() : [];
        s.rows = bkBuildRows(flat, S0, rowW0);
        delete s.ids;
        changed = true;
      }
      if (!s.rows.length) s.rows = [[]];
    });
    /* 清已删除的书 */
    shelvesData.forEach(function(s){
      s.rows.forEach(function(r, ri){
        var nr = r.filter(function(id){ return ids.indexOf(id) > -1; });
        if (nr.length !== r.length){ s.rows[ri] = nr; changed = true; }
      });
    });
    var cseen = {};
    bkCart = bkCart.filter(function(id){
      if (ids.indexOf(id) === -1 || cseen[id]) return false;
      cseen[id] = 1; return true;
    });
    /* 去重：一本书只能存在于一处——推车优先；层间保留首次出现（自愈历史复制数据） */
    var placed = {};
    bkCart.forEach(function(id){ placed[id] = 1; });
    if (!shelvesData.length && ids.length){
      var flatNew = ids.filter(function(id){ return !placed[id]; });
      if (flatNew.length){ shelvesData.push({ n: '', rows: bkBuildRows(flatNew, S0, rowW0) }); changed = true; }
      flatNew.forEach(function(id){ placed[id] = 1; });
    }
    shelvesData.forEach(function(s){
      s.rows.forEach(function(r, ri){
        var nr = r.filter(function(id){
          if (placed[id]) return false;
          placed[id] = 1; return true;
        });
        if (nr.length !== r.length){ s.rows[ri] = nr; changed = true; }
      });
    });
    /* 新书（既不在层也不在推车）入第一层底行 */
    ids.forEach(function(id){
      if (!placed[id]){
        if (!shelvesData.length){ shelvesData.push({ n: '', rows: [[]] }); changed = true; }
        if (!shelvesData[0].rows.length) shelvesData[0].rows = [[]];
        shelvesData[0].rows[0].push(id); placed[id] = 1; changed = true;
      }
    });
    if (changed) saveShelves();
  }
  function saveShelves(){ lsSet(LS_SH, JSON.stringify({ shelves: shelvesData, cart: bkCart })); }
  function bkById(id){
    for (var i=0;i<books.length;i++) if (books[i].id === id) return books[i];
    return null;
  }
  function isArc(b){ return !!(b && b.arc); }
  function bkBinding(id){
    var PAL = [
      ['#415a80','#2c3f5e'], ['#a05a2e','#7c401d'], ['#2e6e5c','#1f5344'],
      ['#6e4a26','#4e3016'], ['#44543f','#313f2d'], ['#96543d','#6d3a27'],
      ['#54446b','#3b2f4d'], ['#a89a7d','#7d7057'], ['#5c6a76','#414d57']
    ];
    var hsh = 0;
    for (var i=0;i<id.length;i++) hsh = (hsh + id.charCodeAt(i)) % 9973;
    return PAL[hsh % PAL.length];
  }
  function bkScale(wide){
    /* 并排的小书架恒为半屏尺寸；通铺/分层的大书架在大屏适度放大（≤1.3），减少整行留白 */
    return wide ? Math.min(1.3, Math.max(1, window.innerWidth / 1400)) : 1;
  }
  /* 权重长度：汉字 1、拉丁 0.55、空格 0.3 —— 用于书脊高宽与字号 */
  function bkLen(s){
    s = String(s || '');
    var n = 0;
    for (var i=0;i<s.length;i++){
      var c = s.charCodeAt(i);
      if (c >= 0x2E80) n += 1;
      else if (s.charAt(i) === ' ') n += 0.3;
      else n += 0.55;
    }
    return n;
  }
  /* 书脊尺寸（2026-10-07 定版）：只显示书名 + 状态牌（作者名不再上书脊，杜绝重叠）。
     字号求解把 1.5px 字距计入，长书名优先加高书脊（≤380px）而不是把字号压到溢出竖排遮挡状态牌；
     两段式：先按基础高度解字号，触底仍放不下则增高再解一次 */
  function bkMeasure(b, S){
    var tl = bkLen(b.book || '未命名');
    var stagePad = 76;                                     /* 底部保留：状态牌 */
    var base = Math.min(268, Math.max(200, 190 + Math.min(tl,16)*4.2));
    var fs = Math.min(13.5, Math.max(9.5, (base - stagePad)/tl - 1.5));
    var hh = Math.min(380, Math.max(base, tl*(fs+1.5) + stagePad + 8));
    fs = Math.min(13.5, Math.max(9.5, (hh - stagePad)/tl - 1.5));
    var ww = Math.min(112, Math.max(44, 34 + Math.min(tl,12)*3.4)) * S;
    return { h: hh * S, w: ww, fs: fs, st: statusOf(b) };
  }
  /* 层内分行（展示层折行）：首页排布与「调整书架顺序」微型图共用 —— 行超宽或超过每行上限时折行 */
  function bkChunk(sh, rowW, S, maxPerRow){
    var maxH = 0, visRows = [];
    (sh.rows || []).forEach(function(rowIds){
      var chunks = [[]], acc = 0;
      rowIds.forEach(function(id){
        var b = bkById(id); if (!b) return;
        var m = bkMeasure(b, S);
        if (m.h > maxH) maxH = m.h;
        var cur = chunks[chunks.length-1];
        if (cur.length && (acc + m.w > rowW || (maxPerRow && cur.length >= maxPerRow))){ chunks.push([]); cur = chunks[chunks.length-1]; acc = 0; }
        cur.push({ b: b, st: m.st, h: m.h, w: m.w, fs: m.fs });
        acc += m.w + 10;
      });
      visRows = visRows.concat(chunks.filter(function(c){ return c.length; }));
    });
    if (!visRows.length) visRows = [[]];
    return { visRows: visRows, maxH: maxH };
  }
  /* 该层是否按半宽（可左右并排）展示：手动覆盖优先（sh.side='side'|'full'），否则沿用按本数自动判断 */
  function shelfPairable(sh, halfW){
    if (!sh) return false;
    if (sh.side === 'side') return true;
    if (sh.side === 'full') return false;
    return shFlat(sh).length < 20 && bkChunk(sh, halfW, 1, 10).visRows.length <= 2;
  }

  /* ================= 调整书架顺序弹窗（整个书柜的微型图，拖动方块改布局） ================= */
  /* 按首页规则把顺序表折成「行」：少于 20 本且半宽下不超过两行 = 可与邻层并排（半宽），否则独占整行 */
  function bkPairs(list){
    var canPair = window.innerWidth >= 900;
    var halfW = bkHalfW();
    var out = [], pend = null;
    list.forEach(function(it){
      var pairable = canPair && shelfPairable(it.sh, halfW);
      if (pairable){
        if (pend != null){ out.push({ si: pend, w: 1 }); out.push({ si: it.si, w: 1 }); pend = null; }
        else pend = it.si;
      } else {
        out.push({ si: it.si, w: 2 });
      }
    });
    if (pend != null) out.push({ si: pend, w: 2 });
    return out;
  }
  function structLayout(){
    var list = [];
    shelvesData.forEach(function(sh, si){ list.push({ si: si, sh: sh }); });
    return bkPairs(list);
  }
  /* 微型书脊：每层画几根小书脊示意（不列出全部书名） */
  function bkMiniSpines(sh){
    var ids = shFlat(sh), h = '';
    if (!ids.length) return '<i class="bks-emptytick"></i>';
    ids.slice(0, 14).forEach(function(id, i){
      var col = bkBinding(id);
      var hh = 16 + ((id.charCodeAt(0) + i * 7) % 12);
      h += '<i style="height:' + hh + 'px;background:linear-gradient(180deg,' + col[0] + ',' + col[1] + ')"></i>';
    });
    if (ids.length > 14) h += '<span class="bks-more">+' + (ids.length - 14) + '</span>';
    return h;
  }
  /* 层名输入框宽度：按字符实际宽度估算（汉字 ≈ 2 个 ch） */
  function bkNameSize(s){
    var n = 0;
    String(s || '').split('').forEach(function(c){ n += (c.charCodeAt(0) > 0x2E80 ? 2 : 1); });
    return Math.max(6, n + 2);
  }
  function renderStruct(){
    var plan = structLayout();
    var h = '<div class="bks-head"><h3>调整书架顺序</h3><button type="button" class="bks-close" data-bksclose="1" title="关闭">✕</button></div>' +
      '<p class="bks-lead">这是首页书柜的<b>微型图</b>：整行 = 一层独占整行，半宽两块 = 两层并排。按住方块拖动即可调整布局顺序；层名可直接改；<b>⤢ 左右 / ⇕ 折叠</b> 切换该层的并排方式（左右 = 半宽，每行最多 10 本；折叠 = 整行通铺）；<b>✕</b> 删层（书会移入整理推车）。</p>' +
      '<div class="bks-map" id="bksMap" unselectable="on">';
    plan.forEach(function(it){
      var si = it.si, sh = shelvesData[si];
      if (!sh) return;
      var n = shFlat(sh).length;
      h += '<div class="bks-blk w' + it.w + '" data-bksi="' + si + '" title="第 ' + (si + 1) + ' 层 · ' + n + ' 本（拖动调整位置）">' +
        '<div class="bks-blk-body">' +
          '<div class="bks-blk-top">' +
            '<span class="bks-handle" title="按住拖动">⠿</span>' +
            '<input type="text" class="bks-nameinput" data-bkname="' + si + '" size="' + bkNameSize(sh.n) + '" value="' + esc(String(sh.n || '')) + '" placeholder="第 ' + (si + 1) + ' 层（可命名）">' +
            '<span class="bks-cnt">' + n + ' 本</span>' +

          '</div>' +
          '<div class="bks-mini">' + bkMiniSpines(sh) + '</div>' +
        '</div>' +
        '<div class="bks-ops">' +
          '<button type="button" class="bks-mini-btn" data-bkmove="-1" data-i="' + si + '"' + (si === 0 ? ' disabled' : '') + ' title="上移">↑</button>' +
          '<button type="button" class="bks-mini-btn" data-bkmove="1" data-i="' + si + '"' + (si === shelvesData.length - 1 ? ' disabled' : '') + ' title="下移">↓</button>' +
          '<button type="button" class="bks-mini-btn bks-del" data-bkdel="' + si + '" title="删除此层（书入整理推车）">✕</button>' +
        '</div>' +
      '</div>';
    });
    h += '</div><div class="bks-foot">' +
      '<button type="button" class="bk-structbtn" data-bkaddshelf="1">＋ 再加一层书架</button>' +
      '<span class="bks-lead" style="margin:0">共 ' + shelvesData.length + ' 层 · 改动即时保存</span>' +
      '<button type="button" class="bk-structbtn" data-bksclose="1">完成</button>' +

  function openStruct(){ renderStruct(); document.getElementById('bkStructMask').classList.add('show'); }
  function closeStruct(){ document.getElementById('bkStructMask').classList.remove('show'); }
  /* 拖动中按当前 DOM 顺序重算配对，实时把「并排/整行」画出来 */
  function repaintStructSpans(){
    var map = document.getElementById('bksMap');
    if (!map) return;
    var list = [];
    [].forEach.call(map.children, function(c){
      var si = parseInt(c.getAttribute('data-bksi'), 10);
      if (shelvesData[si]) list.push({ si: si, sh: shelvesData[si] });
    });
    var plan = bkPairs(list);
    plan.forEach(function(it){
      var el = map.querySelector('.bks-blk[data-bksi="' + it.si + '"]');
      if (el) el.className = 'bks-blk' + (el.classList.contains('dragging') ? ' dragging' : '') + ' w' + it.w;
    });
  }
  /* 弹窗内整层拖动排序：rAF 节流 + 落点去重（避免每次移动都改 DOM 造成闪烁） */
  function bindStruct(){
    var drag = null;
    document.body.addEventListener('pointerdown', function(e){
      if (!e.target.closest) return;
      var row = e.target.closest('.bks-blk');
      if (!row) return;
      if (e.target.closest('input, button')) return;   /* 层名输入框、↑↓✕ 按钮各自可用，不触发拖动 */
      drag = { row: row, active: false, sx: e.clientX, sy: e.clientY, last: null, raf: 0 };
      e.preventDefault();
    });
    window.addEventListener('pointermove', function(e){
      if (!drag) return;
      if (!drag.active){
        if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) < 5) return;
        drag.active = true;
        drag.row.classList.add('dragging');
        document.body.style.userSelect = 'none';
      }
      e.preventDefault();
      if (drag.raf) return;
      var px = e.clientX, py = e.clientY;
      drag.raf = requestAnimationFrame(function(){
        if (!drag) return;
        drag.raf = 0;
        if (!drag.active) return;
        var map = document.getElementById('bksMap');
        if (!map) return;
        var blocks = [].slice.call(map.children).filter(function(c){ return c !== drag.row; });
        var anchor = null;
        for (var i = 0; i < blocks.length; i++){
          var r = blocks[i].getBoundingClientRect();
          /* 指针在该块「之后」= 在它下半行、或同行右半边；第一个不在其后的块就是插入点 */
          var afterB = (py > r.bottom) || (py >= r.top && py <= r.bottom && px > r.left + r.width / 2);
          if (!afterB){ anchor = blocks[i]; break; }
        }
        if (anchor === drag.row || anchor === drag.row.nextSibling) return;   /* 位置未变：不碰 DOM */
        if (drag.last === anchor) return;
        drag.last = anchor;
        if (anchor) map.insertBefore(drag.row, anchor);
        else map.appendChild(drag.row);
        repaintStructSpans();
      });
    });
    window.addEventListener('pointerup', function(){
      if (!drag) return;
      var d = drag; drag = null;
      if (d.raf) cancelAnimationFrame(d.raf);
      document.body.style.userSelect = '';
      d.row.classList.remove('dragging');
      if (!d.active) return;
      var order = [];
      document.querySelectorAll('#bksMap .bks-blk').forEach(function(r){ order.push(parseInt(r.getAttribute('data-bksi'), 10)); });
      var ns = [];
      order.forEach(function(i){ if (shelvesData[i] && ns.indexOf(shelvesData[i]) === -1) ns.push(shelvesData[i]); });
      shelvesData.forEach(function(sh){ if (ns.indexOf(sh) === -1) ns.push(sh); });
      shelvesData = ns;
      saveShelves(); render(true); renderStruct();
    });
  }
  function bindStructModal(){
    document.body.addEventListener('click', function(e){
      var t = e.target;
      if (t.id === 'bkStructMask'){ closeStruct(); return; }
      var el = t.closest && t.closest('[data-bkstruct]');
      if (el){ openStruct(); return; }
      if (t.closest && t.closest('[data-bksclose]')){ closeStruct(); return; }
      if (ui.view !== 'shelf') return;
      el = t.closest && t.closest('[data-bkmove]');
      if (el){
        var mi = parseInt(el.getAttribute('data-i'), 10), tj = mi + parseInt(el.getAttribute('data-bkmove'), 10);
        if (tj >= 0 && tj < shelvesData.length){
          var tSh = shelvesData[mi]; shelvesData[mi] = shelvesData[tj]; shelvesData[tj] = tSh;
          saveShelves(); render(true); renderStruct();
        }
        return;
      }
      el = t.closest && t.closest('[data-bkdel]');
      if (el){
        var di = parseInt(el.getAttribute('data-bkdel'), 10), dsh = shelvesData[di];
        var moved = dsh ? shFlat(dsh).length : 0;
        if (moved && !confirm('第 ' + (di + 1) + ' 层的 ' + moved + ' 本书将移入「整理推车」，之后可再拖回书架。继续吗？')) return;
        if (dsh) bkCart = bkCart.concat(shFlat(dsh));
        shelvesData.splice(di, 1);
        saveShelves(); render(true); renderStruct(); return;
      }
      el = t.closest && t.closest('[data-bkaddshelf]');
      if (el){ shelvesData.push({ n: '', rows: [[]] }); saveShelves(); render(true); renderStruct(); return; }
    });
    document.body.addEventListener('change', function(e){
      if (!e.target.classList || !e.target.classList.contains('bks-nameinput')) return;

  /* 阅览室书列筛选：类型签（tmp.btSel）+ 检索词（tmp.rgQ，匹配书名 / 作者，不区分大小写） */
  function rgFiltered(){

  /* 书列内容（空态 + 书砖行 + 新增图书砖）：检索输入时只重绘 #rgLedge，输入框不丢焦点 */

      var pad = Math.max(18, Math.min(56, window.innerWidth * 0.03));   // 与 .rg-wrap 的 clamp 一致

    for (var t = 0; t < types.length; t++){

      h += '<span class="rg-chip' + (sel === types[t] ? ' on' : '') + '" data-bt="' + esc(types[t]) + '">' + esc(types[t]) + (n ? '<i>' + n + '</i>' : '') + '</span>';
    }
    h += '</div>';
    h += '<div class="rg-ledge" id="rgLedge">' + rgLedgeInner() + '</div>';
    h += '<div class="rg-foot">依据《如何阅读一本书》· 数据保存在浏览器本地</div>';
    h += '</div></div>';
    return h;
  }

  /* ---- 阅读清单：拖动行调整顺序（按住行身非交互区拖动；松手按 DOM 顺序用 data-pri 重建本季数组） ---- */
  function bindPlanReorder(){
    var pd = null;
    function endDrag(commit){
      if (!pd) return;
      var row = pd.row, moved = pd.moved;
      document.body.classList.remove('plandreordering');
      row.classList.remove('placing');
      pd = null;
      if (!moved) return;
      var key = planKey(), arr = plans[key] || [];
      var next = [], domRows = [].slice.call(document.querySelectorAll('.planwrap .plan-row'));
      domRows.forEach(function(r){
        var i = parseInt(r.getAttribute('data-pri'), 10);
        if (!isNaN(i) && arr[i]) next.push(arr[i]);
      });
      if (commit && next.length === arr.length){ plans[key] = next; flush(); render(true); }
      else render(true);   // 数据不一致：放弃本次拖动，回到存档顺序
    }
    document.body.addEventListener('pointerdown', function(e){
      if (ui.view !== 'plan' || e.button !== 0) return;
      if (e.target.closest('input, textarea, select, button, a, label')) return;
      var row = e.target.closest('.plan-row');
      if (!row) return;
      e.preventDefault();
      pd = { row: row, y0: e.clientY, moved: false };
      document.body.classList.add('plandreordering');
      row.classList.add('placing');
    });
    document.body.addEventListener('pointermove', function(e){
      if (!pd) return;
      e.preventDefault();
      if (!pd.moved && Math.abs(e.clientY - pd.y0) < 4) return;
      pd.moved = true;
      var row = pd.row, wrap = document.querySelector('.plan-rows');
      if (!wrap) return;
      var rows = [].slice.call(document.querySelectorAll('.planwrap .plan-row'));
      var target = null;
      for (var i=0;i<rows.length;i++){
        var r = rows[i];
        if (r === row) continue;
        var b = r.getBoundingClientRect();
        if (e.clientY < b.top + b.height/2){ target = r; break; }
      }
      if (target){
        if (row.nextSibling !== target) wrap.insertBefore(row, target);
      } else {
        var others = rows.filter(function(r){ return r !== row; });
        var last = others[others.length-1];
        if (last && row.previousSibling !== last) wrap.insertBefore(row, last.nextSibling);
      }
    });
    document.body.addEventListener('pointerup', function(){ endDrag(true); });
    document.body.addEventListener('pointercancel', function(){ endDrag(false); });
  }

  /* ---- 藏书架：书脊拖动 + 整层拖动（指针驱动，事件委托在 body/window，随重渲染存活） ---- */
  function bindBookcase(){
    var bkDrag = null, shelfDrag = null;
    document.body.addEventListener('pointerdown', function(e){
      if (ui.view !== 'shelf' || e.button !== 0) return;
      tmp.bkDragged = false;   // 新的按下 = 新交互，清掉上一次拖动残留的 click 守卫标记
      if (e.target.closest('button') || e.target.closest('.ftab') || e.target.closest('.bk-slot') || e.target.closest('.bk-nameinput')) return;
      var sp = e.target.closest('.bk-spine');
      if (sp){
        bkDrag = { id: sp.getAttribute('data-id'), el: sp, active: false, sx: e.clientX, sy: e.clientY, last: null, raf: 0 };
        return;
      }
      var unit = e.target.closest('.bk-unit');
      if (unit && (e.target.closest('.bk-rowline') || e.target.closest('.bk-cap'))){
        shelfDrag = { el: unit, active: false, sx: e.clientX, sy: e.clientY, last: null, raf: 0 };
      }
    });
    window.addEventListener('pointermove', function(e){
      if (shelfDrag){
        if (!shelfDrag.active){
          if (Math.abs(e.clientX - shelfDrag.sx) + Math.abs(e.clientY - shelfDrag.sy) < 6) return;
          shelfDrag.active = true;
          shelfDrag.el.classList.add('dragunit');
          document.body.classList.add('shelfdragging');
          tmp.bkDragged = true;
          /* 若本来在并排组里，先拎出来独占一行——落点只按顶层块判定，避免反复拆装并排组 */
          var parU = shelfDrag.el.parentNode;
          if (parU && parU.classList && parU.classList.contains('bk-pairrow')){
            var pairU = parU.closest('.bk-pair');
            if (pairU && pairU.parentNode) pairU.parentNode.insertBefore(shelfDrag.el, pairU.nextSibling);
          }
        }
        e.preventDefault();
        if (shelfDrag.raf) return;                       /* rAF 节流：每帧最多处理一次落点 */
        var cy = e.clientY;
        shelfDrag.raf = requestAnimationFrame(function(){
          if (!shelfDrag) return;
          shelfDrag.raf = 0;
          var bc = document.querySelector('.bookcase');
          if (!bc) return;
          /* 落点 = 第一个中线在指针之下的顶层块（独占层 / 并排组）；没有则落到末尾「＋ 再加一层」之前 */
          var blocks = [];
          [].forEach.call(bc.children, function(c){
            if (c !== shelfDrag.el && c.classList && (c.classList.contains('bk-unit') || c.classList.contains('bk-pair'))) blocks.push(c);
          });
          var anchor = document.querySelector('.bk-add');
          for (var i = 0; i < blocks.length; i++){
            var r = blocks[i].getBoundingClientRect();
            if (cy < r.top + r.height / 2){ anchor = blocks[i]; break; }
          }
          if (!anchor) return;
          if (anchor === shelfDrag.el || anchor === shelfDrag.el.nextSibling) return;   /* 位置未变：不碰 DOM */
          if (shelfDrag.last === anchor) return;
          shelfDrag.last = anchor;
          bc.insertBefore(shelfDrag.el, anchor);
        });
        return;
      }
      if (!bkDrag) return;
      if (!bkDrag.active){
        if (Math.abs(e.clientX - bkDrag.sx) + Math.abs(e.clientY - bkDrag.sy) < 6) return;
        bkDrag.active = true;
        bkDrag.el.classList.add('bkdrag');
        tmp.bkDragged = true;
        document.body.style.userSelect = 'none';
      }
      e.preventDefault();
      if (bkDrag.raf) return;                              /* rAF 节流：每帧最多处理一次落点 */
      var cxB = e.clientX, cyB = e.clientY;
      bkDrag.raf = requestAnimationFrame(function(){
        if (!bkDrag) return;
        bkDrag.raf = 0;
        var lines = document.querySelectorAll('.bk-rowline');
        var target = null;
        for (var k=0;k<lines.length;k++){
          var rc = lines[k].getBoundingClientRect();
          if (cyB >= rc.top && cyB <= rc.bottom && cxB >= rc.left - 30 && cxB <= rc.right + 30){ target = lines[k]; break; }
        }
        if (!target){
          /* 拖回整理推车 */
          var cartEl = document.getElementById('bkCartList');
          if (cartEl){
            var cr = cartEl.getBoundingClientRect();
            if (cyB >= cr.top - 14 && cyB <= cr.bottom + 14 && bkDrag.el.parentNode !== cartEl){ cartEl.appendChild(bkDrag.el); }
          }
          return;
        }
        var over2 = null, before2 = false, bestD = Infinity;
        var spines = target.querySelectorAll('.bk-spine');
        for (var j=0;j<spines.length;j++){
          if (spines[j] === bkDrag.el) continue;
          var r2 = spines[j].getBoundingClientRect();
          var dx = cxB < r2.left ? r2.left - cxB : (cxB > r2.right ? cxB - r2.right : 0);
          var dy = cyB < r2.top ? r2.top - cyB : (cyB > r2.bottom ? cyB - r2.bottom : 0);
          var d = dx*dx + dy*dy;
          if (d < bestD){ bestD = d; over2 = spines[j]; before2 = cxB < r2.left + r2.width/2; }
        }
        var endB = target.querySelector('.bk-end:not(.l)');
        var anchor = over2 ? (before2 ? over2 : over2.nextSibling) : endB;
        if (!anchor) return;
        if (anchor === bkDrag.el || anchor === bkDrag.el.nextSibling) return;   /* 位置未变：不碰 DOM */
        if (bkDrag.last === anchor) return;
        bkDrag.last = anchor;
        target.insertBefore(bkDrag.el, anchor);
      });
    });
    function bkCommit(){
      shelvesData.forEach(function(sh, si){
        var unit = document.querySelector('.bk-unit[data-si="' + si + '"]');
        if (!unit) return;   // 筛选隐藏的层保持原样
        var rowsDom = [];
        unit.querySelectorAll('.bk-rowline').forEach(function(line){
          var ids = [];
          line.querySelectorAll('.bk-spine').forEach(function(sp){ ids.push(sp.getAttribute('data-id')); });
          rowsDom.push(ids);
        });
        rowsDom.reverse();   // 视觉上→下 反转为存储序（底行在前）；拖动即改行归属，不再重排
        sh.rows = rowsDom.length ? rowsDom : [[]];
      });
      var cartEl = document.getElementById('bkCartList');
      if (cartEl){
        var cids = [];
        cartEl.querySelectorAll('.bk-spine').forEach(function(sp){ cids.push(sp.getAttribute('data-id')); });
        bkCart = cids;
      }
      saveShelves();
    }
    window.addEventListener('pointerup', function(){
      document.body.style.userSelect = '';
      document.body.classList.remove('shelfdragging');
      if (bkDrag){
        if (bkDrag.raf) cancelAnimationFrame(bkDrag.raf);
        if (bkDrag.active){ bkDrag.el.classList.remove('bkdrag'); bkCommit(); render(true); }
        bkDrag = null;
      }
      if (shelfDrag){
        if (shelfDrag.raf) cancelAnimationFrame(shelfDrag.raf);
        if (shelfDrag.active){
          shelfDrag.el.classList.remove('dragunit');
          var seenO = {}, order = [];
          /* 顶层块（独占层 / 并排层）按 DOM 顺序读回，并排组内两层按左右顺序 */
          document.querySelectorAll('.bookcase > .bk-unit, .bookcase > .bk-pair .bk-unit').forEach(function(u){
            var siO = parseInt(u.getAttribute('data-si'), 10);
            if (shelvesData[siO] && !seenO[siO]){ seenO[siO] = 1; order.push(shelvesData[siO]); }
          });
          shelvesData.forEach(function(shO, siO){ if (!seenO[siO]) order.push(shO); });   // 筛选隐藏的层追加在后
          shelvesData = order;
          saveShelves();
          render(true);
        }
        shelfDrag = null;
      }
    });
    function bkSaveName(si, val){
      if (shelvesData[si]){ shelvesData[si].n = String(val || '').trim(); saveShelves(); }
      tmp.bkNameEdit = null;
      render(true);
    }
    document.body.addEventListener('keydown', function(e){
      if (!e.target.classList || !e.target.classList.contains('bk-nameinput')) return;
      if (e.key === 'Enter'){ bkSaveName(parseInt(e.target.getAttribute('data-si'), 10), e.target.value); }
      else if (e.key === 'Escape'){ tmp.bkNameEdit = null; render(true); }
    });
    document.body.addEventListener('focusout', function(e){
      if (!e.target.classList || !e.target.classList.contains('bk-nameinput')) return;
      if (tmp.bkNameEdit == null) return;
      bkSaveName(parseInt(e.target.getAttribute('data-si'), 10), e.target.value);
    });
    var bkRs = null;
    window.addEventListener('resize', function(){
      clearTimeout(bkRs);
      bkRs = setTimeout(function(){
        if (ui.view === 'shelf' || ui.view === 'bytype') render(true);
        fitBookToTabs();   /* 视口高度变了，书页最短高度跟着便签列重算 */
      }, 150);
    });
  }

  /* ================= 渲染：清单页（单书） ================= */
  function zdStepFilled(b, n){
    var z = b.zd || {};
    if(n === 1) return String(z.theme||'').trim() !== '';
    if(n === 2) return (z.issues||[]).some(function(x){ return String((x&&x.t)||'').trim(); });
    if(n === 3){
      if(String(z.verdict||'').trim()) return true;
      var j = z.judge || {};
      for(var k in j){ if(j[k] && j[k].c) return true; }
      return false;
    }
    return String(z.meaning||'').trim() !== '' || (z.actions||[]).some(function(x){ return x && (String(x.t||'').trim() || x.c); });
  }
  function renderStepper(b){
    /* 主动/分析：本层次步骤签 */
    if(b.cur === STEP_N + 3){
      /* 主动阅读页：本层次步骤 = 左缘步骤签；跨层导航移到左页页眉（renderBook） */
      var zs = b.zdcur || 1, zOut = '';
      for(var zi=0;zi<P.part3.ztabs.length;zi++){
        var zn = zi + 1;
        zOut += '<button type="button" class="etab-l'+(zdStepFilled(b,zn)?' has':'')+(zs===zn?' on':'')+'" data-zdgo="'+zn+'"><i class="fdot"></i>'+esc(P.part3.ztabs[zi])+'</button>';
      }
      return zOut;
    }
    if(b.cur >= STEP_N + 4){
      /* 分析阅读页：阶段在左页标头切换（renderBook 的 .stagetrack），左缘步骤签只放当前阶段；
         阶段三：详情签（判「有此问题」的标准，12-15 对应 r12-r15）插在 批评标准 与 整体评论 之间 */
      var fc = b.fxcur || 1, fOut = '';
      var si0 = fxStageOf(fc), base0 = fxStageBase(si0);
      var cnt0 = P.part4.stages[si0].count || 4;
      var lastSi = P.part4.stages.length - 1;
      function ftab(fn, label){
        return '<button type="button" class="etab-l'+(fxStepFilled(b,fn)?' has':'')+(fc===fn?' on':'')+'" data-fxstep="'+fn+'"><i class="fdot"></i>'+esc(label || P.part4.tabs[fn-1])+'</button>';
      }
      for(var fn = base0 + 1; fn <= base0 + cnt0; fn++){
        if(si0 === lastSi && fn === 11) continue;   /* 整体评论永远在最后 */
        fOut += ftab(fn);
        if(si0 === lastSi && fn === 10){
          var cqx = (b.fx && b.fx.critique) || {};
          P.part4.s10blocks.forEach(function(bk, bi){
            if(!(cqx[bk[0]] && cqx[bk[0]].c === 'no')) return;
            fOut += ftab(12 + bi, bk[3]);
          });
        }
      }
      if(si0 === lastSi) fOut += ftab(11);
      return fOut;
    }
    /* 检视阅读页：折页书的左缘步骤签（检视一 3 步 + 轮次 + 问答；深度模式未展开时缩为一签） */
    if(b.mode === 'deep' && !b.jsOpen){
      return '<button type="button" class="etab-l" data-jsopen="1"><i class="fdot"></i>'+esc(P.part3.collapsedNav)+'</button>';
    }
    var out = '';
    for(var i=1;i<=STEP_N;i++){
      var st = P.steps[i-1];
      out += '<button type="button" class="etab-l'+(stepHasContent(b,i)?' has':'')+(b.cur===i?' on':'')+'" data-go="'+i+'"><i class="fdot"></i>'+esc(st.nav)+'</button>';
    }
    var qs = allQs(b);
    out += '<button type="button" class="etab-l'+((b.rounds||[]).length?' has':'')+(b.cur===STEP_N+1?' on':'')+'" data-go="'+(STEP_N+1)+'"><i class="fdot"></i>阅读轮次</button>';
    out += '<button type="button" class="etab-l'+(qs.length?' has':'')+(b.cur===STEP_N+2?' on':'')+'" data-go="'+(STEP_N+2)+'"><i class="fdot"></i>疑问问答</button>';
    return out;
  }
  function progressText(b){
    var n = 0;
    for(var i=1;i<=STEP_N;i++) if(stepHasContent(b,i)) n++;
    var t = '检视一 已填 ' + n + ' / ' + STEP_N + ' 步';
    if((b.rounds||[]).length) t += ' · 通读 ' + b.rounds.length + ' 轮';
    if(zdComplete(b)) t += ' · 主动阅读 已完成';
    else if(zdStarted(b)) t += ' · 主动阅读 进行中';
    return t;
  }

  function ansEditor(q){
    var lb = P.part2.rounds.labels, b = B();
    var n = (b.rounds||[]).length || 1;
    var def = q.ansR || defaultAnsR(b);
    var h = '<div class="ansbox"><textarea rows="2" data-qans="'+q.id+'" placeholder="'+esc(lb.ansPh)+'">'+esc(q.ans||'')+'</textarea>';
    h += '<div class="ansfoot"><label>'+esc(lb.ansRound)+'</label><select data-qround="'+q.id+'">';
    for(var i=1;i<=n;i++) h += '<option value="'+i+'"'+(i===def?' selected':'')+'>第'+i+'轮</option>';
    h += '</select><button type="button" class="mini" data-ansclose="1">收起</button></div></div>';
    return h;
  }
  function qRow(q, ri, qi, inQA){
    var lb = P.part2.rounds.labels;
    var answered = String(q.ans||'').trim() !== '';
    var h = '<div class="qrow"><span class="idx">'+(qi+1)+'.</span><div class="grow">';
    h += '<textarea rows="1" data-qtext="'+q.id+'" placeholder="'+esc(lb.qPh)+'">'+esc(q.text||'')+'</textarea>';
    h += '<div class="qmeta"><span class="qchip'+(answered?' ok':'')+'" data-qchip="'+q.id+'">'+(answered?(esc((lb.answered||'第{n}轮解答').replace('{n}', q.ansR||'?'))):esc(lb.pending))+'</span>';
    if(inQA){
      h += '<button type="button" class="mini" data-ansopen="'+q.id+'">'+(answered?esc(lb.ansEdit||'修改解答'):esc(lb.ansBtn||'回答'))+'</button>';
    }

    else if(answered) h += '<div class="ansprev">'+esc((lb.answered||'第{n}轮解答').replace('{n}', q.ansR||'?'))+' · '+esc(q.ans)+'</div>';

  function roundBlock(b, i){
    var r = b.rounds[i], lb = P.part2.rounds.labels;
    var h = '<div class="rblock"><div class="rhead"><span class="gi">第'+(i+1)+'轮</span>';

    h += '<div class="field"><label>'+esc(lb.end)+'</label><div class="dwrap'+(r.end?'':' has-ph')+'"><input type="date" data-rend="'+i+'" value="'+esc(r.end||'')+'"></div></div>';
    h += '</div>';
    var pc = Number(r.pct)||0;

    h += '<div class="field"><label>'+esc(lb.pct)+'</label><div class="pctrow">';
    h += '<input type="range" min="0" max="100" step="1" data-rpct="'+i+'" value="'+pc+'" style="'+grad+'">';

    if(r.state === 'stopped'){
      h += '<div class="rbtns"><input type="text" class="whyin" data-rwhy="'+i+'" placeholder="'+esc(lb.stopWhy)+'" value="'+esc(r.why||'')+'"></div>';
    }
    h += '<div class="field"><label>'+esc(lb.qs)+'</label><div class="list-rows">';

    h += '</div><button type="button" class="list-add" data-ract="addq" data-ri="'+i+'">＋ '+esc(lb.qAdd)+'</button></div>';
    h += '<div class="field"><label>'+esc(lb.gain)+'</label><textarea data-rgain="'+i+'" placeholder="'+esc(lb.gainPh||'')+'">'+esc(r.gain||'')+'</textarea></div>';
    h += '</div>';
    return h;
  }

  function renderRounds(b){
    var L = P.part2.rounds, lb = L.labels;
    var h = '<h2>'+esc(L.title)+'</h2><p class="goal">'+esc(L.goal)+'</p>';
    if(!(b.rounds||[]).length) h += '<div class="list-empty">'+esc(lb.emptyHint)+'</div>';
    for(var i=(b.rounds||[]).length-1;i>=0;i--) h += roundBlock(b,i);
    h += '<div class="nav split" style="margin-top:14px"><button type="button" class="btn ghost" data-ract="addround">'+esc(lb.add)+'</button>';
    h += '<button type="button" class="btn ghost" data-nav="prev">← 上一步</button><button type="button" class="btn" data-nav="next">下一步 →</button></div>';
    return h;
  }

  function renderQA(b){
    var L = P.part2.qa, lb = P.part2.rounds.labels;
    var all = allQs(b);
    var openL = all.filter(function(x){ return isOpenQ(x); });
    var doneL = all.filter(function(x){ return !isOpenQ(x); });
    var h = '<h2>'+esc(L.title)+'</h2><p class="goal">'+esc(L.goal)+'</p>';
    if(!all.length){
      h += '<div class="list-empty">还没有疑问。回到「阅读轮次」，读到什么卡住的随手记下来。</div>';
    } else {
      h += '<div class="qa-sum">共 '+all.length+' 问 · 待解答 '+openL.length+'</div>';
      h += '<h3 class="qa-h">待解答（'+openL.length+'）</h3>';
      if(!openL.length) h += '<div class="list-empty">都答上了。</div>';
      openL.forEach(function(x){
        h += '<div class="as-block"><div class="as-item"><span class="idx">第'+(x.ri+1)+'轮提出</span><span class="qtext">'+esc(x.q.text||'')+'</span></div>';
        h += '<div class="qmeta"><button type="button" class="mini" data-ansopen="'+x.q.id+'">'+esc(lb.ansBtn||'回答')+'</button><button type="button" class="qdel" data-rmq="'+x.ri+'" data-qi="'+x.qi+'" title="删除本条">✕</button></div>';
        if(tmp.ansQ === x.q.id) h += ansEditor(x.q);
        h += '</div>';
      });
      h += '<details class="qadone"><summary>已解答（'+doneL.length+'）</summary>';
      doneL.forEach(function(x){

  function renderStage(b){
    if(b.cur <= STEP_N) return renderStep(b, b.cur);
    if(b.cur === STEP_N + 1) return renderRounds(b);
    if(b.cur === STEP_N + 2) return renderQA(b);
    if(b.cur === STEP_N + 3) return renderZhudong(b);

  function renderBook(){

  }

  /* ---------- 分析阅读：阶段一 · 结构（1-4）/ 阶段二 · 诠释（5-8） ---------- */
  /* 分析阅读阶段助手：按 stages[].count 动态累计 */
  function fxStageOf(fc){ var C = P.part4, base = 0; for(var i=0;i<C.stages.length;i++){ var cnt = C.stages[i].count || 4; if(fc <= base + cnt) return i; base += cnt; } return C.stages.length - 1; }
  function fxStageBase(si){ var C = P.part4, base = 0; for(var i=0;i<si && i<C.stages.length;i++) base += (C.stages[i].count || 4); return base; }
  function fxStepFilled(b, n){
    var f = b.fx || {};
    if(n === 1) return toArr(f.cls).length > 0 || String(f.clsReason||'').trim() !== '';
    if(n === 2) return String(f.unity||'').trim() !== '';
    if(n === 3) return (f.outline||[]).some(function(c){ return c && (String(c.__name||'').trim() || (c.items||[]).some(function(y){ return String((y&&y.t)||'').trim(); })); }) || String(f.subject||'').trim() !== '' || String(f.thesis||'').trim() !== '';
    if(n === 4) return (f.qsAsk||[]).some(function(x){ return String((x&&x.t)||'').trim(); }) || (f.qsSolve||[]).some(function(x){ return String((x&&x.t)||'').trim(); });
    if(n === 5) return (f.terms||[]).some(function(c){ return c && (String(c.__name||'').trim() || String(c.def||'').trim() || String(c.mine||'').trim() || String(c.pos||'').trim()); });
    if(n === 6) return (f.sents||[]).some(function(c){ return c && (String(c.__name||'').trim() || String(c.sent||'').trim() || String(c.pos||'').trim()); });
    if(n === 7) return (f.args||[]).some(function(c){ return c && (String(c.__name||'').trim() || (c.evid||[]).some(function(y){ return String((y&&y.t)||'').trim(); }) || String(c.logic||'').trim()); });
    var rs = f.resolved || {};
    if(n === 8){
      for(var k8 in rs){ if(rs[k8] && (rs[k8].c || String(rs[k8].w||'').trim())) return true; }
      return false;
    }
    if(n === 9){
      var eq = f.etiquette || {};
      return !!eq.r9 || (eq.r10||[]).length > 0 || (eq.r11||[]).length > 0
        || String(eq.r9w||'').trim() !== '' || String(eq.r10w||'').trim() !== '' || String(eq.r11w||'').trim() !== '';
    }
    if(n === 11) return String(f.overall||'').trim() !== '' || String(f.gain||'').trim() !== '';
    var cq = f.critique || {};
    if(n >= 12){
      var dk = ['r12','r13','r14','r15'][n - 12];
      return !!(cq[dk] && (cq[dk].items||[]).some(function(x){ return String((x&&x.t)||'').trim(); }));
    }
    for(var kc in cq){ if(cq[kc] && (cq[kc].c || (cq[kc].items||[]).some(function(x){ return String((x&&x.t)||'').trim(); }))) return true; }
    return false;
  }

        its.forEach(function(pt, j){
          h += '<div class="list-row"><span class="idx">'+(j+1)+'.</span><div class="grow"><textarea rows="1" data-fxitem="'+i+'" data-ri="'+j+'" placeholder="'+esc(C.s3itemPh)+'">'+esc((pt&&pt.t)||'')+'</textarea></div><button type="button" class="row-remove" data-fxrmpt="'+i+'" data-ri="'+j+'" title="删除本条">✕</button></div>';

        h += '</div><button type="button" class="row-remove" data-fxrmitem="'+i+'" title="删除本部分">✕</button></div>';

    }
    if(n === 4){
      h += '<div class="qgroup"><h3>'+esc(C.s4t)+'</h3><p class="goal">'+esc(C.s4goal)+'</p>';
      h += '<div class="qsplit">';

      (f.qsAsk||[]).forEach(function(p, i){
        h += '<div class="list-row"><span class="idx">'+(i+1)+'.</span><div class="grow"><textarea rows="1" data-litem="fx.qsAsk" data-ri="'+i+'" placeholder="'+esc(C.s4aPh)+'">'+esc((p&&p.t)||'')+'</textarea></div><button type="button" class="row-remove" data-rmlist="fx.qsAsk" data-ri="'+i+'" title="删除本条">✕</button></div>';
      });
      h += '</div><button type="button" class="list-add" data-addlist="fx.qsAsk">＋ '+esc(C.s4aAdd)+'</button></div>';
      h += '<div class="qbox qa-solve"><div class="qbox-t">'+esc(C.s4bLabel)+enh('Problems to Solve')+'</div><div class="list-rows">';
      if(!(f.qsSolve||[]).length) h += '<div class="list-empty">点下方按钮，把作者想要解决的问题逐条加进来。</div>';
      (f.qsSolve||[]).forEach(function(p, i){
        h += '<div class="list-row"><span class="idx">'+(i+1)+'.</span><div class="grow"><textarea rows="1" data-litem="fx.qsSolve" data-ri="'+i+'" placeholder="'+esc(C.s4bPh)+'">'+esc((p&&p.t)||'')+'</textarea></div><button type="button" class="row-remove" data-rmlist="fx.qsSolve" data-ri="'+i+'" title="删除本条">✕</button></div>';
      });
      h += '</div><button type="button" class="list-add" data-addlist="fx.qsSolve">＋ '+esc(C.s4bAdd)+'</button></div>';
      h += '</div></div>';

  /* 阶段三结论推导：四标准都评过才下结论；12-14 任一有证→不同意；仅 15 有问题→暂缓；全无→有义务同意 */
  function critiqueVerdict(f){
    var cq = (f && f.critique) || {};
    var ks = ['r12','r13','r14','r15'];
    for(var i=0;i<ks.length;i++) if(!cq[ks[i]] || !cq[ks[i]].c) return P.part4.s10vPending;
    if(ks.slice(0,3).some(function(k){ return cq[k].c === 'no'; })) return P.part4.s10vDisagree;
    if(cq.r15.c === 'no') return P.part4.s10vHold;
    return P.part4.s10vAgree;
  }
  /* 阶段三已判「有此问题」的批评标准详情页序号（12-15），按 r12-r15 顺序 */
  function fxDetailSteps(b){
    var cq = (b.fx && b.fx.critique) || {}, out = [];
    P.part4.s10blocks.forEach(function(bk, bi){ if(cq[bk[0]] && cq[bk[0]].c === 'no') out.push(12 + bi); });
    return out;
  }
  function renderFenxi(b){
    var C = P.part4, fc = b.fxcur || 1;
    var h = fxStepHtml(b, fc);
    var dets = fxDetailSteps(b), prevT = null, nextT = null, prevOld = false;
    if(fc >= 12){
      var di = dets.indexOf(fc);
      prevT = di > 0 ? dets[di-1] : 10;
      nextT = (di > -1 && di < dets.length - 1) ? dets[di+1] : 11;
    } else if(fc === 10){
      prevT = 9; nextT = dets.length ? dets[0] : 11;
    } else if(fc === 11){
      prevT = dets.length ? dets[dets.length-1] : 10;
    } else if(fc === 1){
      prevOld = true; nextT = 2;
    } else {
      prevT = fc - 1; nextT = fc + 1;
    }
    h += '<div class="nav split">';
    if(prevOld) h += '<button type="button" class="btn ghost" data-nav="prev">← 上一步</button>';
    else if(prevT) h += '<button type="button" class="btn ghost" data-fxnavto="'+prevT+'">← 上一步</button>';
    if(nextT) h += '<button type="button" class="btn" data-fxnavto="'+nextT+'">下一步 →</button>';
    h += '</div>';
    return h;
  }

  function quizResult(){

    if(q.g1 === 'fic') return q.g3 || null;
    if(q.g1 === 'exp'){
      if(q.g2 === 'pra') return '实用';
      if(q.g2 === 'the') return q.g3 || null;
    }
    return null;

    }

      var d = dispPct(bb);

      var lr = (bb.rounds || []);
      lr = lr.length ? lr[lr.length-1] : null;
      if(lr && lr.state === 'done' && lr.start && lr.end){
        var dd = Math.round((new Date(lr.end) - new Date(lr.start)) / 86400000);

  function dispPct(b){

    var h = '<div class="planwrap">';

  function ztStepFilled(tp, n){
    if(!tp) return false;
    if(n === 0) return String(tp.issue||'').trim() !== '' || String(tp.why||'').trim() !== '';
    if(n === 1) return (tp.refs||[]).some(function(r){ return r && (r.chapters||[]).some(function(c){ return String((c&&c.t)||'').trim() || (c.items||[]).some(function(x){ return String((x&&x.t)||'').trim(); }); }); });

    if(n === 3) return String(tp.thesis||'').trim() !== '' || (tp.questions||[]).some(function(q){ return String((q&&q.t)||'').trim(); });
    if(n === 4){
      var ps = tp.positions || {};

  /* 汇总：组装辩证笔记 Markdown（右上角「导出笔记」直接打开导出面板） */
  function topicMd(tp){
    var issue = String(tp.issue||'').trim() || '未命名议题';
    var L = [];
    L.push('# 《' + issue + '》· 主题阅读辩证笔记');
    L.push('');
    L.push('## 议题与缘由');
    L.push('- **议题**：' + issue);
    if(String(tp.why||'').trim()) L.push('- **我为什么关心它**：' + tp.why.trim().split('\n').join(' / '));
    L.push('- 记录时间：' + today() + '（工具内自动记录）');
    L.push('');
    L.push('## 参考书目');
    var anyRef = false;
    (tp.refs||[]).forEach(function(r){
      if(!r) return;
      anyRef = true;
      var bk = bkById(r.bookId);
      var line = '- **《' + (r.title||'未命名') + '》**' + (r.author ? ' · ' + r.author : '');
      if(!bk) line += '（已下架）';
      L.push(line);
      (r.chapters||[]).forEach(function(c){
        var ct = String((c&&c.t)||'').trim();
        var its = ((c&&c.items)||[]).map(function(x){ return String((x&&x.t)||'').trim(); }).filter(Boolean);
        if(!ct && !its.length) return;
        if(ct) L.push('  - ' + ct);
        its.forEach(function(x){ L.push((ct ? '    - ' : '  - ') + x); });
      });
    });
    if(!anyRef) L.push('（尚未选定参考书）');
    L.push('');
    L.push('## 中立词汇');
    var anyTerm = false;
    (tp.terms||[]).forEach(function(c){
      if(!c) return;
      var nm = String(c.__name||'').trim();
      var srcs = (c.srcs||[]).map(function(s){ return String((s&&s.t)||'').trim(); }).filter(Boolean);
      if(!nm && !srcs.length) return;
      anyTerm = true;
      L.push('- **' + (nm || '（未命名）') + '**' + (srcs.length ? '：' + srcs.join(' / ') : ''));
    });
    if(!anyTerm) L.push('（未填写）');
    L.push('');
    L.push('## 问题序列');
    if(String(tp.thesis||'').trim()) L.push('- **中立主旨**：' + tp.thesis.trim());
    var anyQ = false;
    (tp.questions||[]).forEach(function(q, i){
      var t = String((q&&q.t)||'').trim(); if(!t) return;
      anyQ = true;
      L.push((i+1) + '. ' + t);
    });
    if(!anyQ && !String(tp.thesis||'').trim()) L.push('（未填写）');
    L.push('');
    L.push('## 议题界定');
    var anyPos = false;
    (tp.questions||[]).forEach(function(q, qi){
      var qt = String((q&&q.t)||'').trim(); if(!qt) return;
      var pos = (tp.positions||{})['i'+qi] || {};
      var rows = (pos.rows||[]).filter(function(rw){ return (rw||[]).some(function(cell){ return String(cell||'').trim(); }); });
      var cons0 = String(pos.consensus||'').trim();
      var difn0 = String(pos.diff||'').trim();
      if(!rows.length && !cons0 && !difn0) return;
      anyPos = true;
      L.push('### 问题 ' + (qi+1) + '：' + qt);
      rows.forEach(function(rw){
        var line = '- ' + (String(rw[0]||'').trim() || '（书名未填）');
        if(String(rw[1]||'').trim()) line += '：' + rw[1].trim().split('\n').join(' / ');
        L.push(line);
      });
      if(cons0) L.push('- 共识：' + cons0.split('\n').join(' / '));
      if(difn0) L.push('- 差异 / 备注：' + difn0.split('\n').join(' / '));
      L.push('');
    });
    if(!anyPos) L.push('（未填写）');
    L.push('');
    L.push('## 分析讨论');
    var anyD = false;
    (tp.questions||[]).forEach(function(q, qi){
      var qt = String((q&&q.t)||'').trim(); if(!qt) return;
      var dc = (tp.discussion||{})['i'+qi] || {};
      var d = String(dc.d||'').trim(); if(!d) return;
      anyD = true;
      L.push('### 问题 ' + (qi+1) + '：' + qt);
      d.split('\n').forEach(function(ln){ if(ln.trim()) L.push(ln.trim()); });
      L.push('');
    });
    if(!anyD) L.push('（未填写）');
    L.push('');
    if(String(tp.mine||'').trim()){
      L.push('## 主导性论证（Master Narrative）');
      L.push('*超越任何单一作者的「主导性论证」——顺逻辑而非顺作者。*');
      L.push(tp.mine.trim());
      L.push('');
    }
    L.push('---');
    L.push('*这份笔记是「辩证笔记」：它回答的不是某本书说了什么，而是许多作者如何共同回应你的问题——以及他们在哪里分歧。*');
    return L.join('\n');
  }

      var PER = 10;
      var list = [];
      (tp.refs||[]).forEach(function(r, ri){ if(r) list.push({ r: r, ri: ri }); });

          var nm = String(c.t||'').trim();

      });

    }

  /* ================= 导出 ================= */
  function valueLines(b, f, stepNo){
    var path = pathOf(f, stepNo), i, j;
    if(f.type === 'list'){
      var out = [];
      getList(b,path).forEach(function(y, yi){
        var t = String((y&&y.t)||'').trim();
        if(t) out.push('  - ' + t);
      });
      return out.length ? out : null;
    }
    if(f.type === 'rows'){
      var rows = getRows(b,path), cols = f.cols||[], out2 = [];
      for(i=0;i<rows.length;i++){
        var parts = [];
        for(j=0;j<cols.length;j++){
          var v = String(rows[i][j]||'').trim();
          if(v) parts.push(cols[j].label + '：' + v);
        }
        if(parts.length) out2.push('  - ' + parts.join('｜'));
      }
      return out2.length ? out2 : null;
    }
    if(f.type === 'cards'){
      var cs = getList(b,path), out3 = [];
      for(i=0;i<cs.length;i++){
        var c = cs[i]||{};
        var name = String(c.__name||'').trim();
        var sub = [];
        (f.cardFields||[]).forEach(function(cf){
          var sv = String(c[cf.k]==null?'':c[cf.k]).trim();
          if(sv) sub.push('    - ' + (cf.label||cf.k) + '：' + sv.split('\n').join(' / '));
        });
        if(name || sub.length){
          out3.push('  - **' + (name || '（未命名）') + '**');
          out3 = out3.concat(sub);
        }
      }
      return out3.length ? out3 : null;
    }
    var v = getP(b,path);
    v = String(v==null?'':v).trim();
    if(!v) return null;
    if(f.type === 'choice') return ['  - ' + (f.label||'') + '：' + v];
    var lines = v.split('\n');
    var out4 = ['  - **' + (f.label||'') + '**：' + lines[0]];
    for(j=1;j<lines.length;j++) if(lines[j].trim()) out4.push('    ' + lines[j]);
    return out4;
  }
  function bookMd(b){
    var st = statusOf(b);
    var L = [];
    L.push('# 《' + (b.book || '未命名') + '》· 阅读笔记');
    L.push('');
    L.push('- 作者：' + (b.author || '—'));
    if(b.publisher) L.push('- 出版社：' + b.publisher + (b.edition ? '（' + b.edition + '）' : ''));
    else if(b.edition) L.push('- 版次：' + b.edition);
    if(b.s1 && toArr(b.s1.cls).length) L.push('- 类型：' + toArr(b.s1.cls).join('、'));
    L.push('- 状态：' + st.label);
    if(b.why) L.push('- 我为什么翻开它：' + b.why);
    L.push('- 记录时间：' + today() + '（工具内自动记录）');
    L.push('');
    for(var i=1;i<=STEP_N;i++){
      var stp = P.steps[i-1];
      L.push('## ' + i + '. ' + stp.deliver + '（' + stp.title + '）');
      var wrote = false, fs = stp.fields || [];
      for(var j=0;j<fs.length;j++){
        var ls = valueLines(b, fs[j], i);
        if(ls){ L = L.concat(ls); wrote = true; }
      }
      if(!wrote) L.push('（未填写）');
      L.push('');
    }
    L.push('## ' + (STEP_N + 1) + '. 阅读轮次（检视阅读二）');
    if(!(b.rounds||[]).length) L.push('（尚未开始通读）');
    (b.rounds||[]).forEach(function(r, ri){
      L.push('### 第' + (ri+1) + '轮 · ' + stateLabel(r, P.part2.rounds.labels) + ' · ' + (Number(r.pct)||0) + '%');
      L.push('  - 日期：' + (r.start || '？') + ' ～ ' + (r.end || '（进行中）'));
      if(r.state === 'stopped' && r.why) L.push('  - 停下的原因：' + r.why);
      if(r.gain) L.push('  - 本轮收获：' + r.gain);
      (r.qs||[]).forEach(function(q){
        if(String(q.text||'').trim()){
          L.push('  - 疑问：' + q.text + (String(q.ans||'').trim() ? ('　→　（第' + (q.ansR||'?') + '轮解答）' + q.ans) : '　（待解答）'));
        }
      });
      L.push('');
    });
    if(b.zd && zdStarted(b)){
      var z = b.zd, C3 = P.part3;
      L.push('## ' + (STEP_N + 2) + '. 主动阅读 · 四问笔记');
      if(String(z.theme||'').trim()) L.push('  - **全书主题**：' + z.theme.trim());
      (z.issues||[]).forEach(function(s, i){
        var t = String((s&&s.t)||'').trim();
        if(!t) return;
        var j = (z.judge||{})['i'+i];
        var line = '  - 议题：' + t;
        if(j && j.c) line += '　→　' + chipLabel(C3.q3chips, j.c) + (String(j.w||'').trim() ? '（' + j.w.trim() + '）' : '');
        L.push(line);
      });
      if(String(z.verdict||'').trim()) L.push('  - **整体判断**：' + z.verdict + (String(z.vreason||'').trim() ? '——' + z.vreason.trim().split('\n').join(' / ') : ''));
      if(String(z.meaning||'').trim()) L.push('  - **对我的意义**：' + z.meaning.trim().split('\n').join(' / '));
      (z.actions||[]).forEach(function(a){
        if(!a || !String(a.t||'').trim()) return;
        var line = '  - ' + a.t.trim();
        if(a.c) line += '〔' + chipLabel(C3.q4chips, a.c) + '〕';
        if(String(a.w||'').trim()) line += '——' + a.w.trim();
        L.push(line);
      });
      L.push('');
    }
    if(b.fx && fxStarted(b)){
      var f = b.fx;
      L.push('## ' + (STEP_N + 3) + '. 分析阅读');
      L.push('### 阶段一 · 结构');
      if(toArr(f.cls).length) L.push('  - **类型**：' + toArr(f.cls).join('、'));
      if(String(f.clsReason||'').trim()) L.push('  - **分类理由**：' + f.clsReason.trim());
      if(String(f.unity||'').trim()) L.push('  - **一句话概括**：' + f.unity.trim());

      (f.qsSolve||[]).forEach(function(p){ var t = String((p&&p.t)||'').trim(); if(t) L.push('  - 作者要解决：' + t); });
      L.push('### 阶段二 · 诠释');
      (f.terms||[]).forEach(function(c){
        if(!c) return;
        var nm = String(c.__name||'').trim(), pos = String(c.pos||'').trim(), def = String(c.def||'').trim(), mn = String(c.mine||'').trim();

      });
      (f.sents||[]).forEach(function(c){
        if(!c) return;
        var nm = String(c.__name||'').trim(), pos = String(c.pos||'').trim(), st = String(c.sent||'').trim();
        if(!nm && !st && !pos) return;
        L.push('  - **主旨' + (nm ? ' · ' + nm : '') + '**' + (pos ? '（' + pos + '）' : '') + (st ? '：' + st : ''));
      });
      (f.args||[]).forEach(function(c){
        if(!c) return;
        var nm = String(c.__name||'').trim();
        var evs = (c.evid||[]).map(function(y){ return String((y&&y.t)||'').trim(); }).filter(Boolean);
        var lg = String(c.logic||'').trim();
        if(!nm && !evs.length && !lg) return;
        if(nm) L.push('  - **论述 · ' + nm + '**' + (evs.length ? '：' + evs.join(' / ') : ''));

      function resLine(prefix, list){

          var r = rs[prefix + i];
          if(!r || (!r.c && !String(r.w||'').trim())) return;

        });

      resLine('a', f.qsAsk); resLine('s', f.qsSolve);
      /* 阶段三 · 评论 */
      var eq = f.etiquette || {}, cq = f.critique || {};

      var hasEq = eq.r9 || (eq.r10||[]).length || (eq.r11||[]).length

        return cq[k] && (cq[k].c || (cq[k].items||[]).some(function(x){ return String((x&&x.t)||'').trim(); }));
      });
      function optLabel(opts, v){ for(var i=0;i<opts.length;i++) if(opts[i][0]===v) return opts[i][1]; return v || ''; }
      if(hasEq || hasCq){
        L.push('### 阶段三 · 评论');
        if(eq.r9) L.push('  - 规则九：' + optLabel(C4.s9a.opts, eq.r9) + (String(eq.r9w||'').trim() ? '——' + eq.r9w.trim() : ''));
        if((eq.r10||[]).length) L.push('  - 规则十：' + eq.r10.map(function(v){ return optLabel(C4.s9b.opts, v); }).join('；') + (String(eq.r10w||'').trim() ? '——' + eq.r10w.trim() : ''));
        if((eq.r11||[]).length) L.push('  - 规则十一：' + eq.r11.map(function(v){ return optLabel(C4.s9c.opts, v); }).join('；') + (String(eq.r11w||'').trim() ? '——' + eq.r11w.trim() : ''));
        C4.s10blocks.forEach(function(bk){
          var r = cq[bk[0]];
          if(!r || (!r.c && !(r.items||[]).length)) return;
          L.push('  - ' + bk[1] + '：' + optLabel(C4.s10chips, r.c));
          (r.items||[]).forEach(function(x){ var t = String((x&&x.t)||'').trim(); if(t) L.push('    - 证据：' + t); });
        });
        if(['r12','r13','r14','r15'].every(function(k){ return cq[k] && cq[k].c; }))
          L.push('  - **结论**：' + critiqueVerdict(f));
        if(String(f.overall||'').trim()) L.push('  - **整体评论**：' + f.overall.trim());
        if(String(f.gain||'').trim()) L.push('  - **与我何干 / 收获**：' + f.gain.trim());
      }
      L.push('');
    }
    L.push('---');
    L.push('*' + (P.summaryNote || '') + '*');
    return L.join('\n');
  }
  function copyText(md, btnTip){

      try{ document.execCommand('copy'); tip(btnTip); }catch(e){ tip('复制失败，请手动选择文本'); }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(md).then(function(){ tip(btnTip); }, fallback);
    } else fallback();
  }
  function downloadMd(md, name){
    var blob = new Blob([md], { type:'text/markdown;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 200);
  }

    /* ---------- 类型拖动排序 ---------- */
    var dragRow = null;
    document.body.addEventListener('dragstart', function(e){
      var row = e.target.closest ? e.target.closest('.typelist .typerow') : null;
      if(!row) return;
      dragRow = row;
      row.classList.add('dragging');
      try{ e.dataTransfer.setData('text/plain', row.getAttribute('data-tname')); }catch(err){}
      e.dataTransfer.effectAllowed = 'move';
    });
    document.body.addEventListener('dragover', function(e){
      if(!dragRow) return;
      var list = document.getElementById('pTypesBody');
      if(!list || !list.contains(e.target)) return;
      e.preventDefault();
      try{ e.dataTransfer.dropEffect = 'move'; }catch(err){}
      var row = e.target.closest('.typelist .typerow');
      if(!row || row === dragRow) return;
      var rect = row.getBoundingClientRect();
      var before = (e.clientY - rect.top) < rect.height / 2;
      if(before) row.parentNode.insertBefore(dragRow, row);
      else row.parentNode.insertBefore(dragRow, row.nextSibling);
    });
    document.body.addEventListener('drop', function(e){
      if(dragRow) e.preventDefault();
    });
    document.body.addEventListener('dragend', function(){
      if(!dragRow) return;
      dragRow.classList.remove('dragging');
      dragRow = null;
      var list = document.getElementById('pTypesBody');
      if(!list) return;
      var rows = list.querySelectorAll('.typerow[data-tname]');
      var order = [];
      for(var i=0;i<rows.length;i++) order.push(rows[i].getAttribute('data-tname'));
      var changed = false;
      if(order.length !== types.length) changed = true;
      else {
        for(var j=0;j<order.length;j++){ if(order[j] !== types[j]){ changed = true; break; } }
      }
      if(changed){ types = order; flush(); renderTypesPanel(); rerenderStage(); tip('顺序已更新'); }

      card.classList.add('dragging');
      try{ e.dataTransfer.setData('text/plain', card.getAttribute('data-id')); }catch(err){}
      e.dataTransfer.effectAllowed = 'move';
    });
    document.body.addEventListener('dragover', function(e){

      if(!card || card === dragCard) return;
      var rect = card.getBoundingClientRect();

    document.body.addEventListener('dragend', function(){

      dragCard = null;
      var grid = document.querySelector('.shelf-grid');
      if(!grid) return;
      var cs = grid.querySelectorAll('.bcard[data-id]');
      var ids = [];
      for(var i=0;i<cs.length;i++) ids.push(cs[i].getAttribute('data-id'));
      if(!ids.length) return;
      /* 按新视觉顺序，重新分配这些卡片原本持有的排序位（过滤时隐藏的卡片位置不动） */
      var vis = {}, k, m;
      for(k=0;k<ids.length;k++) vis[ids[k]] = 1;
      var full = books.slice().sort(function(a,b){ return (b.o||b.created) - (a.o||a.created); });
      var slots = [];
      for(k=0;k<full.length;k++){ if(vis[full[k].id]) slots.push(full[k].o || full[k].created); }
      slots.sort(function(a,b){ return b - a; });
      for(k=0;k<ids.length;k++){
        for(m=0;m<books.length;m++){ if(books[m].id === ids[k]){ books[m].o = slots[k]; break; } }
      }
      flush(); render(true); tip('顺序已更新');
    });

        var ttl = rowEl && rowEl.querySelector('.pt') ? rowEl.querySelector('.pt').textContent.trim() : '';
        var q0 = (ttl && ttl.charAt(0) !== '（') ? ('把《'+ttl+'》移出本季清单？') : '把这条记录移出本季清单？';
        if(!confirm(q0 + '\n移出只影响本季清单，不影响这本书的阅读进度与笔记，之后可随时再加回来。')) return;
        if(Array.isArray(plans[key2])){ plans[key2].splice(parseInt(el.getAttribute('data-plrm'),10),1); flush(); render(); }
        return;
      }

      /* 导出 */
      el = t.closest('[data-exp]');
      if(el){
        if(el.getAttribute('data-exp') === 'copy') copyText(tmp.expMd, '已复制到剪贴板');
        else downloadMd(tmp.expMd, tmp.expName || ('阅读笔记-' + (B() ? (B().book || '未命名') : '笔记').replace(/[\\/:*?"<>|]/g,'_') + '.md'));
        return;
      }
    });
  }

  /* ---------- 速查卡：按当前阶段呈现 ---------- */
  function renderTools(){
    var T = P.toolsByStage || {};
    var key = 'home';
    var b = B();
    if(ui.view === 'topic') key = 'zt';
    else if(ui.view === 'book' && b){
      if(b.cur <= STEP_N + 2) key = 'js';
      else if(b.cur === STEP_N + 3) key = 'zd';
      else { var fcx = b.fxcur || 1; key = fcx <= 4 ? 'fx1' : (fcx <= 8 ? 'fx2' : 'fx3'); }
    }
    var st = T[key] || T.home || { label:'', secs:[] };
    function toolTwo(o2){
      var h2 = '<div class="clf-card'+(o2.tone?' '+o2.tone:'')+'"><h5>'+esc(o2.name)+'</h5><ul>';
      (o2.clues||[]).forEach(function(cl){ h2 += '<li>'+esc(cl)+'</li>'; });
      return h2 + '</ul></div>';
    }
    var th = '';
    if(st.label) th += '<p class="clf-lead">当前阶段 · '+esc(st.label)+'</p>';
    var secs = st.secs || [];
    for(var i=0;i<secs.length;i++){
      var sec = secs[i];
      th += '<div class="tool-sec"><h4>'+esc(sec.title)+'</h4>';
      if(sec.text) th += '<p>'+esc(sec.text)+'</p>';
      if(sec.items){ th += '<ul>'; for(var j=0;j<sec.items.length;j++) th += '<li>'+esc(sec.items[j])+'</li>'; th += '</ul>'; }
      if(sec.two){ th += '<div class="clf-two">' + sec.two.map(toolTwo).join('') + '</div>'; }
      th += '</div>';
    }
    document.getElementById('toolsBody').innerHTML = th || '<p>暂无。</p>';
  }
  /* 速查卡页签切换（速查卡 / 分类助手） */
  function toolsTab(toolsOn){
    var tt = document.getElementById('tabTools'), tc = document.getElementById('tabClf');
    if(!tt || !tc) return;
    tt.classList.toggle('on', toolsOn);
    tc.classList.toggle('on', !toolsOn);
    document.getElementById('toolsBody').classList.toggle('hidden', !toolsOn);
    document.getElementById('clfBody').classList.toggle('hidden', toolsOn);
  }
  /* 打开速查卡：内容与页签都按当前页面上下文呈现——
     分类助手只在分类相关页出现（检视一第 1 步的类型粗判 / 分析规则一的分类）；
     每次打开先回到速查卡页签，避免上次的页签状态残留到别的页面 */
  function renderToolsPanel(){
    renderTools();
    var b = B(), showClf = false;
    if(ui.view === 'book' && b){
      if(b.cur === 1) showClf = true;
      else if(b.cur >= STEP_N + 4 && (b.fxcur || 1) === 1) showClf = true;
    }
    var tc = document.getElementById('tabClf'), tt = document.getElementById('tabTools');
    tc.classList.toggle('hidden', !showClf);
    tt.style.flex = showClf ? '' : '1';
    toolsTab(true);
  }

  /* ---------- 初始化 ---------- */
  (function init(){
    document.documentElement.style.setProperty('--accent', P.accent);
    document.documentElement.style.setProperty('--accent-weak', P.accentWeak);
    document.title = P.name + ' · 书单与疑问';
    renderTools();
    /* 分类助手页 */
    (function(){
      var C = P.classifier;
      if(!C){ document.getElementById('tabClf').classList.add('hidden'); document.getElementById('tabTools').style.flex = '1'; return; }
      function optCard(o){
        var h = '<div class="clf-card'+(o.tone ? ' '+o.tone : '')+'"><h5>'+esc(o.name)+'</h5><ul>';
        (o.clues||[]).forEach(function(c){ h += '<li>'+esc(c)+'</li>'; });
        return h + '</ul></div>';
      }
      var h = '<p class="clf-lead">'+esc(C.lead)+'</p>';
      h += '<div class="clf-gate"><div class="clf-q">'+esc(C.gate1.q)+'</div><p class="clf-line">'+esc(C.gate1.line)+'</p>';
      h += '<div class="clf-two">'+C.gate1.two.map(optCard).join('')+'</div>';
      h += '<div class="clf-hard">'+esc(C.gate1.hard)+'</div></div>';
      h += '<div class="clf-gate"><div class="clf-q">'+esc(C.gate2.q)+'</div><p class="clf-line">'+esc(C.gate2.line)+'</p>';
      h += '<div class="clf-two">'+C.gate2.cards.map(optCard).join('')+'</div>';
      h += '<div class="clf-hard">'+esc(C.gate2.hard)+'</div></div>';
      h += '<div class="clf-tail">'+esc(C.tail)+'</div>';
      h += '<div class="clf-from">—— '+esc(C.from||'')+'</div>';
      document.getElementById('clfBody').innerHTML = h;
    })();
    /* 速查卡页签切换 */
    document.getElementById('tabTools').addEventListener('click', function(){ toolsTab(true); });
    document.getElementById('tabClf').addEventListener('click', function(){ toolsTab(false); });
    bind();
    bindBookcase();
    bindStructModal();
    bindPlanReorder();
    document.getElementById('overlay').addEventListener('click', closePanels);
    if(!canStore) document.getElementById('noStorage').classList.remove('hidden');
    window.addEventListener('beforeunload', flush);
    if(ui.view === 'book' && (!B() || isArc(B()))) ui.view = 'shelf';
    if(ui.view === 'topic' && !T()){ ui.view = 'shelf'; ui.topicId = null; }
    if(ui.selTopic && !topicById(ui.selTopic)) ui.selTopic = null;
    render();
  })();
})();
</script>
</body>

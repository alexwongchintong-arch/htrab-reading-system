<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>检视阅读 · 书单与疑问</title>
<style>
  :root{
    --accent:#2f7d6d;
    --accent-weak:rgba(47,125,109,.12);
    --paper:#f6f3ec;
    --card:#fffdf8;
    --ink:#2b2926;
    --ink-2:#5b564d;
    --ink-3:#8a8375;
    --line:#e4ddcd;
    --line-2:#d5ccba;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font:15px/1.75 -apple-system,"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;font-weight:700}
  button{font:inherit;cursor:pointer}

  /* ---------- 顶栏 ---------- */
  .topbar{margin:0 auto;padding:22px 24px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  /* 单书视图 = Demo H 题名栏：大标题（书名/作者/当前层次）居左，操作钮排在标题与书本之间。
     单行骨架：标题列可收缩（长书名列内自然换行），操作钮永不整块掉行——防书名过长时按钮错位 */
  .topbar.bk{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:nowrap;max-width:none;padding:24px 46px 4px}
  .topbar.bk .bkmast-t{flex:1 1 auto;min-width:0}
  /* 检视（单页书）：题名栏与书同宽居中 */
  .topbar.bk.rollv{width:min(1120px,calc(100% - 140px));margin:0 auto;padding-left:0;padding-right:0}
  /* 副题（作者 · 当前层次）右移对齐下方页眉标题：摊书页左页页眉缩进 46px，折页书 58px */
  .topbar.bk .bkmast-sub{margin-top:6px;font-size:12.5px;color:var(--ink-2);letter-spacing:1px;margin-left:46px}
  .topbar.bk.rollv .bkmast-sub{margin-left:58px}
  .topbar.bk .bkmast-t h1{font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;font-size:clamp(24px,2.2vw,36px);font-weight:900;letter-spacing:.08em;line-height:1.25;margin:0;overflow-wrap:break-word}
  .topbar.bk .bkmast-ops{display:flex;gap:10px;align-items:center;flex-wrap:nowrap;flex:0 0 auto;padding-bottom:4px}
  .bktag{
    font-size:12.5px;letter-spacing:2px;padding:7px 16px;color:#5c4a32;white-space:nowrap;
    background:linear-gradient(180deg,#e8d9ae,#c9ae74);border:1px solid #9a7c46;border-radius:3px;
    box-shadow:inset 0 1px 0 rgba(255,245,215,.7), 0 1px 2px rgba(60,40,15,.35);
  }
  /* 极窄屏兜底：标题独占一行，操作钮换到下一行右对齐（占满整行使内部换行生效，防溢出） */
  @media (max-width:640px){
    .topbar.bk{flex-wrap:wrap;row-gap:8px}
    .topbar.bk .bkmast-t{flex:1 0 100%}
    .topbar.bk .bkmast-ops{flex:1 1 100%;flex-wrap:wrap;justify-content:flex-end}
    .topbar.bk.rollv{width:calc(100% - 32px)}
  }
  .bktag:hover{filter:brightness(1.05)}
  .bktag.red{color:#a03d2e;border-color:#a03d2e;background:rgba(255,253,246,.5)}
  .bktag.red:hover{background:#a03d2e;color:#fff;filter:none}
  .bktag.arc{color:#8a6d3b;border-color:#b08d4f;background:rgba(255,253,246,.5)}
  .bktag.arc:hover{background:#8a6d3b;color:#fff;filter:none}
  .brand{display:flex;gap:20px;align-items:center}
  .brand h1.brand-big{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:clamp(26px,2.1vw,36px);font-weight:900;letter-spacing:.14em;line-height:1.15}
  .no-chip{background:var(--accent);color:#fff;border-radius:8px;padding:4px 9px;font-size:12px;letter-spacing:2px;margin-top:6px;white-space:nowrap}
  .brand h1{margin:0;font-size:24px;letter-spacing:1px}
  .brand h1.titlebox{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:4px 22px;margin-bottom:8px;font-size:20px}
  .brand .bh1{font-size:20px}
  .brand .tag{margin:2px 0 0;color:var(--ink-2);font-size:13.5px}
  .top-actions{display:flex;gap:8px;align-items:center;padding-top:6px;flex-wrap:wrap}
  .tbtn{background:var(--card);border:1px solid var(--line-2);border-radius:9px;padding:6px 13px;color:var(--ink-2);font-size:13px}
  .tbtn:hover{border-color:var(--accent);color:var(--accent)}
  .saved-tip{font-size:12px;color:var(--ink-3);opacity:0;transition:opacity .4s}
  .saved-tip.show{opacity:1}

  /* ---------- 书单页 ---------- */
  .shelf{margin:10px auto 60px;padding:0 24px}
  .shelf-head{color:var(--ink-2);font-size:13.5px;margin:6px 0 16px}
  .shelf-head p{margin:0}
  .tfilter{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
  .ftab{background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:4px 14px;font-size:12.5px;color:var(--ink-2)}
  .ftab:hover{border-color:var(--accent);color:var(--accent)}
  .ftab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .shelf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  .addtile{background:transparent;border:1.5px dashed var(--line-2);border-radius:var(--radius);min-height:250px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;color:var(--ink-3);font-size:14px}
  .addtile:hover{border-color:var(--accent);color:var(--accent)}
  .addtile .plus{font-size:30px;line-height:1}
  .bcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.02);transition:transform .12s, box-shadow .12s}
  .bcard.dragging{opacity:.4;border-style:dashed;transform:none;box-shadow:none}
  .bcard:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(43,41,38,.08)}
  .cov{aspect-ratio:3/4;background:var(--accent-weak);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .cov img{width:100%;height:100%;object-fit:cover;display:block}
  .cov.ph{font-family:"Songti SC","STSong",serif;font-size:52px;font-weight:700;color:var(--accent);opacity:.55}
  /* 无封面书的艺术封面：按书名生成渐变书封 */
  .cov.art,.pthumb.art{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  .art-frame{position:absolute;inset:10px;border:1px solid rgba(255,255,255,.35);border-radius:6px;pointer-events:none}
  .art-t{position:relative;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-weight:700;color:#f6f3ec;text-align:center;line-height:1.55;letter-spacing:2px;padding:0 18px;text-shadow:0 1px 2px rgba(0,0,0,.18);word-break:break-all}
  .art-a{position:relative;font-size:11px;color:rgba(246,243,236,.78);letter-spacing:1px}
  .pthumb.art{gap:0}
  .pthumb.art .art-frame{inset:4px;border-radius:4px}
  .pthumb.art .art-t{letter-spacing:1px;padding:0 4px}
  .pthumb.art .art-a{display:none}
  .bbody{padding:11px 13px 13px}
  .bt{font-weight:600;font-size:14.5px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ba{color:var(--ink-3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .strow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .stchip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;background:#fff;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
  .stk-run{background:var(--accent);border-color:var(--accent);color:#fff}
  .stk-done{background:#eaf3ef;border-color:#bcd8cd;color:#2f7d6d}
  .stk-wait{background:#f4efe3;border-color:var(--line-2);color:#8a6d3b}
  /* 书卡状态胶囊按所属层次配色，不受首页全局色影响 */
  .stlv-js{background:#2f7d6d;border-color:#2f7d6d;color:#fff}
  .stlv-zd{background:#b4632c;border-color:#b4632c;color:#fff}
  .stlv-fx{background:#2f4b7d;border-color:#2f4b7d;color:#fff}
  .stpct{font-size:12px;color:var(--ink-3)}
  .bbody .pbar{margin-top:9px}
  .pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:40px}
  .pbar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
  .pbar.big{height:8px;margin-top:8px}
  .bmeta{color:var(--ink-3);font-size:12px;margin-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- 布局（清单页） ---------- */
  .layout{max-width:1120px;margin:8px auto 60px;padding:0 24px;display:grid;grid-template-columns:236px 1fr;gap:22px;align-items:start}
  #stepper{display:flex;flex-direction:column;gap:6px;position:sticky;top:14px}
  @media (max-width:1400px){
    .layout{grid-template-columns:1fr}
    #stepper{position:static;flex-direction:row;flex-wrap:wrap;overflow-x:visible;padding-bottom:4px}
    #stepper .sbtn{min-width:150px}
    #stepper .sgroup{display:none}
  }
  .sgroup{color:var(--ink-3);font-size:11.5px;letter-spacing:1.5px;padding:10px 10px 2px}
  .sbtn{display:flex;gap:9px;align-items:baseline;text-align:left;background:transparent;border:1px solid transparent;border-radius:10px;padding:7px 10px;color:var(--ink-2);font-size:13.5px;line-height:1.45}
  .sbtn:hover{background:var(--card)}
  .sbtn .num{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);color:var(--ink-3);font-size:11.5px;display:flex;align-items:center;justify-content:center;align-self:center;background:#fff}
  .sbtn .num.f{background:var(--accent);border-color:var(--accent);color:#fff}
  .sbtn.cur{background:var(--card);border-color:var(--line-2);color:var(--ink);font-weight:600}
  .sbtn.cur .num{border-color:var(--accent);color:var(--accent)}
  .sbtn.nextstage{border:1px solid var(--accent);background:var(--accent-weak);color:var(--accent);font-weight:600;margin-top:6px}
  .sbtn.nextstage:hover{background:var(--accent);color:#fff}
  .sbtn.nextstage:hover .sdel{color:rgba(255,255,255,.8)}
  .sbtn.nextstage .num{border-color:var(--accent);color:var(--accent)}
  .sbtn.nextstage:hover .num{border-color:#fff;color:#fff}
  .sbtn.nextstage.locked{opacity:.5;border-style:dashed}
  .sbtn.cur .num.f{color:#fff}
  .sbtn .sdel{color:var(--ink-3);font-size:11px;display:block}
  .progress{margin:4px 2px 4px;font-size:12px;color:var(--ink-3)}

  /* ---------- 主卡 / 字段 ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:30px 34px 26px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  @media (max-width:640px){.card{padding:22px 18px}}
  .kicker{color:var(--ink);font-size:15.5px;font-weight:700;letter-spacing:1px;margin-bottom:12px}
  .card h2{margin:0 0 12px;font-size:22px;letter-spacing:.5px}
  .card h3{margin:18px 0 8px;font-size:16px}
  .goal{color:var(--ink-2);margin:0 0 18px}
  /* 英文概念辅助小注（关键填写环节，原书术语对照） */
  .enh{font-style:italic;font-family:Georgia,"Times New Roman",serif;font-size:11.5px;font-weight:400;color:var(--ink-3);letter-spacing:.3px;margin-left:6px;white-space:nowrap}
  .field{margin-bottom:18px}
  .fbox{border:1px solid var(--line-2);border-radius:12px;background:rgba(255,255,255,.55);padding:14px 16px 4px;margin-bottom:16px}
  .fbox-t{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:12px}
  .fsep{border-top:1px dashed var(--line-2);margin:16px 0}
  .dwrap{position:relative}
  .dwrap.has-ph input[type=date]{color:transparent}
  .field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px;font-weight:600}
  .field .hint{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
  .fhint{color:var(--ink-3);font-size:12.5px;margin:6px 0 0}
  input[type=text],input[type=number],input[type=date],textarea{width:100%;background:#fff;border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;color:var(--ink);font:inherit;line-height:1.7;outline:none;resize:none}
  input[type=text]:focus,input[type=number]:focus,input[type=date]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  textarea{min-height:74px}

  /* 动态清单 */
  .list-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
  .list-row{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  .list-row .idx{flex:0 0 auto;color:var(--ink-3);font-size:12.5px;padding-top:7px;min-width:18px;text-align:right}
  .list-row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .list-row textarea,.qrow textarea,.ansbox textarea,.gcard-body textarea,.rows textarea{overflow-y:hidden}
  .list-row textarea{border:none;border-bottom:1px dashed var(--line-2);border-radius:0;min-height:0;padding:4px 2px;background:transparent;box-shadow:none}
  .list-row textarea:focus{border-bottom-color:var(--accent);box-shadow:none}
  .row-remove{flex:0 0 26px;background:none;border:none;color:var(--ink-3);font-size:16px;padding:4px 0;line-height:1.4}
  .row-remove:hover{color:#b0473b}
  .list-add{background:none;border:1px dashed var(--line-2);border-radius:8px;color:var(--ink-3);padding:5px 14px;font-size:13px}
  .list-add:hover{color:var(--accent);border-color:var(--accent)}
  .list-empty{color:var(--ink-3);font-size:13px;padding:6px 2px}

  /* 单选 chips */
  .choice{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:5px 14px;font-size:13.5px;color:var(--ink-2)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* 分组卡片 */
  .cards{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
  .gcard{border:1px solid var(--line-2);border-radius:12px;background:#fff;overflow:hidden}
  .gcard-head{display:flex;gap:8px;align-items:center;background:var(--accent-weak);padding:8px 12px;border-bottom:1px solid var(--line)}
  .gcard-head .gi{flex:0 0 auto;color:var(--accent);font-weight:700;font-size:12.5px}
  .gcard-head input[type=text]{border:none;background:transparent;font-weight:600;padding:2px 4px;box-shadow:none;border-bottom:1px dashed transparent;border-radius:0}
  .gcard-head input[type=text]:focus{border-bottom-color:var(--accent);box-shadow:none;border-bottom:1px dashed var(--accent)}
  .gcard-head input[type=text]::placeholder{font-weight:400}
  .gcard-head .row-remove{margin-left:auto}
  /* 章节地图（2026-10-07）：书卡间距 16px；相邻书籍的「包围」深浅红交替
     （深 = 绛红标题栏 + 绛红描边，栏内文字转浅；浅 = 原淡粉标题栏 + 淡玫瑰描边；跨页连续） */
  .zt-chapcard + .zt-chapcard{margin-top:16px}
  .zt-chapcard{border-color:#ddb9c3}
  .zt-chapcard.zt-dk{border-color:#8a3b4f}
  .zt-chapcard.zt-dk .gcard-head{background:linear-gradient(180deg,#8a3b4f,#7c2b3d);border-bottom-color:#6f2434}
  .zt-chapcard.zt-dk .gcard-head .gi{color:#f0d9dd}
  .zt-chapcard.zt-dk .gcard-head .zt-rt{color:#f6e7ea}
  .gcard-body{padding:12px 14px 4px}
  .gcard-body .field{margin-bottom:12px}
  .gcard-body .field label{font-size:12.5px}
  .gcard-body textarea{min-height:0}

  /* 表格 rows */
  .rows{width:100%;border-collapse:collapse;table-layout:fixed}
  .rows th{font-size:12px;color:var(--ink-3);text-align:left;font-weight:600;padding:0 8px 6px 0}
  .rows td{padding:0 8px 8px 0;vertical-align:top}
  .rows input[type=text]{width:100%;min-width:0}
  .rows textarea{width:100%;min-width:0;min-height:0}
  .rows .rowdel{background:none;border:none;color:var(--ink-3);font-size:15px;padding:6px 4px}
  .rows .rowdel:hover{color:#b0473b}
  .addrow{background:none;border:1px dashed var(--line-2);border-radius:8px;color:var(--ink-3);padding:5px 14px;font-size:13px}
  .addrow:hover{color:var(--accent);border-color:var(--accent)}

  /* 半栏 */
  .half-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:700px){.half-row{grid-template-columns:1fr}}

  /* ---------- 原文引用 ---------- */
  details.quote{margin:20px 0 6px;background:#f4efe3;border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 14px}
  details.quote summary{cursor:pointer;color:var(--ink-2);font-size:12.5px;letter-spacing:1px}
  details.quote p{margin:8px 0 2px;font-family:"Songti SC","STSong",serif;color:#4a463d;font-size:14.5px}
  details.quote .from{display:block;margin-top:4px;font-size:12px;color:var(--ink-3);font-family:-apple-system,"PingFang SC",sans-serif}

  /* ---------- 按钮 ---------- */
  .nav{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
  .nav.split{justify-content:space-between}
  .nav.split > .btn:not(.ghost){margin-left:auto}
  .btn{background:var(--accent);border:1px solid var(--accent);color:#fff;border-radius:10px;padding:9px 22px;font-size:14.5px;letter-spacing:1px}
  .btn:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
  .btn.ghost:hover{color:var(--accent);border-color:var(--accent);filter:none}
  .mini{background:#fff;border:1px solid var(--line-2);border-radius:7px;padding:3px 10px;font-size:12px;color:var(--ink-2)}
  .mini:hover{color:var(--accent);border-color:var(--accent)}
  /* 跨层次跳转键：按键目标层次的主题色（检视绿 / 主动橙 / 分析蓝） */
  .mini.lv-js{color:#2f7d6d;border-color:rgba(47,125,109,.5)}
  .mini.lv-js:hover{background:#2f7d6d;border-color:#2f7d6d;color:#fff}
  .mini.lv-zd{color:#b4632c;border-color:rgba(180,99,44,.5)}
  .mini.lv-zd:hover{background:#b4632c;border-color:#b4632c;color:#fff}
  .mini.lv-fx{color:#2f4b7d;border-color:rgba(47,75,125,.5)}
  .mini.lv-fx:hover{background:#2f4b7d;border-color:#2f4b7d;color:#fff}

  /* ---------- 阅读轮次 ---------- */
  .rblock{border:1px solid var(--line-2);border-radius:12px;background:#fff;padding:14px 16px 6px;margin-bottom:14px}
  .rhead{display:flex;gap:10px;align-items:center;margin-bottom:12px}
  .rhead .gi{color:var(--accent);font-weight:700;font-size:14px}
  .rhead .rpct{color:var(--ink-3);font-size:12.5px}
  .rhead .row-remove{margin-left:auto}
  .pctrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .pctrow input[type=range]{flex:1;min-width:140px;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--line-2);outline:none;border:none;padding:0;box-shadow:none}
  .pctrow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer}
  .pctrow input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer}
  .pctrow input[type=number]{width:76px;flex:0 0 auto;text-align:center;padding:6px 8px}
  .rbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0 14px}
  .whyin{flex:1;min-width:160px;padding:5px 10px;font-size:13px}
  .qrow{display:flex;gap:8px;align-items:flex-start;background:#fbf9f3;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  .qrow .idx{flex:0 0 auto;color:var(--ink-3);font-size:12.5px;padding-top:7px;min-width:18px;text-align:right}
  .qrow .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .qrow textarea{border:none;border-bottom:1px dashed var(--line-2);border-radius:0;min-height:0;padding:4px 2px;background:transparent;box-shadow:none}
  .qrow textarea:focus{border-bottom-color:var(--accent);box-shadow:none}
  .qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chapblk{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;margin-bottom:8px}
  .chapblk .chapblk-h{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .chapblk .chapblk-h input[type=text]{flex:1;min-width:0;border:none;background:transparent;font-weight:600;padding:2px 4px;box-shadow:none;border-bottom:1px dashed transparent;border-radius:0}
  .chapblk .chapblk-h input[type=text]:focus{box-shadow:none;border-bottom:1px dashed var(--accent)}
  .chapblk .chapblk-h input[type=text]::placeholder{font-weight:400}
  .qchip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;background:#fff;border:1px solid var(--line-2);color:var(--ink-3)}
  .qchip.ok{background:#eaf3ef;border-color:#bcd8cd;color:#2f7d6d}
  .qdel{background:none;border:none;color:var(--ink-3);font-size:14px;padding:2px 4px}
  .qdel:hover{color:#b0473b}
  .ansbox{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;margin-top:2px}
  .ansbox textarea{min-height:0}
  .ansfoot{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .ansfoot label{font-size:12px;color:var(--ink-3);margin:0}
  .ansfoot select{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line-2);border-radius:7px;background:#fff;color:var(--ink)}
  .ansprev{background:#f4efe3;border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink-2);margin-top:2px}

  /* ---------- 疑问问答 ---------- */
  .qa-sum{color:var(--ink-3);font-size:13px;margin:-4px 0 14px}
  .qa-h{margin-top:6px}
  .as-block{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;margin-bottom:10px}
  .as-item{display:flex;gap:8px;align-items:baseline;font-weight:600;font-size:14px;margin-bottom:8px}
  .as-item .idx{color:var(--accent);flex:0 0 auto;font-size:12.5px;font-weight:600}
  .as-item .qtext{flex:1;min-width:0}
  details.qadone{margin-top:14px}
  details.qadone summary{cursor:pointer;color:var(--ink-2);font-size:13.5px;font-weight:600;padding:6px 0}

  /* ---------- 阅读清单 ---------- */
  .planwrap{margin:10px auto 60px;padding:0 24px}
  .yqrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .ybtn{background:var(--card);border:1px solid var(--line-2);border-radius:9px;padding:6px 12px;color:var(--ink-2);cursor:pointer;font-family:inherit;font-size:13.5px}
  .ybtn:hover{color:var(--accent);border-color:var(--accent)}
  .ynum{font-family:"Songti SC","STSong",serif;font-weight:700;font-size:18px}
  .yearswitch{display:flex;gap:8px;align-items:center}
  .qtabs{display:flex;gap:6px;margin-left:auto}
  .qtab{background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:5px 16px;font-size:13.5px;color:var(--ink-2)}
  .qtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .plan-ov{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 22px;margin-bottom:16px;display:flex;gap:28px;align-items:center;flex-wrap:wrap}
  .plan-ov .big{font-family:"Songti SC","STSong",serif;font-weight:700;font-size:34px;color:var(--accent);line-height:1.1}
  .plan-ov .cap{color:var(--ink-3);font-size:12px}
  .plan-ov .ovbtns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .shelfimport{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
  .shelfchip{background:var(--card);border:1px solid var(--line-2);border-radius:8px;padding:7px 13px;font-size:13px;color:var(--ink-2);cursor:pointer;font-family:inherit}
  .shelfchip:hover{border-color:var(--accent);color:var(--accent)}
  .shelfchip i{font-style:normal;color:var(--ink-3);font-size:11.5px;margin-left:6px}
  .pick-div{height:1px;background:var(--line);margin:13px 0 11px}
  .plan-hint{font-size:12px;color:var(--ink-3);margin:-6px 2px 12px;letter-spacing:.5px}
  .plrm-x{position:absolute;top:8px;right:10px;width:22px;height:22px;border:none;background:transparent;color:var(--ink-3);font-size:13px;border-radius:50%;cursor:pointer;line-height:1;padding:0}
  .plrm-x:hover{color:#a03d2e;background:rgba(160,61,46,.08)}
  .plan-row{cursor:grab}
  .plan-row input,.plan-row textarea,.plan-row select,.plan-row button{cursor:auto}
  .plan-row.placing{opacity:.92;border-color:var(--line-2);box-shadow:0 12px 26px rgba(43,41,38,.15)}
  body.plandreordering, body.plandreordering *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
  .plan-row{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .pthumb{flex:0 0 44px;width:44px;height:58px;border-radius:7px;background:var(--accent-weak);overflow:hidden;display:flex;align-items:center;justify-content:center;font-family:"Songti SC","STSong",serif;font-weight:700;color:var(--accent);font-size:20px;opacity:.8}
  .pthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .pmain{flex:1;min-width:200px}
  .pmain .pt{font-weight:600;font-size:14.5px}
  .pmain .pa{color:var(--ink-3);font-size:12.5px}
  .pmain .pbar{margin-top:8px}
  .pmeta{color:var(--ink-3);font-size:12px;margin-top:5px}
  .plan-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:12px;align-items:start}
  .pfields{display:flex;flex-direction:column;gap:9px}
  .pfrow{display:flex;gap:10px;align-items:flex-end}
  .pf{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
  .pf label{font-size:11.5px;color:var(--ink-3)}
  .pf input[type=date]{width:100%;padding:6px 8px;font-size:13px}
  .pf input[type=number]{width:72px;padding:6px 8px;font-size:13px;text-align:center}
  .pf.pfw .pctrow{width:100%;margin-top:2px}
  .pf.pfw .pctrow input[type=range]{min-width:120px;flex:1}
  .plan-row{gap:12px}
  .plan-row .pmain{flex:0 0 170px;width:170px;max-width:170px;min-width:0}
  .plan-row .pmain .pt,.plan-row .pmain .pmeta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .plan-row .pfields{flex:1 1 auto;min-width:0}
  .pick-search{width:100%;box-sizing:border-box;padding:8px 10px;font-size:13.5px;border:1px solid var(--line-2);border-radius:8px;margin-bottom:12px;background:#fff}
  .fplain{padding:8px 0;font-size:13.5px;color:var(--ink)}
  .fplain.mut{color:var(--ink-3)}

  /* ---------- 归档室 ---------- */
  .arc-home{min-height:100vh}
  .arc-wrap{max-width:1000px;margin:0 auto;padding:34px clamp(18px,3vw,56px) 70px}
  .arc-mast{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:6px}
  .arc-mast h1{margin:0;font-size:clamp(28px,3vw,40px);letter-spacing:1px}
  .arc-en{font-size:11px;letter-spacing:3px;color:var(--ink-3);margin-top:6px}
  .arc-ops-top{display:flex;gap:8px;flex-wrap:wrap}
  .arc-lead{color:var(--ink-2);font-size:13.5px;margin:12px 0 24px;line-height:1.8;max-width:780px}
  .arc-card{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;margin-bottom:14px;transition:border-color .15s}
  .arc-card:hover{border-color:#b08d4f}
  .arc-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .arc-head h3{margin:0;font-size:17.5px}
  .arc-author{color:var(--ink-3);font-size:12.5px}
  .arc-dates{font-size:12.5px;color:var(--ink-2);margin:7px 0 10px;letter-spacing:.5px}
  .arc-reason{border-left:3px solid #b08d4f;background:rgba(176,141,79,.09);border-radius:0 9px 9px 0;padding:9px 14px;font-size:13.5px;line-height:1.75;color:var(--ink);white-space:pre-wrap;margin-bottom:13px}
  .arc-ops{display:flex;gap:8px;flex-wrap:wrap}
  .arc-sec-t{font-weight:700;font-size:15.5px;color:var(--accent);margin:28px 0 14px;border-bottom:1px solid var(--line);padding-bottom:7px}
  /* 归档笔记 = 只读：控件不可点、隐藏增删按钮、去掉编辑暗示 */
  .arc-lock input,.arc-lock textarea,.arc-lock button,.arc-lock .row-chip,.arc-lock .chip,.arc-lock .refchip{pointer-events:none}
  .arc-lock input,.arc-lock textarea{background:#faf9f7;color:var(--ink-2);box-shadow:none!important}
  .arc-lock .list-add,.arc-lock .row-remove,.arc-lock .tedit,.arc-lock .qdel,.arc-lock .rowdel,.arc-lock .list-empty{display:none}

  /* ---------- 抽屉 / 面板 ---------- */
  .overlay{position:fixed;inset:0;background:rgba(40,36,28,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
  .overlay.show{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:-999px;width:420px;max-width:94vw;height:100%;background:var(--card);border-left:1px solid var(--line);z-index:50;transition:right .25s;display:flex;flex-direction:column;pointer-events:none}
  .panel.wide{width:640px}
  .panel.show{right:0;pointer-events:auto}
  .panel .phead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
  .panel .phead h3{margin:0;font-size:17px}
  .panel .pbody{overflow:auto;padding:16px 20px;flex:1}
  .pclose{background:none;border:none;font-size:20px;color:var(--ink-3)}
  .tool-sec{margin-bottom:18px}
  .tool-sec h4{margin:0 0 6px;font-size:14px;color:var(--accent)}
  .tool-sec p,.tool-sec ul{margin:0;color:var(--ink-2);font-size:13.5px}
  .tool-sec ul{padding-left:1.3em}

  /* ---------- 分类助手 ---------- */
  .ptabs{display:flex;gap:6px;margin-bottom:14px}
  .ptabs button{flex:1;background:#fff;border:1px solid var(--line-2);border-radius:9px;padding:7px 0;font-size:13.5px;color:var(--ink-2)}
  .ptabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .clf-lead{color:var(--ink-2);font-size:12.5px;margin:0 0 10px}
  .clf-gate{margin-bottom:12px}
  .clf-q{font-weight:700;font-size:13.5px;margin-bottom:2px}
  .clf-line{color:var(--ink-2);font-size:12px;margin:0 0 8px;line-height:1.65}
  .clf-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media (max-width:480px){.clf-two{grid-template-columns:1fr}}
  .clf-card{border:1px solid var(--line-2);border-radius:10px;background:#fff;padding:9px 11px}
  .clf-card h5{margin:0 0 4px;font-size:12.5px}
  .clf-card ul{margin:0;padding-left:1.15em;font-size:12px;line-height:1.65;color:var(--ink-2)}
  .clf-card ul li{margin:2px 0}
  .clf-card.blue{border-color:#c3cbe0;background:rgba(47,75,125,.06)}
  .clf-card.blue h5{color:#2f4b7d}
  .clf-card.orange{border-color:#e6c8ae;background:rgba(180,99,44,.06)}
  .clf-card.orange h5{color:#b4632c}
  .clf-hard{background:#f4efe3;border-radius:8px;padding:7px 10px;font-size:11.5px;color:#8a6d3b;margin-top:8px;line-height:1.65}
  .clf-tail{color:var(--ink-2);font-size:12px;line-height:1.7;background:#fbf9f3;border:1px dashed var(--line-2);border-radius:8px;padding:8px 11px;margin:12px 0 0}
  .clf-from{color:var(--ink-3);font-size:11.5px;margin-top:8px}

  /* ---------- 首页 · 藏书架（Demo E 移植） ---------- */
  /* ---------- 整体背景色主题（2026-10-07）：只换背景（首页墙 / 阅览室墙 / 书的桌面），不动笔记与表单内部配色 ---------- */
  :root{
    --bg-home: radial-gradient(1400px 600px at 50% -300px, rgba(255,250,238,.85), transparent 70%), repeating-linear-gradient(0deg, rgba(110,90,60,.03) 0 1px, transparent 1px 4px), #e6dcc8;
    --bg-room: radial-gradient(1300px 560px at 50% -180px, rgba(195,155,95,.15), transparent 68%), linear-gradient(180deg, #3a2d1c 0%, #3a2d1c 66%, #2c2114 66.2%, #221a10 100%);
    --bg-desk: radial-gradient(1300px 520px at 50% -260px, rgba(255,248,230,.55), transparent 70%), repeating-linear-gradient(0deg, rgba(110,90,60,.045) 0 1px, transparent 1px 4px), linear-gradient(165deg,#cdc0a1,#b3a37e);
  }
  html[data-bg="1"]{ --bg-home: radial-gradient(1400px 600px at 50% -300px, rgba(250,254,246,.85), transparent 70%), repeating-linear-gradient(0deg, rgba(90,105,88,.035) 0 1px, transparent 1px 4px), #e0e5d6; --bg-room: radial-gradient(1300px 560px at 50% -180px, rgba(120,160,130,.16), transparent 68%), linear-gradient(180deg, #24382e 0%, #24382e 66%, #182820 66.2%, #1c2c24 100%); --bg-desk: radial-gradient(1300px 520px at 50% -260px, rgba(245,252,240,.5), transparent 70%), repeating-linear-gradient(0deg, rgba(85,100,85,.045) 0 1px, transparent 1px 4px), linear-gradient(165deg,#c5cdb8,#a8b39a); }
  html[data-bg="2"]{ --bg-home: radial-gradient(1400px 600px at 50% -300px, rgba(248,251,254,.85), transparent 70%), repeating-linear-gradient(0deg, rgba(85,100,115,.035) 0 1px, transparent 1px 4px), #dfe4ea; --bg-room: radial-gradient(1300px 560px at 50% -180px, rgba(140,170,200,.16), transparent 68%), linear-gradient(180deg, #26313d 0%, #26313d 66%, #1b2530 66.2%, #151d26 100%); --bg-desk: radial-gradient(1300px 520px at 50% -260px, rgba(245,249,253,.5), transparent 70%), repeating-linear-gradient(0deg, rgba(80,95,110,.045) 0 1px, transparent 1px 4px), linear-gradient(165deg,#c2cbd6,#a3aebc); }
  html[data-bg="3"]{ --bg-home: radial-gradient(1400px 600px at 50% -300px, rgba(255,251,250,.85), transparent 70%), repeating-linear-gradient(0deg, rgba(120,95,100,.03) 0 1px, transparent 1px 4px), #ebe0de; --bg-room: radial-gradient(1300px 560px at 50% -180px, rgba(205,150,155,.15), transparent 68%), linear-gradient(180deg, #3a2c30 0%, #3a2c30 66%, #2c2125 66.2%, #221a1d 100%); --bg-desk: radial-gradient(1300px 520px at 50% -260px, rgba(255,246,244,.5), transparent 70%), repeating-linear-gradient(0deg, rgba(115,90,95,.045) 0 1px, transparent 1px 4px), linear-gradient(165deg,#d6c2c0,#bca6a4); }
  html[data-bg="4"]{ --bg-home: radial-gradient(1400px 600px at 50% -300px, rgba(252,250,255,.85), transparent 70%), repeating-linear-gradient(0deg, rgba(100,95,120,.03) 0 1px, transparent 1px 4px), #e5e2ea; --bg-room: radial-gradient(1300px 560px at 50% -180px, rgba(165,150,205,.15), transparent 68%), linear-gradient(180deg, #322c3a 0%, #322c3a 66%, #241f2c 66.2%, #1c1823 100%); --bg-desk: radial-gradient(1300px 520px at 50% -260px, rgba(250,247,255,.5), transparent 70%), repeating-linear-gradient(0deg, rgba(95,90,115,.045) 0 1px, transparent 1px 4px), linear-gradient(165deg,#cbc4d4,#b0a8bd); }
  /* 背景色下拉（2026-10-07 由循环按钮改为下拉选择）：首页＝跳转书架同款纸感；阅览室＝鎏金同款 */
  .bk-bgsel{
    font-family:inherit;font-size:13.5px;color:var(--bk-ink);letter-spacing:1px;
    background:rgba(255,253,246,.7);border:1px solid #9a7c46;border-radius:4px;padding:8px 12px;cursor:pointer;
  }
  .bk-bgsel:hover{border-color:var(--bk-ink)}
  .rg-bgsel{
    color:var(--rg-gilt);background:none;font-family:inherit;font-size:13px;letter-spacing:2px;
    border:1px solid rgba(211,176,106,.45);border-radius:3px;padding:9px 12px;cursor:pointer;transition:.15s;
  }
  .rg-bgsel:hover{background:rgba(211,176,106,.14);border-color:var(--rg-gilt)}
  .bk-home{
    --bk-ink:#3a2f22; --bk-ink2:#6f6250; --bk-gilt:#d8b872;
    background: var(--bg-home);
    min-height:100vh;padding:26px 0 60px;color:#3a2f22;
  }
  .bk-strip{
    display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;
    margin:0;padding:13px 40px;
    border-top:2px solid var(--bk-ink);border-bottom:2px solid var(--bk-ink);
    font-size:14px;color:#544735;letter-spacing:1px;
  }
  .bk-strip .lv{display:flex;gap:18px;white-space:nowrap}
  .bk-strip .lv b{font-weight:700;color:var(--bk-ink);position:relative;padding-left:13px}
  .bk-strip .lv b::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:1px}
  .bk-strip .lv .j::before{background:#2f7d6d}
  .bk-strip .lv .z::before{background:#b4632c}
  .bk-strip .lv .f::before{background:#2f4b7d}
  .bk-strip .lv .t::before{background:#8a3b4f}
  .bk-mast{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:30px 40px 24px}
  .bk-title{
    font-family:"Songti SC","STSong","Noto Serif SC",serif;
    font-size:clamp(38px,3.4vw,62px);font-weight:900;letter-spacing:.28em;line-height:1;color:var(--bk-ink);margin:0;
  }
  .bk-en{margin-top:10px;font-size:12px;color:var(--bk-ink2);letter-spacing:5px;font-family:Georgia,serif}
  .bk-ops{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .bk-ops .tbtn{background:rgba(255,253,246,.5);border:1px solid var(--bk-ink);border-radius:0;color:var(--bk-ink);letter-spacing:2px}
  .bk-ops .tbtn:hover{background:var(--bk-ink);color:#f2ead6}
  .bk-ops .tbtn.bk-addbtn{color:#a03d2e;border-color:#a03d2e}
  .bk-ops .tbtn.bk-addbtn:hover{background:#a03d2e;color:#fff}
  .bk-home .tfilter{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 40px 6px;margin:0}
  .bk-home .ftab{
    background:linear-gradient(180deg,#e8d9ae,#c9ae74);border:1px solid #9a7c46;border-radius:3px;color:#5c4a32;
    padding:7px 16px;font-size:12.5px;letter-spacing:2px;
    box-shadow:inset 0 1px 0 rgba(255,245,215,.7),0 1px 2px rgba(60,40,15,.35);
  }
  .bk-home .ftab:hover{filter:brightness(1.05)}
  .bk-home .ftab.on{
    background:linear-gradient(180deg,#5c4a32,#463622);border-color:#3a2c18;color:#ecd9a4;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.4);
  }
  .bk-count{margin-left:auto;font-size:12px;color:var(--bk-ink2);letter-spacing:2px}
  .bookcase{
    margin:22px 26px 0;
    border:14px solid transparent;border-image:linear-gradient(160deg,#7c5836,#5a3d24 45%,#3f2a17) 1;
    background:linear-gradient(180deg,#efe6d2,#e2d6bd);
    box-shadow:0 24px 50px -24px rgba(60,40,15,.45), inset 0 0 60px rgba(120,90,50,.14);
    padding:0 20px;
  }
  .bk-pair{display:flex;flex-direction:column}
  .bk-pairrow{display:flex;gap:18px;align-items:stretch;flex:1 1 auto}
  .bk-divider{flex:0 0 12px;align-self:stretch;border-radius:3px;
    background:linear-gradient(90deg,#5a3d24,#7c5836 45%,#462f18);
    box-shadow:inset 0 0 0 1px rgba(255,220,160,.16), 3px 0 8px rgba(40,25,10,.30), -3px 0 8px rgba(40,25,10,.30);}
  .bk-pair .bk-unit{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
  .bk-pair .bk-unit .bk-rows{flex:1 1 auto}
  .bk-unit{position:relative;border-radius:4px;transition:opacity .15s ease}
  .bk-unit.dragunit{opacity:.5;outline:2px dashed #8a6f4e;outline-offset:-8px;background:rgba(255,253,246,.35);transition:none}
  .bk-cap{display:flex;justify-content:space-between;align-items:flex-start;padding:14px 10px 10px;cursor:grab}
  .bk-cap .t{font-size:13px;letter-spacing:4px;color:var(--bk-ink2);display:flex;flex-direction:column;align-items:flex-start;gap:3px}

  .bks-map{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 10px}

  .bks-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed #cbbd9c;padding-top:12px;margin-top:6px}

  /* ---------- 阅览室 · 按类型浏览（Demo G 移植） ---------- */

  .rg-strip .lv .z{border-color:var(--rg-zd);color:var(--rg-zd)}

  .rg-filter{display:flex;flex-wrap:wrap;gap:8px;margin:30px 0 8px}

    font-size:12px;letter-spacing:2px;padding:6px 14px;cursor:pointer;color:#d8c08a;font-family:inherit;

  .rg-search{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.22);border:1px solid rgba(211,176,106,.35);border-radius:2px;padding:0 8px 0 12px;transition:.15s}

  .bk-spine::after{bottom:52px}

  #mdview{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;overflow:auto;max-height:56vh;font-size:13px;line-height:1.8;white-space:pre-wrap;font-family:-apple-system,"PingFang SC",sans-serif}

  /* ---------- 流水线：主动阅读三栏 / 回顾栏 ---------- */
  /* ---------- 流水线：主动/分析 = 摊开的书（Demo H 移植） ---------- */
  body.bookmode{ background: var(--bg-desk); }
  .layout.dual{
    max-width:none;display:flex;gap:0;align-items:stretch;position:relative;
    margin:8px 46px 60px;padding:0;min-height:calc(100vh - 170px);
    filter:drop-shadow(0 30px 42px rgba(56,40,16,.38));
  }
  /* 中缝 */
  .layout.dual::before{
    content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;z-index:4;pointer-events:none;
    background:linear-gradient(180deg,rgba(66,48,22,.32),rgba(66,48,22,.14) 30%,rgba(66,48,22,.14) 70%,rgba(66,48,22,.32));
  }
  /* 下方页摞：通宽垫在侧条之下，遮住转角接缝 */
  .layout.dual::after{
    content:"";position:absolute;left:-8px;right:-8px;bottom:-8px;height:12px;z-index:-1;
    background:repeating-linear-gradient(0deg,#f2ead4 0 1.4px,#d9ccab 1.4px 2.6px);
    border-radius:0 0 8px 8px;box-shadow:inset 0 -2px 2px rgba(90,70,40,.25);
  }
  /* 书口（左右页摞）：横纹、止于页脚圆角之上 */
  .bkedge{
    position:absolute;top:6px;bottom:12px;width:9px;z-index:3;pointer-events:none;
    background:repeating-linear-gradient(0deg,#f2ead4 0 1.4px,#d9ccab 1.4px 2.6px);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.5);
  }
  .bkedge-l{left:-8px;border-radius:5px 0 0 0}
  .bkedge-r{right:-8px;border-radius:0 5px 0 0}
  /* 左右书页 */
  .page{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .page-l{
    border-radius:10px 3px 3px 10px;
    background:
      linear-gradient(270deg, rgba(70,50,24,.20), rgba(70,50,24,.07) 52px, rgba(70,50,24,0) 110px),
      radial-gradient(120% 100% at 0% 0%, rgba(255,255,255,.5), transparent 60%),
      repeating-linear-gradient(0deg, rgba(120,95,60,.02) 0 2px, transparent 2px 5px),
      linear-gradient(180deg,#fdf9ef,#f3ebd7);
  }
  .page-r{
    border-radius:3px 10px 10px 3px;
    background:
      linear-gradient(90deg, rgba(70,50,24,.20), rgba(70,50,24,.07) 52px, rgba(70,50,24,0) 110px),
      radial-gradient(120% 100% at 100% 0%, rgba(255,255,255,.5), transparent 60%),
      repeating-linear-gradient(0deg, rgba(120,95,60,.02) 0 2px, transparent 2px 5px),
      linear-gradient(180deg,#fdf9ef,#f3ebd7);
  }
  /* 丝带书签：当前层次色 */
  .ribbon{
    position:absolute;top:0;right:14px;width:22px;height:88px;z-index:6;pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(0,0,0,.18)), var(--accent);
    clip-path:polygon(0 0,100% 0,100% 100%,50% 84%,0 100%);
    box-shadow:2px 3px 6px rgba(50,35,15,.35);
  }
  /* 页眉 / 页脚 */
  .phead{flex:none;padding:20px 46px 12px;border-bottom:1px solid var(--line);position:relative}
  .page-l .phead{padding-right:58px}
  .phead-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .runhead{font-size:22px;letter-spacing:4px;color:var(--ink);font-weight:800;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif}
  .phead-desc{font-size:13px;color:var(--ink-2);line-height:1.75;margin-top:8px;letter-spacing:.2px}
  .phead-nav{display:flex;gap:8px}
  .stagetrack{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .sgtab{background:#fffdf6;border:1px solid var(--line-2);border-radius:999px;padding:4px 14px;font-size:12.5px;color:var(--ink-2)}
  .sgtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .sgtab.todo{border-style:dashed;color:var(--ink-3)}
  .sgtab.todo em{font-style:normal;font-size:10.5px;margin-left:6px;opacity:.7}
  .phead-sub{font-size:11px;color:var(--ink-3);letter-spacing:1px;margin-top:6px}
  .pfoot{flex:none;display:flex;justify-content:space-between;align-items:center;padding:9px 46px 12px;
    font-family:Georgia,serif;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line)}
  .page-l .pfoot{padding-right:58px}
  .page-r .pfoot{padding-left:58px}
  .pfoot .orn{font-family:"Songti SC","STSong",serif;letter-spacing:2px;font-size:11px}
  /* 内容区：书页随内容自然长高（无限长） */
  .sheet{flex:1 0 auto;padding:18px 46px 30px}
  .page-l .sheet{padding-right:58px}
  .page-r .sheet{padding-left:58px}
  /* 表单卡 / 回顾卡融入书页 */
  .layout.dual #stage{background:transparent;border:none;border-radius:0;box-shadow:none;padding:0}
  .layout.dual .rcard{background:transparent;border:none;border-radius:0;box-shadow:none;padding:0}
  /* 左缘步骤签（当前层次） */
  .edgetabs-l{position:absolute;left:-34px;top:64px;display:flex;flex-direction:column;gap:10px;z-index:8}
  .layout.dual #stepper{display:contents}
  .etab-l{
    writing-mode:vertical-rl;letter-spacing:3px;font-size:12.5px;font-weight:600;color:#f6efdc;
    padding:16px 8px;border-radius:7px 0 0 7px;opacity:.8;display:flex;align-items:center;gap:8px;border:none;
    background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(0,0,0,.12)), var(--accent);
    box-shadow:-2px 2px 6px rgba(50,35,15,.35);transition:.15s;
  }
  .etab-l:hover{transform:translateX(-3px);opacity:.95}
  .etab-l.on{transform:translateX(-5px);opacity:1}
  .etab-l .fdot{width:7px;height:7px;border-radius:50%;background:rgba(246,239,220,.45)}
  .etab-l.has .fdot{background:#d8b872}
  /* 右缘索引签（回顾层次） */
  .edgetabs{position:absolute;right:-34px;top:64px;display:flex;flex-direction:column;gap:10px;z-index:8}
  .etab{
    writing-mode:vertical-rl;letter-spacing:4px;font-size:12.5px;font-weight:600;color:#f6efdc;
    padding:16px 8px;border-radius:0 7px 7px 0;opacity:.8;cursor:pointer;
    box-shadow:2px 2px 6px rgba(50,35,15,.35);transition:.15s;
  }
  .etab:hover{transform:translateX(3px);opacity:.95}
  .etab.on{transform:translateX(5px);opacity:1}
  .etab.lv-js{background:linear-gradient(180deg,#37917d,#2f7d6d)}
  .etab.lv-zd{background:linear-gradient(180deg,#c97537,#b4632c)}
  .etab.lv-fx{background:linear-gradient(180deg,#3a5b93,#2f4b7d)}
  /* 翻页微动画 */
  @keyframes flipL{0%{opacity:.15;transform:perspective(1500px) rotateY(6deg)}100%{opacity:1;transform:none}}
  @keyframes flipR{0%{opacity:.15;transform:perspective(1500px) rotateY(-6deg)}100%{opacity:1;transform:none}}
  .flip-l{animation:flipL .5s cubic-bezier(.22,.8,.3,1);transform-origin:100% 50%}
  .flip-r{animation:flipR .5s cubic-bezier(.22,.8,.3,1);transform-origin:0 50%}

  /* ---------- 检视阅读：摊开的书 · 只露右页（封面 + 已读页摞 + 中缝 + 单页 + 未读页摞） ---------- */
  .layout.roll{
    position:relative;display:flex;width:min(1120px,calc(100% - 140px));
    margin:8px auto 60px;min-height:calc(100vh - 170px);
    filter:drop-shadow(0 30px 42px rgba(56,40,16,.38));
  }
  /* 右书口页摞（未读页）：竖纹、贴紧页缘 */
  .layout.roll::before{
    content:"";position:absolute;top:3px;bottom:5px;right:-4px;width:9px;z-index:3;pointer-events:none;
    background:repeating-linear-gradient(90deg,#f2ead4 0 1.5px,#b5a37c 1.5px 3px);
    border-radius:0 4px 4px 0;
    box-shadow:inset 1px 0 2px rgba(60,45,20,.35), 2px 3px 5px rgba(50,35,15,.25);
  }
  /* 底部页摞（坐在封面上） */
  .layout.roll::after{
    content:"";position:absolute;left:0;right:-4px;bottom:-8px;height:12px;z-index:-1;
    background:repeating-linear-gradient(0deg,#f2ead4 0 1.4px,#d0c29e 1.4px 2.6px);
    border-radius:0 0 8px 8px;box-shadow:inset 0 -2px 2px rgba(90,70,40,.25);
  }
  /* 封面包边：深绿布面，比书页大一圈，左 / 上 / 下缘露出几毫米 */
  .rollcover{
    position:absolute;left:-14px;right:-3px;top:-3px;bottom:-11px;z-index:-2;pointer-events:none;
    border-radius:5px 12px 12px 8px;
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.03) 0 2px, transparent 2px 4px),
      linear-gradient(160deg,#20463b,#16352c 55%,#0f2820);
    box-shadow:inset 0 1px 0 rgba(255,245,220,.12), inset 0 -2px 4px rgba(0,0,0,.35);
  }
  /* 已读页摞（书脊侧一薄摞，比未读侧略旧） */
  .rollread{
    position:absolute;left:-10px;top:6px;bottom:10px;width:9px;z-index:2;pointer-events:none;
    background:repeating-linear-gradient(90deg,#ece2c6 0 1.5px,#a89468 1.5px 3px);
    border-radius:3px 0 0 3px;
    box-shadow:inset -1px 0 2px rgba(60,45,20,.3);
  }
  /* 中缝折痕 */
  .rollcrease{
    position:absolute;left:0;top:0;bottom:0;width:2px;margin-left:-1px;z-index:4;pointer-events:none;
    background:linear-gradient(180deg,rgba(66,48,22,.4),rgba(66,48,22,.18) 30%,rgba(66,48,22,.18) 70%,rgba(66,48,22,.4));
  }
  /* 单页 = 摊开书的右页（左缘弯进中缝的弧度阴影） */
  .page-roll{
    border-radius:3px 10px 10px 3px;
    background:
      linear-gradient(90deg, rgba(70,50,24,.30), rgba(70,50,24,.12) 46px, rgba(70,50,24,0) 108px),
      radial-gradient(120% 100% at 100% 0%, rgba(255,255,255,.5), transparent 60%),
      repeating-linear-gradient(0deg, rgba(120,95,60,.02) 0 2px, transparent 2px 5px),
      linear-gradient(180deg,#fdf9ef,#f3ebd7);
  }
  .page-roll .phead{padding-left:58px}
  .page-roll .sheet{padding-left:58px}
  .page-roll .pfoot{padding-left:58px}
  /* 步骤签：左缘深色签与其他层次同款（基础 .etab-l 渐变样式），只保留定位与尺寸覆盖 */
  .layout.roll .edgetabs-l{left:-34px;top:66px;width:44px;align-items:center;gap:12px}
  .layout.roll .etab-l{width:40px;justify-content:center;padding:12px 0;letter-spacing:3px;font-size:12.5px}
  .layout.roll #stepper{display:contents}
  .layout.roll #stage{background:transparent;border:none;border-radius:0;box-shadow:none;padding:0}
  .mini.lk{opacity:.55;border-style:dashed}

  @media (max-width:1100px){
    .layout.dual{flex-direction:column;min-height:0;margin:8px 14px 40px}
    .layout.roll{flex-direction:column;width:100%;min-height:0;margin:8px 14px 40px}
    .page{flex:0 0 auto}
    .layout.dual::before,.bkedge{display:none}
    .layout.roll::before,.layout.roll::after,.rollcover,.rollread,.rollcrease{display:none}
    .page-l{border-radius:10px 10px 3px 3px}
    .page-r{border-radius:3px 3px 10px 10px}
    .page-roll{border-radius:10px}
    .edgetabs-l,.edgetabs{position:static;flex-direction:row;flex-wrap:wrap;padding:12px 16px 0}
    .etab-l,.etab{writing-mode:horizontal-tb;padding:7px 14px;border-radius:7px 7px 0 0;letter-spacing:2px}
    .layout.roll .edgetabs-l{width:auto;gap:8px}
    .layout.roll .etab-l{width:auto;writing-mode:horizontal-tb;padding:7px 14px;border-radius:7px 7px 0 0;letter-spacing:2px}
    .etab-l:hover,.etab:hover{transform:none}
    .etab-l.on,.etab.on{transform:translateY(3px)}
    .layout.dual .sheet,.layout.dual .phead,.layout.dual .pfoot{padding-left:22px;padding-right:22px}
    .layout.dual .page-l .phead{padding-right:56px}
    .layout.roll .sheet,.layout.roll .phead,.layout.roll .pfoot{padding-left:22px;padding-right:22px}
    .layout.roll .page-roll .phead{padding-right:56px}
  }
  /* 右栏按层次套用主题色（覆盖页面主色）：检视绿、主动橙 */
  #review.lv-js{--accent:#2f7d6d;--accent-weak:rgba(47,125,109,.12)}
  #review.lv-zd{--accent:#b4632c;--accent-weak:rgba(180,99,44,.12)}
  #review.lv-fx{--accent:#2f4b7d;--accent-weak:rgba(47,75,125,.12)}
  /* 右栏默认锁定（只读），点「编辑」后才可修改 */
  .rcard.locked .rv-body input,.rcard.locked .rv-body textarea,.rcard.locked .rv-body button,
  .rcard.locked .rv-body .chip,.rcard.locked .rv-body .row-chip{pointer-events:none}
  .rcard.locked .rv-body input,.rcard.locked .rv-body textarea{background:#faf9f7;color:var(--ink-2);box-shadow:none!important}
  .rv-h{margin:0 0 10px;font-size:18px}
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:30px 34px 26px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .rv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
  .rv-head .rv-t{font-weight:700;font-size:15px;color:var(--accent)}
  .rv-pager{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2);letter-spacing:1px}
  /* 主题阅读：小节标题行（标题 + 右侧翻页） */
  .zt-sechead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .zt-sechead h3{margin:0}
  .rv-pager button{border:1px solid var(--line-2);background:#fff;border-radius:6px;color:var(--ink-2);font-size:12px;line-height:1;padding:4px 9px;cursor:pointer;font-family:inherit}
  .rv-pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .rv-pager button:disabled{opacity:.35;cursor:default}
  .rv-sec-t{flex-wrap:wrap;row-gap:4px}
  .rv-hops{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .rv-hops .mini{padding:3px 10px;font-size:11.5px}
  /* 右栏「只读回顾」（.rv-ro）：与左页同构——控件 readonly/disabled、保留纸张与输入框形制 */
  .rv-ro input[readonly],.rv-ro textarea[readonly]{background:#fcfbf8;cursor:default}
  .rv-ro button[disabled]{opacity:.42;cursor:default}
  .rv-ro button[disabled]:hover{filter:none;opacity:.42}
  .rvtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .rvtabs.rvsrow{margin-bottom:8px}
  .rvsrow .rvtab{font-weight:600;color:var(--accent)}
  .rvsrow .rvtab.on{color:#fff}
  .rvtab{background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:4px 14px;font-size:12.5px;color:var(--ink-2)}
  .rvtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .rv-f{margin-bottom:14px}
  .rv-f .rv-l{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-bottom:2px}
  .rv-f .rv-v{font-size:13.5px;color:var(--ink);line-height:1.7;white-space:pre-wrap}
  .rv-f .rv-v.mut{color:var(--ink-3)}
  .rv-f ul{margin:2px 0;padding-left:1.2em;font-size:13.5px;color:var(--ink)}
  .rv-sec{margin-bottom:14px}
  .rv-sec-t{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:6px;border-bottom:1px dashed var(--line-2);padding-bottom:4px}
  .rv-row{font-size:12.5px;color:var(--ink-2);margin:3px 0;line-height:1.65}
  .rv-row b{color:var(--ink);font-weight:600}
  .rv-ol{margin:4px 0 0;padding-left:1.7em;font-size:13px;line-height:1.75;color:var(--ink)}
  .rv-ol li{margin:2px 0}
  .rv-mut{color:var(--ink-3);font-size:12.5px}
  .qgroup{border-top:1px solid var(--line);padding-top:16px;margin-top:20px}
  .qgroup:first-of-type{border-top:none;padding-top:0;margin-top:0}
  .qgroup h3{margin:0 0 12px;font-size:16px}
  .row-chips{display:flex;flex-wrap:wrap;gap:6px}
  .row-chip{background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:2px 11px;font-size:12.5px;color:var(--ink-3);cursor:pointer}
  .row-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .list-row input[type=text]{border:none;border-bottom:1px dashed var(--line-2);border-radius:0;padding:4px 2px;background:transparent;box-shadow:none}
  .list-row input[type=text]:focus{border-bottom-color:var(--accent);box-shadow:none}
  /* 本书框架：内核（主题+主旨） + 从属议题 */
  .tree-grid{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
  @media (max-width:900px){.tree-grid{grid-template-columns:1fr}}
  .tree-trunk,.tree-branch{border:1px solid var(--line-2);border-radius:12px;background:#fff;padding:16px 18px}
  .tree-t{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:1px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px}
  .tree-tv{font-size:14px;line-height:1.8}
  .tree-tv.mut{color:var(--ink-3)}
  .tree-row{display:flex;gap:8px;align-items:flex-start;background:#fbf9f3;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .tree-row .tree-arrow{color:var(--accent);font-weight:700;padding-top:8px;flex:0 0 auto}
  .tree-row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .tree-row input[type=text],.tree-row textarea{border:none;border-bottom:1px dashed var(--line-2);border-radius:0;padding:4px 2px;background:transparent;box-shadow:none;min-height:0}
  .tree-row input[type=text]:focus,.tree-row textarea:focus{border-bottom-color:var(--accent);box-shadow:none}
  .jd-reason{margin-top:6px}
  /* 作者的问题：双栏分框区分 */
  .qsplit{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:900px){.qsplit{grid-template-columns:1fr}}
  .qbox{border:1px solid var(--line-2);border-radius:12px;background:#fff;padding:14px 16px 12px}
  .qbox.qa-ask{border-top:3px solid #2f4b7d;background:rgba(47,75,125,.03)}
  .qbox.qa-ask .qbox-t{color:#2f4b7d}
  .qbox.qa-solve{border-top:3px solid #b4632c;background:rgba(180,99,44,.03)}
  .qbox.qa-solve .qbox-t{color:#b4632c}
  .qbox-t{font-size:13px;font-weight:700;letter-spacing:1px;margin-bottom:10px}
  .refchip{display:inline-block;background:#fff;border:1px solid var(--line-2);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--ink-2);cursor:pointer;margin:2px 2px 0 0}
  .refchip:hover{border-color:var(--accent);color:var(--accent)}
  .lockbox{border:1px dashed var(--line-2);border-radius:12px;background:#fbf9f3;padding:22px 24px;color:var(--ink-2);font-size:13.5px;line-height:1.8}
  .lockbox b{color:var(--ink)}
  .sbtn.locked{opacity:.45}
  .sbtn.locked .num{border-style:dashed}
  .sbtn.collapsed{border:1px dashed var(--line-2);border-radius:10px;color:var(--ink-3)}
  .modepick{display:flex;flex-direction:column;gap:8px}
  .modeopt{border:1px solid var(--line-2);border-radius:10px;background:#fff;padding:10px 12px;cursor:pointer;text-align:left}
  .modeopt.on{border-color:var(--accent);background:var(--accent-weak)}
  .modeopt .mt{font-weight:600;font-size:13.5px}
  .modeopt .md{color:var(--ink-3);font-size:12px;margin-top:2px}

  /* ---------- 主题阅读（议题） ---------- */
  /* 选书模式：大标题下方的议题横幅（米色纸带 + 鎏金描边，贴合阅览室） */
  .rg-banner{margin:0 0 6px;background:linear-gradient(180deg,#f3ecd8,#e8ddbd);color:#544735;border:1px solid #9a7c46;border-radius:4px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 4px 12px -6px rgba(0,0,0,.5)}

解答什么。阶段是理解上的推进，不是做完一版再重来——后面的阶段会不断修正这里的答案，随时回来改。"},{"name":"阶段二 · 诠释","desc":"诠释一本书的内容的规则","count":4,"goal":"诠释书的内容：先与作者达成词义共识，再从最重要的句子抓出主旨、把论述的前因后果重新架构出来，最后清点作者的问题哪些有了答案。这里的共识与主旨，会不断回头修正阶段一的框架。"},{"name":"阶段三 · 评论","desc":"像是沟通知识一样地评论一本书的规则","count":3,"goal":"阅读是与作者的对话：作者说完了，现在该你开口。先用三条礼节自检确认自己有资格评论（规则九至十一），再用四个批评标准逐条评定（规则十二至十五）——每个批评都必须精确指认问题并提出证据；前三个标准拿不出证据，你就有义务同意。"}],"reviewName":"分析阅读记录","s1t":"规则一 · 先分类：这是哪一类的书？","s1goal":"分析阅读的第一个规则：越早知道自己在读的是哪一类书越好。检视时已粗判过——可以维持，也可以重新选择；拿不准就做一下分类测试。","s1label":"这本书的类型（可多选）","s1reason":"分类理由（可不填）","s1reasonPh":"例：书名带「如何」，前言也在讲该达成什么——判为实用","s1quiz":"拿不准？做分类测试 →","s2t":"规则二 · 用一 / 几句话总结整本书","s2goal":"用一两句话（最多一小段）说出整本书在谈什么。可以引用原文——书名页、序言里作者自己的说明往往就是现成的；也可以在此基础上打磨成自己的说法。如果你要说的话太多，说明还没看清整体。","s2label":"我的总结","s2ph":"例：阅读分四个层次，层次越高越主动，理解力来自有系统的规则训练","s3t":"规则三 · 还原本书框架","s3goal":"框架是这本书的「操作系统图」：关注的不是章节排列，而是思想的关联性与底层逻辑。先写下主题与主旨（内核，写短——完整的概括属于上一步「一句话」），再把从属议题按关联挂上去、填入要点。不必照抄目录，也不必完美：作出一个草稿，就该感到满足了。","s3subject":"本书主题","s3subjectPh":"例：阅读的层次与方法","s3thesis":"本书主旨","s3thesisPh":"例：阅读分四个层次，层次越高越主动，理解力来自有系统的规则训练","s3branch":"从属议题（先起议题名，再往里加要点）","s3cardPh":"议题名，例：二、分析阅读","s3add":"添加一个议题","s3itemPh":"例：第 5 条规则 与作者达成共识","s3itemAdd":"添加一条要点","s4t":"规则四 · 作者想问的问题","s4goal":"书的内容就是作者的答案——找出他一开始就想问、想解决的问题，分两类填写。","s4aLabel":"作者要问的问题","s4aPh":"例：如何从不太理解进步到更理解？","s4aAdd":"添加一个问题","s4bLabel":"作者想要解决的问题","s4bPh":"例：让读者掌握一套可操作的阅读规则","s4bAdd":"添加一个问题","tabs":["分类","一句话","本书框架","作者的问题","术语共识","关键句主旨","论述","找出解答","礼节自检","批评标准","整体评论"],"dels":["这是哪类书","说出整本书","还原思想框架","作者想解答什么","找出关键字并达成共识","抓关键句找主旨","架构论述的前因后果","清点问题的解答","先懂再评 · 规则九至十一","四个批评标准 · 规则十二至十五","总结这本书与我"],"s5t":"规则五 · 抓关键字，与作者达成共识","s5goal":"找出作者在书中的核心字词：记下它出现的位置，摘录作者对它的定义，再用自己的话复述一遍。共识不是点出来的——是复述出来、再一遍遍改出来的。","s5label":"关键术语（一词一卡）","s5cardPh":"关键字，例：阅读","s5pos":"出现位置（章节 + 页）","s5posPh":"例：第二章 · p.41","s5def":"作者对它的定义（摘录）","s5defPh":"摘录原文即可，不要求总结。","s5mine":"我的复述（用自己的话）","s5minePh":"例：不含娱乐的、为增进理解而读","s5add":"添加一个术语","s6t":"规则六 · 抓关键句，找出主旨","s6goal":"从书中圈出最重要的句子——作者的判断与断言往往藏在其中。一句一卡：记下位置、摘录原句，卡名就是主旨——作者最终想说什么？用你的话复述出来，说得清才算真懂。这里的主旨是逐条提炼的，与规则三的「本书主旨」（全书内核）粒度不同。","s6cardPh":"主旨：作者最终想说什么？用你的话复述，例：阅读越主动收获越大","s6pos":"出现位置（章节 + 页）","s6posPh":"例：第九章 · p.114","s6sent":"关键句 · 摘录","s6sentPh":"摘录原文即可，不要求总结。","s6add":"添加一个关键句","s7t":"规则七 · 找出论述，重新架构","s7goal":"主旨（结论）不是孤立的句子，它靠论述支撑。从上方规则六抓出的主旨点一下即建卡，再还原作者的论述过程：他凭什么这样说（论据，按先后排列）？这些论据如何推出结论（论证）？留意哪些是作者当作假设、哪些是他要证明的。","s7ref":"规则六 · 已抓出的主旨（点主旨即建卡）","s7empty":"点上方主旨快速建卡，或点下方按钮手动添加。","s7cardPh":"主旨 / 结论，例：读者必须主动才能增进理解","s7evid":"论据（作者凭什么这样说：事实、数据、案例、理由，按先后）","s7evidPh":"例：第三章的实验数据；作者举的 X 案例","s7evidAdd":"添加一条论据","s7logic":"论证（这些论据如何推出结论）","s7logicPh":"例：由 A 与 B 推出 C；注意作者把 X 当作不证自明的假设","s7add":"添加一个论述","s8t":"规则八 · 找出作者的解答","s8goal":"最后一个步骤是清点：作者想要解决的问题，哪些解决了？哪些没有？未解决的里面，哪些是作者自己知道解决不了的？有了前面的共识、主旨与论述，现在是验收的时候。","s8askT":"作者要问的问题","s8solveT":"作者想要解决的问题","s8chips":[["y","已解决"],["n","未解决"],["u","作者也不知道"]],"s8wPh":"答案要点 / 出处（可不填）","s8empty":"先在规则四「作者的问题」添加问题，这里会逐条生成评定块。","s9t":"规则九至十一 · 先懂再评：评论前的三条自检","s9goal":"评论之前先过三道关。规则九：没懂就没资格评——坦然回头补阶段一二，不丢人；规则十：说理，不争胜；规则十一：评断要有理论基础。都是自检，如实勾选即可。","s9tools":"拿不准？先翻一下速查卡，回顾规则九至十一的要点，再做选择 →","s9toolsBtn":"打开速查卡","s9wLabel":"我当前的判断（可不填）","s9wPh":"一句话记下你此刻的判断依据","s9a":{"t":"规则九 · 我读懂了吗？","opts":[["y","我懂了，可以开始评论"],["n","还没，先回阶段一二补"],["x","这本书没法理解（架构混乱或词义模糊）"]]},"s9b":{"t":"规则十 · 我是在说理，还是在争胜？","hint":"可多选","opts":[["emo","我知道自己的情绪与偏见在哪"],["pre","我愿意摊开自己的前提假设"],["emp","我能从作者的立场想一遍"]]},"s9c":{"t":"规则十一 · 我的评断有根据吗？","hint":"可多选","opts":[["know","我能区分作者说的哪些是知识、哪些是个人观点"],["base","我的不同意见有自己的理论或证据支持"]]},"s10t":"规则十二至十五 · 批评的四个标准","s10goal":"说出「我了解，但我不同意」之后，用这四个标准逐条判断。这里只做判断——判了「有此问题」的标准，左缘会多出一签，点进去逐条写下你的证据（举证责任在你）。前三个标准拿不出证据，你就有义务同意作者；第四个标准（不完整）只能导向暂缓评论。","s10chips":[["ok","无此问题"],["no","有此问题"]],"s10blocks":[["r12","规则十二 · 作者知识不足","他缺少哪些与问题相关的知识？这些知识若补上，会如何改变结论？","知识不足"],["r13","规则十三 · 作者知识错误","他的哪个主张与事实相反？事实是什么（或更可能的相反立场是什么）？","知识错误"],["r14","规则十四 · 作者不合逻辑","推论在哪里缺乏连贯、或前后矛盾？例举精确的句子。","不合逻辑"],["r15","规则十五 · 作者的分析不完整","他一开始提出的问题，哪些没有解决？哪些资料没有善用？","分析不完整"]],"s10detailLabel":"证据与理由（一条一条写：先精确指认问题点，再给出你的理由）","s10detailPh":"例：第 3 章 p.87 作者断言 X，但……","s10detailAdd":"添加一条","s10detailEmpty":"点下方按钮，把证据逐条加进来。","s10ref15":"规则八 · 未解答的问题（可作佐证）","s10verdict":"由评定推导的结论","s10vPending":"先完成上面四个标准的评定","s10vAgree":"我有义务同意作者——前三个标准都拿不出证据，就是被说服了","s10vDisagree":"不同意（理由见各标准的证据页）","s10vHold":"暂缓评论：作者的分析不完整（并未解决他提出的所有问题）","s11t":"收尾 · 我对此书的整体评论与收获","s11goal":"分析阅读到这里就走完了。合上这本书之前，写下两样东西：你对这本书的整体评论——它完成了什么、没完成什么，你是同意、不同意还是暂缓；以及它与你何干——你带走了什么。","s11aLabel":"我对此书的整体评论","s11aPh":"例：骨架清晰、方法可操作；但第三章的例子年代久远，我暂缓对其实用性的评论","s11bLabel":"与我何干 / 我的收获","s11bPh":"例：我以前的读书方式停在检视；以后每本难书，先走完分析阅读的前两个阶段"},"quiz":{"title":"分类测试","lead":"依原书第六章的分类法，两至三个点选逐步定位。结果可一键同步为本书类型。","g1q":"它在讲故事让你「经历」，还是在陈述观点让你「知道」？","g1a":"讲故事 / 跟着人物走（虚构）","g1b":"陈述观点 / 传达知识（论说）","g2q":"它主要在说「这是什么」，还是「你该怎么做」？","g2a":"是什么 —— 陈述事实与真理（理论）","g2b":"怎么做 —— 应该 / 应当 / 好坏（实用）","g3aq":"虚构作品里，它更接近哪一类？","g3aopts":["小说·故事","戏剧","诗"],"g3bq":"理论作品里，它更接近哪一类？","g3bopts":["历史（特定时间地点的事）","科学·数学（超出日常经验才可信）","哲学（凭共通经验可核对）"],"g3bmap":["历史","科学·数学","哲学"],"result":"判断结果","apply":"同步为本书类型","again":"重新选"},"classifier":{"tabName":"分类助手","lead":"对照下面两步的线索自行判断：先看它是不是论说性作品，再分辨理论还是实用。结果填进步骤一「类型粗判」即可。","gate1":{"q":"第一步 · 是论说性作品，还是虚构作品？","line":"论说性：主要由观点、理论、假设、推断组成，作者声称有根据，目的是传达知识。虚构：小说、戏剧、诗，让你跟着故事走。","two":[{"name":"虚构作品","clues":["在读故事、跟着人物走，而不是核对一串主张","书名看不出？读几页便知——在读故事就是虚构"]},{"name":"论说性作品","clues":["满页主张与论证，作者在说服你「某事是真的」","符合这些 → 再看第二步"]}],"hard":"书名会骗人：《飘》是小说不是历史，《大街》是小说不是社会学论述——小说让人「经历」，论说让人「知道」。"},"gate2":{"q":"第二步 · 这本论说书：理论，还是实用？","line":"知与行：理论教你「这是什么」，实用教你「该怎么做」。速判——说「是」的是理论；说「应该」「应当」的是实用。","cards":[{"name":"理论性作品","tone":"blue","clues":["前言质疑「有效性」：关心知识的起源、真理与极限","内文陈述「是什么」：某事真实，这就是事实","形态多为分析讨论、研究报告、数据观察"]},{"name":"实用性作品","tone":"orange","clues":["书名带「如何……」「……的技巧」，直接归类","前言质疑「目的」：该达成什么（洛克两书对照）","内文高频「应该、好、坏、结果」：这样做比那样好","指南、手册、演说规劝，伦理/政治/经济的教导论述"]}],"hard":"提醒：不同意作者 ≠ 书不实用（康德《实践理性批判》）；雄辩 ≠ 实用（《共产党宣言》vs《资本论》）；一本书可兼两类（斯宾诺莎《伦理学》）——存点怀疑心。"},"tail":"理论书再细分：讲某时某地发生过什么的是历史；要超日常经验（实验、实地考察）才可信的是科学，凭共通经验就能核对的是哲学——这两类一般不会认错。","from":"总结自第六章「一本书的分类」"},"toolsByStage":{"home":{"label":"总览 · 阅读的四个层次","secs":[{"title":"基础阅读 · 第一层次","text":"摆脱文盲、看懂字句的层次——要回答的问题是「这个句子在说什么？」。小学阶段就应完成；读陌生文字或生僻用词时会重新遇上。","items":["阅读准备：身体、智力与语言上的准备。","认字：从看图识字般的起步开始。","字汇增长：学会从上下文推断与运用。","精炼与增进：把前面所学的技巧纯熟化。"]},{"title":"检视阅读 · 第二层次","text":"系统化略读的艺术——在规定时间内抓出一本书的重点。要回答：这本书在谈什么？架构如何？包含哪些部分？是哪一类的书？","items":["检视阅读一 · 有系统的略读：书名页与序言 → 目录 → 索引 → 出版文案 → 翻内文与结尾，几分钟到一小时完成。","检视阅读二 · 粗浅的阅读：难书的第一遍从头到尾读完，不在难点上停顿——理解 50% 也远好于 0%。"]},{"title":"分析阅读 · 第三层次","text":"全盘的、完整的、优质的阅读——不限时间，把一本书咀嚼与消化成自己的。只在追寻理解时才需要。三个阶段、十五条规则：","items":["阶段一 · 结构（规则 1–4）：分类、一句话说出全书、拟出纲要、找出作者想问的问题。","阶段二 · 诠释（规则 5–8）：与作者达成共识、找出主旨与论述、判断作者解答了哪些问题。","阶段三 · 评论（规则 9–15）：先理解再评断，理性表达同意或反对，并为自己的判断找出理论基础。"]},{"title":"主题阅读 · 第四层次（最高）","text":"最复杂也最主动的阅读——围绕一个主题读很多书，列举它们的相关之处，架构出一个哪本书里都没提过的主题分析。五个步骤：","items":["找到相关的章节：你关心的主题才是重点，书只是材料。","带引作者与你达成共识：建立一套中立的语言，让各位作者进入同一套话语。","厘清问题：建立中立的主旨，把要回答的问题按顺序列出来。","界定议题：找出作者们意见分歧之处，把争议整理成议题。","分析讨论：把问题与议题依序排列，保持客观，照单呈现各方的回答。"]},{"title":"层次是累积的","text":"较高的阅读层次包含较低层次的特性：检视里含着基础，分析里含着检视，主题阅读则要动用前面所有层次的技巧。"}]},"js":{"label":"检视阅读","secs":[{"title":"阅读速度三招","text":"在阅读一本书的时候，慢不该慢到不值得，快不该快到有损于满足与理解。","items":["依读物的性质与复杂程度用不同速度：多数书不值得慢读；好书中也总有可以快读的间隙部分。","警惕「逗留」与「倒退」：眼睛在一行字上停五六个点、读完两三行又倒回去，是速度的两大敌人。","把手指当指针：三指并拢顺着行移动，比眼睛感觉的速度略快一点，强迫眼睛跟上。"]},{"title":"两个子层次","items":["有系统的略读：看书名页与序言、研究目录、检阅索引、读出版文案、翻内文与结尾——几分钟到一小时，回答「值不值得读、是本什么书」。","粗浅的阅读：难书的第一遍——从头到尾读完，不在难点上停顿，理解 50% 也远好于 0%。"]},{"title":"作者的问题公式","text":"书的内容就是作者的答案。找不出他在问什么时，对照这两组典型问题（第七章）。","two":[{"name":"理论性问题 · 问「是什么」","tone":"blue","clues":["某件事存在吗？它是什么样的事？","发生的原因是什么？在什么情况下存在、为什么存在？","这件事的目的是什么？造成了什么影响？","有什么特性与特征？与同类/不同事件如何关联？是如何进行的？"]},{"name":"实用性问题 · 问「怎么做」","tone":"orange","clues":["有哪些结果可以选择？应该采取什么样的手段？","要达到某个目的，应该采取哪些行动？以什么顺序？","在什么条件下这样做是对的、比那样做更好？"]}]},{"title":"一句话提醒","text":"略读的总目标是发现这本书值不值得多花时间；而疑问清单，是你为下一次阅读预付的订金。"}]},"zd":{"label":"主动阅读 · 四问","secs":[{"title":"四个问题","text":"任何一次主动阅读都要回答的四个问题（原书第二章）。它们递进：先懂整体，再懂细节，然后判断，最后落到「与我何干」。"},{"title":"问题一 · 整体来说，这本书在谈什么？","items":["找出这本书的主题。","看作者如何依次发展这个主题。","看他如何从核心主题分解出从属的关键议题。"]},{"title":"问题二 · 作者细部说了什么，怎么说的？","items":["找出作者主要的想法、声明与论点。","把从属议题一条一个识别出来——它们组合起来，传达了什么样的特殊讯息。"]},{"title":"问题三 · 说得有道理吗？整体与细部分开判断","items":["先对全书做整体判断，并写下理由。","再对拆分出的议题逐条表态：赞同、存疑或不赞同。","等你真正了解了，才有资格说是——详尽的规则见分析阅读阶段三。"]},{"title":"问题四 · 这本书跟你有什么关系？","items":["这些资讯对你有什么意义？作者为什么认为它重要？","如果它不只给了资讯、还启发了你，写下更深的含意与建议。","落到行动：要做的、要追问的。"]}]},"fx1":{"label":"分析阅读 · 阶段一：结构（规则 1–4）","secs":[{"title":"阶段一的目标","text":"找出一本书在谈些什么：它是什么类型、一句话说什么、框架怎么排、作者想解答什么。"},{"title":"规则一 · 先分类","text":"越早知道自己在读的是哪一类的书越好：虚构还是论说？论说再分理论与实用。拿不准时用「分类助手」页签。"},{"title":"规则二 · 一句话说出整本书","text":"用一个单一的句子（最多几句话）叙述整本书的内容。要说的话太多，说明还没看清整体。"},{"title":"规则三 · 还原本书框架","text":"框架是书的「操作系统图」：先定主题与主旨（内核），再把从属议题按关联性挂上去、填入要点。关注思想的关联与底层逻辑，而不是章节排列；不必照抄目录，草稿即可。"},{"title":"规则四 · 找出作者的问题","text":"书的内容就是作者的答案。找出他一开始就想问的问题，和想要解决的问题。（两组典型问题见检视阶段的「作者的问题公式」。）"}]},"fx2":{"label":"分析阅读 · 阶段二：诠释（规则 5–8）","secs":[{"title":"阶段二的目标","text":"诠释一本书的内容：与作者达成词义共识，从关键句抓出主旨，架构论述的前因后果，最后清点作者解答了哪些问题。"},{"title":"规则五 · 抓关键字，达成共识","text":"找出作者的核心字词：记下出现位置，摘录作者对它的定义，再用自己的话复述一遍。共识不是点出来的——是复述出来、再一遍遍改出来的。"},{"title":"规则六 · 抓关键句，找出主旨","text":"从最重要的句子中抓出作者的重要主旨：摘录原句、记下位置，再用自己的话复述——说得出来才算真懂。"},{"title":"规则七 · 找出论述，重新架构","text":"主旨不是孤立的句子。把支撑某个主张的句子按先后关联排成序列，重新架构出论述的前因后果。"},{"title":"规则八 · 找出作者的解答","text":"清点作者想解决的问题：哪些解决了、哪些没有；未解决的里面，哪些是作者自己知道解决不了的。"}]},"fx3":{"label":"分析阅读 · 阶段三：评论（规则 9–15）","secs":[{"title":"评论式阅读的礼节","text":"像与作者对话一样地评论一本书：先了解，再评断；不逞口舌之快；为自己的意见找根据。（精简自第十章「公正地评断一本书」）"},{"title":"规则九 · 先懂再评","text":"在你说出「我同意」「我不同意」或「我暂缓评论」之前，一定要能肯定地说：「我了解了。」","items":["毫无理解便同意是愚蠢；还不清楚便不同意是无礼。","暂缓评论也是一种评论——它表示你还没有被说服。","说「我不懂」之前要尽最大努力：读一本好书读不懂，通常是读者的错；确实尽力后仍不懂，才轮到书的问题。"]},{"title":"规则十 · 理性表达，不争强好辩","text":"当你不同意作者的观点时，要理性地表达自己的意见，不要无理地辩驳或争论。","items":["大多数人以赢得辩论为目标，却忘了要学习的是真理——「赢」只在于增进知识，不在于打败作者。","作者不在场，你随时能「赢」下这场争辩；但为反对而反对，什么也学不到。","像你有权反对一样，也要有同意的心理准备：要顾虑的只有事实与真理。"]},{"title":"规则十一 · 为评断找出理论基础","text":"尊重知识与个人观点的不同，在作任何评断之前，都要找出理论基础。","items":["知识存在于可以辩护的意见之中——有证据或理论支持；没有理论支持的评断，只是个人意见。","赞同，是与作者分享同一个理论；不赞同，则必须拿出自己的理论根据。","作者没有理论基础的主旨只是他的个人意见——把「可以核实的」与「作者这么看」分开。"]},{"title":"三则摘要（第十章结尾）","items":["先完整地了解一本书，不要急着开始批评。","不要争强好辩或盲目反对。","把知识上的不同意见看作大体上可以解决的问题——并为你的不同意见找到理论基础。"]},{"title":"批评的四个标准（第十一章）","text":"说出「我了解，但我不同意」之后，用这四点向作者说明。每个批评都要精确指认问题并提出证据——举证责任在读者。","items":["知识不足：缺少与问题相关的知识——指出缺什么、补上会如何改变结论。","知识错误：主张与事实相反——说明事实，或给出更可能的相反立场。","不合逻辑：推论缺乏连贯或前后矛盾——例举精确的句子。","分析不完整：没解决他一开始提出的所有问题——这一点只能导向暂缓评论，不能作为不同意的根据。"]}]},"zt":{"label":"主题阅读 · 多书对话","secs":[{"title":"五个步骤 · 速览","text":"主题阅读是最高层次的阅读：就同一个问题读很多本书，让作者们隔空对话。","items":["找到相关的章节：你关心的主题才是重点，书只是材料——为每本入选的书标出与议题最相关的章节。","带引作者与你达成共识：造一套中立的词汇，把各家说法翻译进来。","厘清问题：建立中立的主旨，把要回答的问题按顺序列出来。","界定议题：找出作者们意见分歧之处，逐题整理各家立场，并列引用原文。","分析讨论：把问题与议题依序排成一场讨论，保持客观，照单呈现各方的回答。"]},{"title":"主题工具书的三种用法","text":"如果你不知道从哪儿开始找书，可以借助主题工具书（如《西方世界的经典名著》的 Syntopicon）。","items":["启动阅读——从一个主题切入经典：先读各书的相关短章，再决定要不要整本读。","建议阅读——顺着兴趣长出新的主题，越读越广。","指导阅读——同一段文字出现在不同主题之下，多重诠释会训练你读出更丰富的含义。"]},{"title":"客观性提醒","text":"主题阅读追求的是「辩证的客观」：面面俱到，而自己并不预设立场。","items":["总结作者观点时，用你自己的中立词汇，不用他的原话下结论。","但总结旁边一定并列引用原文，避免扭曲，让读者能核对。","偏见会从「总结方式、强调与忽略的比重、答案的排列顺序」里溜进来——回头看一遍你的报告。"]},{"title":"这份笔记的学名 = 辩证笔记","text":"主题阅读的笔记叫「辩证笔记」——就一个主题，把许多作者相关的陈述与疑问按顺序列出来。议题工作台的汇总页生成的，就是它的雏形。"}]}},"summaryNote":"这份书单与疑问记录属于「结构笔记」——记的是书的架构与你的疑问，不是内容细节。未解答的疑问会在重读时逐条兑现。","footNote":"阅读系统 · 检视 → 主动 → 分析 单书流水线 · 依据《如何阅读一本书》。数据保存在浏览器本地。"};</script>
<script>
(function(){
  var P = window.PRODUCT;
  var STEP_N = P.steps.length || 5;
  var LS_B = 'hrab_pipe_books';
  var LS_P = 'hrab_pipe_plans';
  var LS_U = 'hrab_pipe_ui';
  var LS_T = 'hrab_pipe_types';
  var LS_SH = 'hrab_pipe_shelves';   // 首页书架布局：{ shelves:[{n,ids}...], cart:[书id...] }
  var LS_BG = 'hrab_pipe_bgtheme';   // 整体背景色主题下标（0-4）
  var LS_TP = 'hrab_pipe_topics';    // 主题阅读议题：[{ id, created, issue, why, cur, refs, terms, thesis, questions, positions, discussion, mine }]
  var shelvesData = null;
  var bkCart = [];
  var canStore = true;
  var saveTimer = null, tipTimer = null;

  /* ================= 基础工具 ================= */
  function esc(s){ return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function today(){
    var d = new Date();
    return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
  }
  function firstChar(s){ var a = Array.from(String(s||'').trim()); return a.length ? a[0] : '？'; }

      var inXls = {};
      nsd.forEach(function(s){ s.ids.forEach(function(id){ inXls[id] = 1; }); });
      var cartX = bkCart.slice();
      books.forEach(function(b){ if (!inXls[b.id] && cartX.indexOf(b.id) === -1) cartX.push(b.id); });
      books = books.concat(newOnes);
      shelvesData = nsd;
      bkCart = cartX;
      lsSet(LS_B, JSON.stringify(books));
      saveShelves();
      lsSet('hrab_pipe_seed_xls', '1');
    }
    /* 旧数据迁移：同类书由单框清单 [{t}] 改为书名/作者双列 [[书名,作者]] */
    books.forEach(function(bk){
      /* 版本迁移：v3 步骤编号映射；v4 清除旧逻辑自动代填的结束日期（进行中的轮次一律清空，等你自选） */
      if(bk && bk.ver < 3){
        var oc = bk.cur || 1;
        if(bk.s3){ bk.cur = oc <= 5 ? Math.min(oc, 3) : oc - 2; }        /* 五步时代：1-5 步、6 轮次、7 问答 */
        else { bk.cur = oc <= 3 ? oc : (oc === 4 ? 3 : oc - 1); }        /* 四步时代：1-4 步、5 轮次、6 问答 */
      }
      if(bk && bk.ver < 4){
        (bk.rounds||[]).forEach(function(rd){
          if(rd.state !== 'done') rd.end = '';
        });
      }
      if(bk) bk.ver = 4;
      /* v5：流水线——每本书增加阅读模式与主动阅读（四问）数据袋 */
      if(bk && bk.ver < 5){
        bk.mode = bk.mode || 'std';
        if(!bk.zd || typeof bk.zd !== 'object') bk.zd = {};
        bk.zd.theme = bk.zd.theme || ''; bk.zd.verdict = bk.zd.verdict || ''; bk.zd.meaning = bk.zd.meaning || '';
        if(!Array.isArray(bk.zd.subs)) bk.zd.subs = [];
        if(!Array.isArray(bk.zd.claims)) bk.zd.claims = [];
        if(!Array.isArray(bk.zd.actions)) bk.zd.actions = [];
        if(!bk.zd.judge || typeof bk.zd.judge !== 'object') bk.zd.judge = {};
        bk.ver = 5;
      }
      if(bk && !bk.zdcur) bk.zdcur = 1;
      /* v6：四问重塑——旧的从属议题（subs）并入新议题清单（issues）；旧主张表态按主张索引记录，与议题不再对应，重置 */
      if(bk && bk.ver < 6){
        var z6 = bk.zd || {};
        if(!Array.isArray(z6.issues)){
          z6.issues = [];
          (z6.subs||[]).forEach(function(x){ var t = String((x&&x.t)||'').trim(); if(t) z6.issues.push({ t: t }); });
        }
        if(typeof z6.vreason !== 'string') z6.vreason = '';
        z6.judge = {};
        bk.ver = 6;
      }
      var pr = bk && bk.s1 && bk.s1.peers;
      if(Array.isArray(pr) && pr.length && pr[0] && typeof pr[0] === 'object' && !Array.isArray(pr[0])){
        bk.s1.peers = pr.map(function(x){ return [String((x && x.t) || ''), '']; });
      }
      /* 索引选项精简：旧长文案 → 新短选项 */
      if(bk && bk.s3 && bk.s3.hasidx){
        if(bk.s3.hasidx === '有索引，翻过了') bk.s3.hasidx = '有索引';
        else if(bk.s3.hasidx === '没有索引（电子书 / 中文原创书常见）') bk.s3.hasidx = '没有索引';
      }
      /* 索引步骤并入目录页（s3 → s2），提到的书移入翻内文（s3.cites → s5.cites 转双列），回看内文删除 */
      var s3 = bk && bk.s3;
      if(s3){
        bk.s2 = bk.s2 || {};
        if((!Array.isArray(bk.s2.terms) || !bk.s2.terms.length) && Array.isArray(s3.terms)) bk.s2.terms = s3.terms;
        if((!Array.isArray(bk.s2.topics) || !bk.s2.topics.length) && Array.isArray(s3.topics)) bk.s2.topics = s3.topics;
        if(Array.isArray(s3.cites) && s3.cites.length){
          bk.s5 = bk.s5 || {};
          if(!Array.isArray(bk.s5.cites) || !bk.s5.cites.length){
            bk.s5.cites = s3.cites.filter(function(x){ return x && String(x.t||'').trim(); })
                                  .map(function(x){ return [String(x.t||''), '']; });
          }
        }
        delete bk.s3;
      }
      if(bk.s2){ bk.s2.terms = bk.s2.terms || []; bk.s2.topics = bk.s2.topics || []; }
      if(bk.s5){ bk.s5.cites = bk.s5.cites || []; }
      /* 已解答但缺轮次标注的疑问：回填为提问轮次 */
      (bk.rounds||[]).forEach(function(rd, ri){
        (rd.qs||[]).forEach(function(q){
          if(String(q.ans||'').trim() && !q.ansR) q.ansR = ri + 1;
        });
      });
      /* v7：分析阅读（阶段一 · 结构）数据袋 */
      if(bk && bk.ver < 7){
        if(!bk.fx || typeof bk.fx !== 'object') bk.fx = {};
        bk.fx.cls = bk.fx.cls || ''; bk.fx.unity = bk.fx.unity || '';
        if(!Array.isArray(bk.fx.outline)) bk.fx.outline = [];
        if(!bk.fxcur) bk.fxcur = 1;
        bk.ver = 7;
      }
      /* v8：主干改为手填；作者的问题拆分为「要问的 / 要解决的」 */
      if(bk && bk.ver < 8){
        var f8 = bk.fx || {};
        bk.fx = f8;
        if(typeof f8.trunk !== 'string') f8.trunk = '';
        if(!Array.isArray(f8.qsAsk)) f8.qsAsk = [];
        if(!Array.isArray(f8.qsSolve)) f8.qsSolve = [];
        (f8.problems||[]).forEach(function(x){ var t = String((x&&x.t)||'').trim(); if(t) f8.qsSolve.push({ t: t }); });
        delete f8.problems;
        bk.ver = 8;
      }
      /* v9：类型改多选（字符串→数组）；纲要分支 note → items 要点清单 */
      if(bk && bk.ver < 9){
        if(bk.s1){
          if(typeof bk.s1.cls === 'string') bk.s1.cls = bk.s1.cls.trim() ? [bk.s1.cls.trim()] : [];
          if(!Array.isArray(bk.s1.cls)) bk.s1.cls = [];
        }
        var f9 = bk.fx || (bk.fx = {});
        if(typeof f9.cls === 'string') f9.cls = f9.cls.trim() ? [f9.cls.trim()] : [];
        if(!Array.isArray(f9.cls)) f9.cls = [];
        if(!Array.isArray(f9.outline)) f9.outline = [];
        f9.outline.forEach(function(c){
          if(!c || Array.isArray(c.items)) return;
          c.items = [];
          var nt = String(c.note==null?'':c.note).trim();
          if(nt) c.items.push({ t: nt });
          delete c.note;
        });
        bk.ver = 9;
      }
      /* v10：新增图书表单去掉「阅读模式 / 封面上传」，改收出版社与版次 */
      if(bk && bk.ver < 10){
        bk.publisher = bk.publisher || '';
        bk.edition = bk.edition || '';
        bk.ver = 10;
      }
      /* v11：分析阅读分出阶段二（规则 5-8 落地）；规则三「全书主干」拆为 主题 + 主旨 */
      if(bk && bk.ver < 11){
        var f11 = bk.fx || (bk.fx = {});
        f11.subject = f11.subject || '';
        f11.thesis = f11.thesis || f11.trunk || '';
        delete f11.trunk;
        if(!Array.isArray(f11.sents)) f11.sents = [];
        if(!Array.isArray(f11.args)) f11.args = [];
        if(!f11.resolved || typeof f11.resolved !== 'object' || Array.isArray(f11.resolved)) f11.resolved = {};
        bk.ver = 11;
      }
      /* v12：规则一增加「分类理由」字段；类型粗判等过往层次引用条移出分析阅读 */
      if(bk && bk.ver < 12){
        var f12 = bk.fx || (bk.fx = {});
        f12.clsReason = f12.clsReason || '';
        bk.ver = 12;
      }
      /* v13：规则六卡名即主旨——原「主旨 · 我的复述」并入卡名，字段删除 */
      if(bk && bk.ver < 13){
        var f13 = bk.fx || (bk.fx = {});
        (f13.sents||[]).forEach(function(c){
          if(!c) return;
          if(!String(c.__name||'').trim() && String(c.mine||'').trim()) c.__name = String(c.mine).trim();
          delete c.mine;
        });
        bk.ver = 13;
      }
      /* v14：规则七重构为 主旨（卡名）+ 论据（evid）+ 论证（logic）；原理由序列（items）并入论据 */
      if(bk && bk.ver < 14){
        var f14 = bk.fx || (bk.fx = {});
        (f14.args||[]).forEach(function(c){
          if(!c) return;
          if(!Array.isArray(c.evid)) c.evid = Array.isArray(c.items) ? c.items : [];
          delete c.items;
          if(typeof c.logic !== 'string') c.logic = '';
        });
        bk.ver = 14;
      }
      /* v15：分析阅读阶段三（评论，规则 9-15）数据袋 */
      if(bk && bk.ver < 15){
        var f15 = bk.fx || (bk.fx = {});
        if(!f15.etiquette || typeof f15.etiquette !== 'object') f15.etiquette = { r9:'', r10:[], r11:[] };
        if(!Array.isArray(f15.etiquette.r10)) f15.etiquette.r10 = [];
        if(!Array.isArray(f15.etiquette.r11)) f15.etiquette.r11 = [];
        if(!f15.critique || typeof f15.critique !== 'object' || Array.isArray(f15.critique)) f15.critique = {};
        bk.ver = 15;
      }
      /* v16：批评标准改为「判断 + 详情页证据清单」——原单框证据（w）并入 items；新增整体评论与收获 */
      if(bk && bk.ver < 16){
        var f16 = bk.fx || (bk.fx = {});
        if(!f16.etiquette || typeof f16.etiquette !== 'object') f16.etiquette = { r9:'', r10:[], r11:[] };
        ['r9w','r10w','r11w'].forEach(function(k){ if(typeof f16.etiquette[k] !== 'string') f16.etiquette[k] = ''; });
        if(!f16.critique || typeof f16.critique !== 'object' || Array.isArray(f16.critique)) f16.critique = {};
        ['r12','r13','r14','r15'].forEach(function(k){
          var c16 = f16.critique[k];
          if(!c16 || typeof c16 !== 'object') return;
          if(!Array.isArray(c16.items)){
            c16.items = [];
            if(String(c16.w||'').trim()) c16.items.push({ t: String(c16.w).trim() });
          }
          delete c16.w;
        });
        f16.overall = f16.overall || '';
        f16.gain = f16.gain || '';
        bk.ver = 16;
      }
      /* 越界钳制（旧版本可能残留超范围编号） */
      if(bk.cur > STEP_N + 4) bk.cur = STEP_N + 4;
      if(bk.cur < 1) bk.cur = 1;
    });
  })();
